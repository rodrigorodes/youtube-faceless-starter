{
  "capitulo": "07-producao-assincrona-e-custos",
  "titulo": "Produção assíncrona e custos",
  "prefixo": "PRO",
  "como_funciona": "O coordenador de produção orquestra a execução assíncrona das etapas do vídeo através de um DAG acíclico canônico (research -> script -> factcheck -> storyboard -> assets -> render -> qa -> approval -> publish). Cada execução é representada por um ProductionRun com máquina de estados fechada. A concorrência entre workers é regulada por leases com fencing tokens monótonos e batimentos periódicos (heartbeat). Operações de ciclo de vida (pause, resume, retry, regenerate) controlam se o snapshot de configuração é congelado ou reavaliado. O BudgetGuard intercepta operações pagas, exige reserva prévia contra tetos configurados no canal e reconcilia confirmações ou estornos no usage_ledger.",
  "resumo": "12 cenários A_PROJETAR. Plano documental direto, sem workflow e sem executar chamadas reais nem consumir provedores pagos. Avalia integridade do DAG, idempotência, isolamento de leases, persistência de snapshots, guardas orçamentárias e estornos.",
  "regras": [
    {
      "id": "PRO.R01",
      "fontes": [
        "renderer/app/studio/domain/production_run.py:35-57",
        "renderer/app/studio/domain/production_run.py:246-255"
      ],
      "resumo": "DAG de produção é fechado, acíclico e segue topologia obrigatória; transições de RunState e StageState são restritas à matriz canônica."
    },
    {
      "id": "PRO.R02",
      "fontes": [
        "renderer/app/studio/domain/production_run.py:195-220",
        "renderer/app/studio/adapters/postgres/production_repo.py:194-253"
      ],
      "resumo": "Chave de idempotência deve ser canônica ASCII em [a-z0-9._:-] com até 128 chars; repetição com mesmo payload devolve execução existente; payload divergente dispara ProductionIdempotencyConflict."
    },
    {
      "id": "PRO.R03",
      "fontes": [
        "renderer/app/studio/domain/production_run.py:390-420",
        "renderer/app/studio/application/lease_heartbeat.py:21-50"
      ],
      "resumo": "Leases de estágio usam fencing tokens monótonos; expiração de lease ou batimento perdido revoga posse (LeaseLost) e impede que worker obsoleto grave resultado."
    },
    {
      "id": "PRO.R04",
      "fontes": [
        "renderer/app/studio/domain/production_run.py:59-98"
      ],
      "resumo": "Operações de ciclo de vida: resume e retry preservam estritamente o snapshot congelado do run; regenerate e new_run criam novo run e resolvem nova configuração."
    },
    {
      "id": "PRO.R05",
      "fontes": [
        "renderer/app/studio/domain/channel_budget.py:23-125",
        "renderer/app/studio/application/budget.py:61-120"
      ],
      "resumo": "BudgetGuard valida limites por canal (teto por vídeo e mensal); operações pagas exigem reserva antecipada e são recusadas com BudgetDenied quando o saldo é insuficiente."
    },
    {
      "id": "PRO.R06",
      "fontes": [
        "renderer/app/studio/application/budget.py:400-475",
        "renderer/app/studio/adapters/postgres/budget_repo.py:263-394"
      ],
      "resumo": "Reservas de orçamento confirmadas gravam lançamento no usage_ledger; falhas e cancelamentos estornam reservas pendentes impedindo cobrança órfã."
    },
    {
      "id": "PRO.R07",
      "fontes": [
        "renderer/app/studio/domain/production_run.py:246-259",
        "renderer/app/studio/adapters/postgres/production_repo.py:596-618"
      ],
      "resumo": "Cancelamento transiciona run para CANCELLED, encerra leases ativos e marca estágios pendentes como SKIPPED/CANCELLED sem derrubar o processo do worker."
    },
    {
      "id": "PRO.R08",
      "fontes": [
        "renderer/app/studio/application/panel.py:82-117",
        "renderer/app/studio/domain/channel_budget.py:118-140"
      ],
      "resumo": "CostBreakdown projeta custos por provedor antes da execução e consolida valores reais gastos e economizados via cache."
    }
  ],
