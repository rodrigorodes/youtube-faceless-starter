  "como_funciona": "ContentBrief valida entradas, sem pesquisar nem verificar referências. Fontes alimentam claims; o gerador curto cria cenas e o longform usa outline e cenas. Fact-check é lexical/determinístico. Edições idempotentes criam versões; restore exige plano longo e snapshot. Aprovação longa prende versão e hash.",
  "resumo": "10 cenários documentais. Execução direta, sem runtime de workflow. Todos A_PROJETAR; testes citados são referências existentes, não comprovação de aprovação. Usar somente fixtures sintéticas e dublês; integração futura em banco descartável.",
  "regras": [
