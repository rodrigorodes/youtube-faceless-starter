    {"id":"EDT.R07","resumo":"Restore cria nova versão de snapshot longo; aprovação depende da última versão, hash e fact-check correspondente.","fontes":["renderer/app/studio/application/longform.py:740-777","renderer/app/studio/application/longform.py:801-832"]},
