    {"id":"EDT-04","titulo":"Citação ausente recuperada pelo parser","tipo":"regressao/erro","regras":["EDT.R03","EDT.R04"],"status":"A_PROJETAR","prioridade":"alta","objetivo":"Documentar tolerância real sem confundi-la com lastro factual.","pre_condicoes":["Ids válidos c1 e c2; c1 contém 3600; c2 contém 4200."],"exemplo":{"dados":"Cena 0 fala 4200 e não cita; cena 1 cita c2.","passos":["Analisar as duas cenas e verificar claim atribuída à cena 0.","Rodar fact-check com as cenas resultantes.","Repetir parser com todas as citações vazias."]},"esperado":"Cena isolada recebe c1 por ordenação, podendo reprovar o número no fact-check; todas sem citação são recusadas.","limitacoes":"Exigir citação explícita em toda cena seria endurecimento proposto, não comportamento atual; docs/12-editorial.md:38 diverge desta tolerância.","automacao":{"camada":"unit","referencia":"Proposto: estender tests/test_editorial.py para fallback de claim isolada."}},
