    {"id":"REN-08","titulo":"Falha e timeout FFmpeg não publicam sucesso","tipo":"erro","regras":["REN.R05","REN.R07"],"status":"A_PROJETAR","prioridade":"alta","objetivo":"Conservar estado e diagnóstico diante de erro técnico.","pre_condicoes":["Runner injetado, files/jobs espiões; vídeo ASSETS_READY."],"exemplo":{"dados":"Plano de 480 s; timeout_floor=300; falhas no shot, concat e mix.","passos":["Capturar timeout esperado 1740 s nos comandos.","Simular erro/timeout em cada etapa.","Inspecionar FAILED, cleanup, publish e prune."]},"esperado":"Falha técnica não completa job nem publica sucesso; causa fica no job com caminho work sanitizado; limpeza é tentada; prune não apaga vencedor anterior.","limitacoes":"Timeout do subprocesso não significa rollback de arquivos intermediários; falha simultânea do banco pode impedir registro de FAILED.","automacao":{"camada":"mock","referencia":"Existentes: tests/test_render_plan_executor.py e tests/test_render.py; matriz de falhas proposta."}},
    {"id":"REN-09","titulo":"QA incompleto e métricas de fronteira","tipo":"erro/borda","regras":["REN.R06"],"status":"A_PROJETAR","prioridade":"alta","objetivo":"Distinguir cobertura, bloqueio e warning.","pre_condicoes":["Plano válido e QualityEvidence sintética com baseline completo."],"exemplo":{"dados":"Sem media; sem descriptors; true_peak=0/+0.01/-0.5 dBTP; codec vp9; frozen_ratio=0.20/0.21.","passos":["Remover métricas/descritores do baseline.","Variar uma métrica por fixture.","Ler coverage, severidade e checks_run."]},"esperado":"Ausências declaram not_verified; pico positivo e codec incompatível bloqueiam; -0.5 dBTP gera warning; congelamento acima de 20% gera warning, não aprovação semântica.","limitacoes":"Checks opcionais só rodam quando respectivas métricas existem; não afirmar cobertura multimodal sem provedor.","automacao":{"camada":"unit","referencia":"Existentes: tests/test_quality_v2_domain.py e tests/test_quality_semantic_v2.py; matriz proposta."}},
    {"id":"REN-10","titulo":"Perda de posse antes de publicar resultado","tipo":"concorrencia/erro","regras":["REN.R07"],"status":"A_PROJETAR","prioridade":"alta","objetivo":"Evitar substituir saída por job que perdeu validade.","pre_condicoes":["Job em execução com MP4 sintético e QA dublê; jobs.alive controlável."],"exemplo":{"dados":"alive=false após QA; variante complete=false após publish.","passos":["Encerrar validade antes de checar alive.","Em outra fixture perder comparação na conclusão.","Verificar chamadas publish/complete/prune e arquivo anterior."]},"esperado":"alive=false bloqueia publish; complete=false impede prune e conclusão vitoriosa; erro é tratado como falha.","limitacoes":"Janela publish→complete pode deixar arquivo órfão; garantia de zero órfãos não é afirmada. Limpeza transacional seria requisito adicional.","automacao":{"camada":"mock","referencia":"Existente: tests/test_render.py; interleavings propostos."}},
    {"id":"REN-11","titulo":"Invalidar só dependências e recompor final","tipo":"regressao/volume","regras":["REN.R08","REN.R05"],"status":"A_PROJETAR","prioridade":"alta","objetivo":"Evitar TTS e FFmpeg desnecessários sem servir final antigo.","pre_condicoes":["Plano revision=1 com artefatos íntegros para 20 cenas; índices de cache preenchidos."],"exemplo":{"dados":"Revision=2 muda apenas asset de S7; variante muda só narração S7; variante sem alterações.","passos":["Decidir regeneração para cada variante.","Executar com runner espião e comparar nós/chamadas.","Remover entry de nó reutilizável e decidir novamente."]},"esperado":"Mudança invalida seus dependentes e final; cenas não impactadas reutilizam; entrada ausente aparece missing; sem alteração e com final íntegro pode copiar MP4 final.","limitacoes":"PlanRegeneration.decide não verifica bytes; integridade precisa ser confirmada pelo executor/resolvedor antes do reúso.","automacao":{"camada":"mock","referencia":"Existentes: tests/test_render_regeneration.py e tests/test_render_reuse.py:277-312; lote proposto."}},
