{
  "capitulo":"06-voz-render-e-qualidade",
  "titulo":"Voz, render e qualidade",
  "prefixo":"REN",
  "como_funciona":"StartRender cria/reutiliza job e despacha só o recém-criado. RunRender resolve configuração, narra ou reutiliza WAV íntegro, calcula durações, monta cues, renderiza e mede QA antes de publicar. RenderPlan separa plano, compilação e execução FFmpeg. Cache invalida dependentes e recompõe final quando alguma cena muda.",
  "resumo":"12 cenários A_PROJETAR. Plano documental direto, sem workflow e sem executar testes, TTS ou FFmpeg. Referências existentes não são PASS. Futuras medições usam mídia sintética e diretório descartável.",
  "regras":[
    {"id":"REN.R01","resumo":"Render aceita ASSETS_READY/RENDERED; enqueue repetido só dispara execução quando created; falha na fila marca job e retorna indisponibilidade.","fontes":["renderer/app/studio/application/render.py:138-154"]},
    {"id":"REN.R02","resumo":"Voz e estilo partem de configuração da execução; narração cacheada exige fingerprint texto/voz e SHA físico; duração de WAV reutilizado é medida.","fontes":["renderer/app/studio/application/render.py:238-334"]},
    {"id":"REN.R03","resumo":"Cenas incluem 0.30 s de lead e 0.50 s de tail arredondados a 25 fps; limites short=175 s e long=1200 s; cues são proporcionais, sem alinhamento forçado.","fontes":["renderer/app/studio/domain/render.py:8-22","renderer/app/studio/domain/render.py:50-109","renderer/app/studio/application/render.py:335-352"]},
    {"id":"REN.R04","resumo":"Áudio seleciona faixa por tags ou primeira como fallback; mix declara ganho/ducking/fades; compilador aplica sidechaincompress e loudnorm.","fontes":["renderer/app/studio/application/audio_director.py:28-88","renderer/app/studio/adapters/render_plan_compiler.py:46-83"]},
    {"id":"REN.R05","resumo":"Executor roda shots/concat/mix, admite reúso físico e timeout proporcional; checa quantidade de arquivos de fala.","fontes":["renderer/app/studio/adapters/render_plan_ffmpeg.py:678-746"]},
    {"id":"REN.R06","resumo":"QA incompleto declara not_verified; clipping acima de 0 dBTP bloqueia, codecs incompatíveis bloqueiam e congelamento acima de 20% gera warning.","fontes":["renderer/app/studio/domain/quality.py:227-332"]},
    {"id":"REN.R07","resumo":"Publicação exige job ainda vivo; complete precede prune; falhas técnicas viram FAILED e limpeza é tentada no finally.","fontes":["renderer/app/studio/application/render.py:198-236","renderer/app/studio/application/render.py:359-373"]},
    {"id":"REN.R08","resumo":"Regeneração compara fingerprints por nó e invalida final por dependência; decisão não executa FFmpeg nem verifica arquivo físico.","fontes":["renderer/app/studio/application/render_cache.py:7-15","renderer/app/studio/application/render_cache.py:65-91"]},
