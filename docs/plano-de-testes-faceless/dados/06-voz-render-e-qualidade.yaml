    {"id":"REN-04","titulo":"Duração por quadros e teto de formato","tipo":"borda/volume/erro","regras":["REN.R03"],"status":"A_PROJETAR","prioridade":"alta","objetivo":"Recusar vídeo acima do teto antes de executar renderer.","pre_condicoes":["Voice dublê retorna durações controladas; renderer espião."],"exemplo":{"dados":"Fala 6.8 s resulta cena 7.6 s; lotes cuja soma é 175/175.04 s e 1200/1200.04 s.","passos":["Calcular duração por cena com lead/tail.","Renderizar fixtures no teto e um quadro acima.","Usar 100 cenas curtas para verificar acumulação e offsets."]},"esperado":"Duração é múltipla de 1/25 s; acima do teto falha antes do renderer; no teto passa esta validação, sujeito às demais regras.","limitacoes":"Tempo estimado por palavras não é duração final; lote não estabelece meta de desempenho.","automacao":{"camada":"mock","referencia":"Existentes: tests/test_narration_duration.py, tests/test_render.py e tests/test_render_plan_timeline.py; matriz de limites proposta."}},
    {"id":"REN-05","titulo":"Legendas proporcionais e texto narrado","tipo":"feliz/borda/regressao","regras":["REN.R03"],"status":"A_PROJETAR","prioridade":"alta","objetivo":"Manter cues dentro da fala e exportar SRT coerente.","pre_condicoes":["Funções puras; cena com narration diferente de caption."],"exemplo":{"dados":"Fala de 10 s, offset=7.6 s, palavra de 90 caracteres, acentos e vírgulas.","passos":["Gerar chunks/cues e serializar SRT.","Comparar início com offset+0.30 e fim com início+10.","Verificar sequência, limite de 42 caracteres e origem do texto."]},"esperado":"Trechos não vazios, sem sobreposição e proporcionais ao tamanho; palavra longa é partida; SRT usa narration e numeração crescente.","limitacoes":"Não há alinhamento fonético/palavra a palavra; legibilidade e sincronismo percebido exigem revisão manual futura.","automacao":{"camada":"unit","referencia":"Existentes: tests/test_render_domain.py e tests/test_captions_ass.py; matriz de texto longo proposta."}},
    {"id":"REN-06","titulo":"Música, fallback e ducking sem mascarar voz","tipo":"feliz/erro/regressao","regras":["REN.R04","REN.R06"],"status":"A_PROJETAR","prioridade":"alta","objetivo":"Verificar mix configurado e voz separadamente.","pre_condicoes":["Catálogo sintético com faixas licenciadas; plano com AudioMix."],"exemplo":{"dados":"Tom sci-fi; uma faixa scifi, outra calma; music_gain=0.35, ducking_ratio=12.","passos":["Selecionar faixa por tag, por tom sem correspondência e catálogo vazio.","Compilar mix e conferir parâmetros.","Em integração futura misturar música audível com narração silenciosa e medir QA isolado da voz."]},"esperado":"Tag seleciona faixa compatível; sem match usa primeira; vazio retorna None; mix contém ducking/loudnorm; música não deve fazer voz silenciosa parecer válida no QA.","limitacoes":"Seleção por tags não comprova adequação artística nem licença do arquivo efetivamente usado.","automacao":{"camada":"local-integrado","referencia":"Existentes: tests/test_audio_director.py, tests/test_music_catalog.py e tests/test_quality_ffmpeg_v2.py; combinação proposta."}},
