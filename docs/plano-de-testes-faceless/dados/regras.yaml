[
  {
    "id": "AUT.R01",
    "f": "F01",
    "texto": "Studio exige usuário, senha e token distintos e não vazios; usuário não contém dois-pontos. Configuração inválida retorna 503; credencial ausente/incorreta retorna 401.",
    "fonte": "renderer/app/studio/api/routes.py:160-184"
  },
  {
    "id": "AUT.R02",
    "f": "F01",
    "texto": "Host deve estar permitido. Basic em mutação exige Origin da mesma origem; Bearer rejeita qualquer cabeçalho Origin. O worker não representa um tenant nem um papel de menor privilégio.",
    "fonte": "renderer/app/studio/api/routes.py:117-131, renderer/app/studio/api/routes.py:176-184, renderer/app/studio/api/routes.py:1111"
  },
  {
    "id": "AUT.R03",
    "f": "F01",
    "texto": "Consentimento verifica state, validade e PKCE antes da troca; respostas públicas não incluem tokens. O state é removido após a conclusão, sem consumo atômico visível no caso de uso.",
    "fonte": "renderer/app/studio/application/youtube_oauth.py:153-196, renderer/app/studio/application/connections.py:171-224"
  },
  {
    "id": "AUT.R04",
    "f": "F01",
    "texto": "Cofre de arquivos valida escopo/chave, grava via replace com diretório 0700 e arquivo 0600; lock é por instância. Listagem externa deve conter nomes/metadados, nunca valores.",
    "fonte": "renderer/app/studio/adapters/secret_store.py:24-108"
  },
  {
    "id": "AUT.R05",
    "f": "F01",
    "texto": "Rotas legadas /videos retornam 410; /health é independente da autenticação Studio e informa studio_db.",
    "fonte": "renderer/app/main.py:52-60"
  },
  {
    "id": "CFG.R01",
    "f": "F02",
    "texto": "Canal reúne projeto, perfil, revisão, budget e configuração; criação transacional aceita replay da chave com mesmo payload e recusa divergência. Chave ausente é aceita pela API atual.",
    "fonte": "renderer/app/studio/application/channel_creation.py:1-9, tests/test_channel_preferences_api.py:28-90"
  },
  {
    "id": "CFG.R02",
    "f": "F02",
    "texto": "project_id propaga contexto de navegação; vídeo mantém seu projeto proprietário. Canal não é tenant nem fronteira de autenticação.",
    "fonte": "renderer/app/studio/api/active_channel.py:1-11, renderer/app/studio/api/active_channel.py:50-69, renderer/app/studio/api/routes.py:1111"
  },
  {
    "id": "CFG.R03",
    "f": "F02",
    "texto": "Estilo do vídeo precede canal e default; patches seguem vídeo > canal > estilo > motor. Snapshot criativo é canônico e não carrega segredos, saldo ou autorização; retomada não resolve configuração novamente.",
    "fonte": "renderer/app/studio/domain/effective_config.py:570-655, renderer/app/studio/domain/effective_config.py:336-365, renderer/app/studio/application/production.py:795-825, renderer/app/studio/application/production.py:906"
  },
  {
    "id": "CFG.R04",
    "f": "F02",
    "texto": "Preferências incluem modo e formato padrão; limites soft não podem exceder hard. Budget mede canal e global separadamente e nenhum canal afrouxa o teto global.",
    "fonte": "renderer/app/studio/application/channel_creation.py:91-153, renderer/app/studio/application/channel_budget.py:38-67, tests/test_channel_preferences_api.py:151-171"
  },
  {
    "id": "CFG.R05",
    "f": "F02",
    "texto": "Conexões separam conta Google, identidade YouTube, grant e vínculo ao perfil; estado exibido deriva do cofre. Revogação de autorização deve afetar somente o vínculo escolhido.",
    "fonte": "renderer/app/studio/application/connections.py:197-224, renderer/app/studio/application/connections.py:227-276, tests/test_connections_service.py:342-362"
  },
  {
    "id": "CFG.R06",
    "f": "F02",
    "texto": "Equipe resolve ator pelo STUDIO_BROWSER_USER e vínculo organizacional, aplicando RBAC; o seletor de canal não cria identidade individual. O guard geral também aceita worker.",
    "fonte": "renderer/app/studio/api/routes.py:1956-2029, renderer/app/studio/api/routes.py:160-184"
  },
  {
    "id": "TEN.R01",
    "f": "F03",
    "texto": "Ingestão exige projeto existente e lote de 1 a 50 itens; valida todo o lote antes do upsert. Fonte usa HTTPS e host permitido.",
    "fonte": "renderer/app/studio/application/trends.py:13-17, renderer/app/studio/domain/trends.py:25-50"
  },
  {
    "id": "TEN.R02",
    "f": "F03",
    "texto": "Datas exigem timezone; observed_at admite até 300 segundos futuros; janela não pode inverter. Código compara timedelta.days > 31, portanto a fronteira efetiva difere de um máximo estrito de 31 dias.",
    "fonte": "renderer/app/studio/domain/trends.py:52-62"
  },
  {
    "id": "TEN.R03",
    "f": "F03",
    "texto": "Upsert identifica projeto, tópico normalizado, fonte e fim de janela; atualiza métricas/evidências mas não source_url no conflito. Favoritos têm chave projeto e video_id.",
    "fonte": "renderer/app/studio/adapters/postgres/trend_repo.py:106-149, renderer/app/studio/adapters/postgres/trend_repo.py:197-245"
  },
  {
    "id": "TEN.R04",
    "f": "F03",
    "texto": "Pontuação aceita 1 a 20 tópicos únicos, não vazios, de até 150 caracteres; resposta cobre exatamente todos os tópicos. Ordem é decrescente e empate preserva ordem de entrada.",
    "fonte": "renderer/app/studio/application/ideas.py:45-60, renderer/app/studio/application/ideas.py:69-96"
  },
  {
    "id": "TEN.R05",
    "f": "F03",
    "texto": "Guard de custo antecede chamada paga; saída inválida não vira ranking parcial. Com PaidOperationGuard, validação antecede settlement; sem ele, uso já é registrado antes do parse.",
    "fonte": "renderer/app/studio/application/ideas.py:81-94"
  },
  {
    "id": "TEN.R06",
    "f": "F03",
    "texto": "Evidência admite URL HTTP e até 10 entradas; a allowlist de source_url não valida o host de cada evidence.url. Ingestão não prova veracidade da fonte.",
    "fonte": "renderer/app/studio/domain/trends.py:13-36, renderer/app/studio/domain/trends.py:47-50"
  },
  {
    "id": "EDT.R01",
    "f": "F04",
    "texto": "Brief imutável, campos extras proibidos, versão 1 e duração inteira positiva; referências não são fontes verificadas.",
    "fonte": "renderer/app/studio/domain/content_brief.py:1-34"
  },
  {
    "id": "EDT.R02",
    "f": "F04",
    "texto": "URL buscada exige allowlist; texto colado só exige URL HTTP válida e texto não vazio dentro do limite.",
    "fonte": "renderer/app/studio/application/editorial.py:191-267"
  },
  {
    "id": "EDT.R03",
    "f": "F04",
    "texto": "Gerar exige IDEA/SCRIPTED e claims; parser valida cenas, recusa ids desconhecidos, mas preenche citação isolada ausente com primeiro id válido.",
    "fonte": "renderer/app/studio/application/editorial.py:330-386, renderer/app/studio/application/editorial.py:369-428"
  },
  {
    "id": "EDT.R04",
    "f": "F04",
    "texto": "Fact-check cobre narração/caption/label e nomes do prompt, exige versão estável e preserva problemas no override motivado.",
    "fonte": "renderer/app/studio/application/editorial.py:470-494"
  },
  {
    "id": "EDT.R05",
    "f": "F04",
    "texto": "Diretor valida JSON e limita orçamento declarado; guard é opcional e valida resposta antes de confirmar custo.",
    "fonte": "renderer/app/studio/application/creative_director.py:55-95"
  },
  {
    "id": "EDT.R06",
    "f": "F04",
    "texto": "Edição usa versão esperada e hash de payload; replay não cria versão; ordem deve ser permutação; roteiro curto mantém ao menos uma cena.",
    "fonte": "renderer/app/studio/application/longform.py:426-532, renderer/app/studio/application/longform.py:561-661"
  },
  {
    "id": "EDT.R07",
    "f": "F04",
    "texto": "Restore cria nova versão de snapshot longo; aprovação depende da última versão, hash e fact-check correspondente.",
    "fonte": "renderer/app/studio/application/longform.py:740-777, renderer/app/studio/application/longform.py:801-832"
  },
  {
    "id": "EDT.R08",
    "f": "F04",
    "texto": "Longform faz duas chamadas e revisão estrutural/factual/duração; alvo explícito vence configuração e default é 480 s. Caminho pago acessa usage no retorno já transformado pelo guard: inconsistência estática a caracterizar.",
    "fonte": "renderer/app/studio/application/longform.py:294-374, renderer/app/studio/application/budget.py:427-469"
  },
  {
    "id": "MID.R01",
    "f": "F05",
    "texto": "Transição de storyboard só a partir de FACT_CHECKED com cenas, mediante comparação do estado.",
    "fonte": "renderer/app/studio/application/media.py:32-43"
  },
  {
    "id": "MID.R02",
    "f": "F05",
    "texto": "Produção trava por vídeo, pula cenas vinculadas, calcula chave por modelo/prompt/aspecto, vincula condicionada ao prompt e só avança ao fim.",
    "fonte": "renderer/app/studio/application/media.py:60-90"
  },
  {
    "id": "MID.R03",
    "f": "F05",
    "texto": "Imagem gerada exige licença não branca e MIME PNG/JPEG/WebP; store precede registro; retorno preserva atribuição e URL.",
    "fonte": "renderer/app/studio/application/media.py:92-121"
  },
  {
    "id": "MID.R04",
    "f": "F05",
    "texto": "Busca usa prompt sem estilo, orientação do formato e até duas queries extras, deduplica por media_id/URL e limita resultado ranqueado a per_page.",
    "fonte": "renderer/app/studio/application/media.py:164-226"
  },
  {
    "id": "MID.R05",
    "f": "F05",
    "texto": "Swap aceita asset ou candidato, nunca ambos; sem escolha é no-op. Verifica licença, versão opcional e CAS do vínculo; materialização faz fetch antes de consultar cache.",
    "fonte": "renderer/app/studio/application/media.py:255-308"
  },
  {
    "id": "MID.R06",
    "f": "F05",
    "texto": "Shots devem existir no manifesto; sub-tick é recusado; resíduo até max(2 ticks, 0.2 s em ticks) ajusta último shot sem deixá-lo vazio.",
    "fonte": "renderer/app/studio/domain/render_plan_builder.py:341-400"
  },
  {
    "id": "MID.R07",
    "f": "F05",
    "texto": "B-roll normaliza nota e limita a 200 caracteres; preview resolve arquivo dentro da raiz e recusa fuga/ausência.",
    "fonte": "renderer/app/studio/application/media.py:332-376"
  },
  {
    "id": "REN.R01",
    "f": "F06",
    "texto": "Render aceita ASSETS_READY/RENDERED; enqueue repetido só dispara execução quando created; falha na fila marca job e retorna indisponibilidade.",
    "fonte": "renderer/app/studio/application/render.py:138-154"
  },
  {
    "id": "REN.R02",
    "f": "F06",
    "texto": "Voz e estilo partem de configuração da execução; narração cacheada exige fingerprint texto/voz e SHA físico; duração de WAV reutilizado é medida.",
    "fonte": "renderer/app/studio/application/render.py:238-334"
  },
  {
    "id": "REN.R03",
    "f": "F06",
    "texto": "Cenas incluem 0.30 s de lead e 0.50 s de tail arredondados a 25 fps; limites short=175 s e long=1200 s; cues são proporcionais, sem alinhamento forçado.",
    "fonte": "renderer/app/studio/domain/render.py:8-22, renderer/app/studio/domain/render.py:50-109, renderer/app/studio/application/render.py:335-352"
  },
  {
    "id": "REN.R04",
    "f": "F06",
    "texto": "Áudio seleciona faixa por tags ou primeira como fallback; mix declara ganho/ducking/fades; compilador aplica sidechaincompress e loudnorm.",
    "fonte": "renderer/app/studio/application/audio_director.py:28-88, renderer/app/studio/adapters/render_plan_compiler.py:46-83"
  },
  {
    "id": "REN.R05",
    "f": "F06",
    "texto": "Executor roda shots/concat/mix, admite reúso físico e timeout proporcional; checa quantidade de arquivos de fala.",
    "fonte": "renderer/app/studio/adapters/render_plan_ffmpeg.py:678-746"
  },
  {
    "id": "REN.R06",
    "f": "F06",
    "texto": "QA incompleto declara not_verified; clipping acima de 0 dBTP bloqueia, codecs incompatíveis bloqueiam e congelamento acima de 20% gera warning.",
    "fonte": "renderer/app/studio/domain/quality.py:227-332"
  },
  {
    "id": "REN.R07",
    "f": "F06",
    "texto": "Publicação exige job ainda vivo; complete precede prune; falhas técnicas viram FAILED e limpeza é tentada no finally.",
    "fonte": "renderer/app/studio/application/render.py:198-236, renderer/app/studio/application/render.py:359-373"
  },
  {
    "id": "REN.R08",
    "f": "F06",
    "texto": "Regeneração compara fingerprints por nó e invalida final por dependência; decisão não executa FFmpeg nem verifica arquivo físico.",
    "fonte": "renderer/app/studio/application/render_cache.py:7-15, renderer/app/studio/application/render_cache.py:65-91"
  },
  {
    "id": "REN.R09",
    "f": "F06",
    "texto": "Regeneração de narração individual usa temporário fixo por cena, salva duração e usa chave paga narration:video:scene, sem texto/voz na chave.",
    "fonte": "renderer/app/studio/application/scene_narration.py:103-137"
  },
  {
    "id": "PRO.R01",
    "f": "F07",
    "texto": "DAG de produção é fechado, acíclico e segue topologia obrigatória; transições de RunState e StageState são restritas à matriz canônica.",
    "fonte": "renderer/app/studio/domain/production_run.py:35-57, renderer/app/studio/domain/production_run.py:246-255"
  },
  {
    "id": "PRO.R02",
    "f": "F07",
    "texto": "Chave de idempotência deve ser canônica ASCII em [a-z0-9._:-] com até 128 chars; repetição com mesmo payload devolve execução existente; payload divergente dispara ProductionIdempotencyConflict.",
    "fonte": "renderer/app/studio/domain/production_run.py:195-220, renderer/app/studio/adapters/postgres/production_repo.py:194-253"
  },
  {
    "id": "PRO.R03",
    "f": "F07",
    "texto": "Leases de estágio usam fencing tokens monótonos; expiração de lease ou batimento perdido revoga posse (LeaseLost) e impede que worker obsoleto grave resultado.",
    "fonte": "renderer/app/studio/domain/production_run.py:390-420, renderer/app/studio/application/lease_heartbeat.py:21-50"
  },
  {
    "id": "PRO.R04",
    "f": "F07",
    "texto": "Operações de ciclo de vida: resume e retry preservam estritamente o snapshot congelado do run; regenerate e new_run criam novo run e resolvem nova configuração.",
    "fonte": "renderer/app/studio/domain/production_run.py:59-98"
  },
  {
    "id": "PRO.R05",
    "f": "F07",
    "texto": "BudgetGuard valida limites por canal (teto por vídeo e mensal); operações pagas exigem reserva antecipada e são recusadas com BudgetDenied quando o saldo é insuficiente.",
    "fonte": "renderer/app/studio/domain/channel_budget.py:23-125, renderer/app/studio/application/budget.py:61-120"
  },
  {
    "id": "PRO.R06",
    "f": "F07",
    "texto": "Reservas de orçamento confirmadas gravam lançamento no usage_ledger; falhas e cancelamentos estornam reservas pendentes impedindo cobrança órfã.",
    "fonte": "renderer/app/studio/application/budget.py:400-475, renderer/app/studio/adapters/postgres/budget_repo.py:263-394"
  },
  {
    "id": "PRO.R07",
    "f": "F07",
    "texto": "Cancelamento transiciona run para CANCELLED, encerra leases ativos e marca estágios pendentes como SKIPPED/CANCELLED sem derrubar o processo do worker.",
    "fonte": "renderer/app/studio/domain/production_run.py:246-259, renderer/app/studio/adapters/postgres/production_repo.py:596-618"
  },
  {
    "id": "PRO.R08",
    "f": "F07",
    "texto": "CostBreakdown projeta custos por provedor antes da execução e consolida valores reais gastos e economizados via cache.",
    "fonte": "renderer/app/studio/application/panel.py:82-117, renderer/app/studio/domain/channel_budget.py:118-140"
  },
  {
    "id": "PUB.R01",
    "f": "F08",
    "texto": "Aprovação exige revisão renderizada; gate compara intenção, output, checksum e QA ou override registrado.",
    "fonte": "renderer/app/studio/application/publishing.py:42-69, renderer/app/studio/application/publication_gate.py:37-60"
  },
  {
    "id": "PUB.R02",
    "f": "F08",
    "texto": "Intenção fixa metadados/destino; private é padrão e public exige confirmação adicional.",
    "fonte": "renderer/app/studio/application/publication_gate.py:52-58, tests/test_publication_policy.py:55-99, tests/test_publication_api.py:94-108"
  },
  {
    "id": "PUB.R03",
    "f": "F08",
    "texto": "Claims concorrentes usam locks; retry preserva sessão e UNKNOWN não entra em retry automático.",
    "fonte": "renderer/app/studio/adapters/postgres/publish_repo.py:115-178, renderer/app/studio/application/publication_execution.py:298-345"
  },
  {
    "id": "PUB.R04",
    "f": "F08",
    "texto": "Rearm só aceita DLQ permanente sem sessão, ID remoto, offset, UNKNOWN ou lease vivo; reconciliação depende de resposta remota.",
    "fonte": "renderer/app/studio/adapters/postgres/publish_repo.py:316-330, renderer/app/studio/application/publication_execution.py:361-395"
  },
  {
    "id": "PUB.R05",
    "f": "F08",
    "texto": "Servidor com repositórios injetados exige destino e token do mesmo canal; flag desabilitada bloqueia antes do claim; agendamento vencido/próximo bloqueia.",
    "fonte": "renderer/app/studio/application/publication_execution.py:205-242, renderer/app/studio/application/publication_execution.py:250-297"
  },
  {
    "id": "PUB.R06",
    "f": "F08",
    "texto": "Preview mostra versão revisada; pedir ajustes reabre edição e invalida aprovação anterior.",
    "fonte": "tests/test_publish_api.py:215-292, tests/e2e_full/test_journey_piloto.py:115-158"
  },
  {
    "id": "ANA.R01",
    "f": "F09",
    "texto": "Sem prontidão, coleta não chama provedor; ausência não equivale a zero.",
    "fonte": "renderer/app/studio/application/analytics_collection.py:148-192, renderer/app/studio/application/analytics_collection.py:203-232"
  },
  {
    "id": "ANA.R02",
    "f": "F09",
    "texto": "ID determinístico por vídeo/métrica/janela/ID remoto permite persistência idempotente; pilar deve pertencer ao projeto.",
    "fonte": "renderer/app/studio/application/analytics_collection.py:165-173, renderer/app/studio/application/analytics_collection.py:207-230, tests/test_analytics_repo.py:121-144"
  },
  {
    "id": "ANA.R03",
    "f": "F09",
    "texto": "Dashboard mantém recorte por vídeo/pilar/período, separa short e long, não faz média de taxas nem soma cobertura incompleta.",
    "fonte": "renderer/app/studio/application/analytics_dashboard.py:1-10, tests/test_analytics_dashboard.py:226-272, tests/test_analytics_repo.py:144-155"
  },
  {
    "id": "ANA.R04",
    "f": "F09",
    "texto": "Amostra mínima é três vídeos comparáveis; recomendação tem revisão humana e não aplicação automática; versões ausentes recebem motivo.",
    "fonte": "renderer/app/studio/application/analytics_dashboard.py:60, renderer/app/studio/application/analytics_dashboard.py:225-238, renderer/app/studio/application/analytics_collection.py:97-125"
  },
  {
    "id": "ANA.R05",
    "f": "F09",
    "texto": "Valores conhecidos precisam ser finitos, não negativos e percentuais até 100; observação mais recente vence dedupe.",
    "fonte": "renderer/app/studio/application/analytics_collection.py:128-136, renderer/app/studio/application/analytics_dashboard.py:301-315"
  },
  {
    "id": "ANA.R06",
    "f": "F09",
    "texto": "Alerta bridge é local ao processo e expira em 300 s; expiração OAuth exige metadado confiável com timezone e não prova validade do token.",
    "fonte": "renderer/app/studio/application/observability.py:11-54"
  },
  {
    "id": "UX.R01",
    "f": "F10",
    "texto": "Links de páginas permitidas propagam canal; vídeo conserva projeto proprietário; área inválida normaliza para cenas e nav usa aria-current.",
    "fonte": "renderer/app/studio/api/active_channel.py:22-69, renderer/app/studio/api/panel_video_nav.py:13-66"
  },
  {
    "id": "UX.R02",
    "f": "F10",
    "texto": "Resultado de publicação só é sucesso quando UPLOADED; demais resultados explicam próximo passo em português.",
    "fonte": "renderer/app/studio/api/publicacao_js.py:18-46, renderer/app/studio/api/publicacao_js.py:68-86"
  },
  {
    "id": "UX.R03",
    "f": "F10",
    "texto": "Helper traduz 422/409/429/5xx; ações devem manter feedback legível e recuperável sem JSON cru ou sucesso falso.",
    "fonte": "renderer/app/studio/api/erro_js.py:14-83, renderer/app/studio/api/panel_video.py:187"
  },
  {
    "id": "UX.R04",
    "f": "F10",
    "texto": "Garantir uso em 390/768/1280 px, navegação por teclado, foco e anúncio de erro; suites atuais não equivalem a auditoria completa.",
