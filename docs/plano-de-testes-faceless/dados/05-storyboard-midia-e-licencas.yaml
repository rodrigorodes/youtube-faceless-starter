  "como_funciona":"Storyboard exige FACT_CHECKED e cenas. ProduceAssets serializa por vídeo, gera somente cenas sem vínculo e consulta cache por conteúdo/aspecto. Busca combina prompt e até duas queries extras, deduplica e ranqueia candidatos. Swap usa id estável e CAS. RenderPlan admite múltiplos shots por cena, manifesto e duração em ticks.",
  "resumo":"10 cenários A_PROJETAR, exclusivamente documentais; execução direta sem workflow. Testes existentes indicam pontos de automação, não resultado. Integrações futuras usam banco e arquivos descartáveis; provedores são dublês.",
