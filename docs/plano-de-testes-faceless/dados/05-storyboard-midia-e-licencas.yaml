    {"id":"MID.R05","resumo":"Swap aceita asset ou candidato, nunca ambos; sem escolha é no-op. Verifica licença, versão opcional e CAS do vínculo; materialização faz fetch antes de consultar cache.","fontes":["renderer/app/studio/application/media.py:255-308"]},
