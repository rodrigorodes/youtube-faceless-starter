    "prefixo": "E2E",
    "arquivo": "11-ponta-a-ponta-e-desempenho",
    "nome": "Ponta a ponta e desempenho",
    "cenarios_count": 8,
    "regras_count": 5,
    "resumo": "Jornadas existentes atravessam UI e conferem estado pela API. Início distingue piloto de diretor; piloto produz até aprovação; diretor edita antes de produzir. Stack E2E usa texto demo, imagem placeholder, Piper e FFmpeg locais e termina pendente de publicar."
  },
  {
    "id": "F12",
    "prefixo": "OPS",
    "arquivo": "12-operacao-backup-e-n8n",
    "nome": "Operação, backup e n8n",
    "cenarios_count": 8,
    "regras_count": 7,
    "resumo": "Renderer recupera trabalho no ciclo de vida; PostgreSQL mantém migrações versionadas. Backup cobre dump do banco, não os arquivos de mídia/cofre. n8n orquestra publicação, coleta analytics e ingestão de tendências; os três JSON são distribuídos inativos. Este plano usa dublês e instâncias descartáveis, sem iniciar serviços nesta revisão."
  },
  {
    "id": "F13",
    "prefixo": "DRC",
    "arquivo": "13-direcao-e-composicao",
    "nome": "Direção criativa e composição",
    "cenarios_count": 8,
    "regras_count": 4,
    "resumo": "As seis áreas do workspace do vídeo (Direção criativa, Cenas & Storyboard, Composição & Legendas, Qualidade & Aprovação, Publicação YouTube, Fontes & Evidências) mais o diagnóstico de produção. A Direção criativa lê e grava o briefing por GET/POST/PUT em /direction; a Composição grava override por PATCH /style-patch com controle otimista. Achados de honestidade da tela de composição estão registrados como limitação."
  },
  {
    "id": "F14",
    "prefixo": "BIB",
    "arquivo": "14-biblioteca-e-midia",
    "nome": "Biblioteca e mídia compartilhada",
    "cenarios_count": 10,
    "regras_count": 6,
    "resumo": "A Biblioteca reúne cinco abas (Estilos visuais, Vozes, Músicas, Mídias & Stock, Modelos de roteiro). Estilos são a biblioteca compartilhada com criação, edição versionada, arquivamento e contagem de uso. Vozes e modelos são catálogo de referência; músicas vêm do manifest CC0 local; a busca Pixabay é opcional e responde honestamente sem chave."
