    "arquivo": "10-painel-e-experiencia",
    "nome": "Painel e experiência",
    "cenarios_count": 8,
    "regras_count": 5,
    "resumo": "O painel usa navegação de servidor, contexto de canal e áreas do vídeo. Helpers traduzem erros da API e resultados de publicação. Suites de browser existentes cobrem navegação, DOM, aprovação e três larguras de tela."
  },
  {
