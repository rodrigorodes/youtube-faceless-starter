    "nome": "Canais, configuração e conexões",
    "cenarios_count": 8,
    "regras_count": 6,
    "resumo": "A interface seleciona um projeto como canal ativo, enquanto produção preserva o dono do vídeo e congela configuração criativa por run. Conexões OAuth são entidades distintas do perfil editorial. Equipe possui vínculos organizacionais, mas o principal HTTP continua o operador configurado."
  },
  {
    "id": "F03",
    "prefixo": "TEN",
    "arquivo": "03-tendencias-e-ideias",
    "nome": "Tendências e ideias",
    "cenarios_count": 8,
    "regras_count": 6,
    "resumo": "Tendências são observações persistidas com fonte, janela, métrica e evidências. A ingestão valida o lote antes da escrita; favoritos guardam snapshots separados. Ideias usam modelo para notas e domínio para ordenação, com validação e controle de custo. Coleta n8n é coberta em OPS.C08."
  },
  {
    "id": "F04",
    "prefixo": "EDT",
    "arquivo": "04-editorial-e-roteiro",
    "nome": "Editorial e roteiro",
    "cenarios_count": 10,
    "regras_count": 8,
    "resumo": "ContentBrief valida entradas, sem pesquisar nem verificar referências. Fontes alimentam claims; o gerador curto cria cenas e o longform usa outline e cenas. Fact-check é lexical/determinístico. Edições idempotentes criam versões; restore exige plano longo e snapshot. Aprovação longa prende versão e hash."
  },
  {
    "id": "F05",
    "prefixo": "MID",
    "arquivo": "05-storyboard-midia-e-licencas",
    "nome": "Storyboard, mídia e licenças",
    "cenarios_count": 10,
    "regras_count": 7,
    "resumo": "Storyboard exige FACT_CHECKED e cenas. ProduceAssets serializa por vídeo, gera somente cenas sem vínculo e consulta cache por conteúdo/aspecto. Busca combina prompt e até duas queries extras, deduplica e ranqueia candidatos. Swap usa id estável e CAS. RenderPlan admite múltiplos shots por cena, manifesto e duração em ticks."
  },
  {
    "id": "F06",
    "prefixo": "REN",
    "arquivo": "06-voz-render-e-qualidade",
    "nome": "Voz, render e qualidade",
    "cenarios_count": 12,
    "regras_count": 9,
    "resumo": "StartRender cria/reutiliza job e despacha só o recém-criado. RunRender resolve configuração, narra ou reutiliza WAV íntegro, calcula durações, monta cues, renderiza e mede QA antes de publicar. RenderPlan separa plano, compilação e execução FFmpeg. Cache invalida dependentes e recompõe final quando alguma cena muda."
  },
  {
    "id": "F07",
    "prefixo": "PRO",
    "arquivo": "07-producao-assincrona-e-custos",
    "nome": "Produção assíncrona e custos",
    "cenarios_count": 12,
    "regras_count": 8,
    "resumo": "O coordenador de produção orquestra a execução assíncrona das etapas do vídeo através de um DAG acíclico canônico (research -> script -> factcheck -> storyboard -> assets -> render -> qa -> approval -> publish). Cada execução é representada por um ProductionRun com máquina de estados fechada. A concorrência entre workers é regulada por leases com fencing tokens monótonos e batimentos periódicos (heartbeat). Operações de ciclo de vida (pause, resume, retry, regenerate) controlam se o snapshot de configuração é congelado ou reavaliado. O BudgetGuard intercepta operações pagas, exige reserva prévia contra tetos configurados no canal e reconcilia confirmações ou estornos no usage_ledger."
  },
  {
    "id": "F08",
    "prefixo": "PUB",
    "arquivo": "08-aprovacao-e-publicacao",
    "nome": "Aprovação e publicação",
    "cenarios_count": 12,
    "regras_count": 6,
    "resumo": "A aprovação registra a versão revisada e uma intenção. Claim e executor verificam intenção, render, checksum e QA. O executor valida destino e autorização antes do upload; ambiguidade exige reconciliação. Aprovar não equivale a publicar."
  },
  {
    "id": "F09",
    "prefixo": "ANA",
    "arquivo": "09-analytics-e-aprendizado",
    "nome": "Analytics e aprendizado",
    "cenarios_count": 8,
    "regras_count": 6,
    "resumo": "A coleta exige canal conectado, escopo de leitura e publicação com ID remoto. Observações têm origem, janela, unidade e vínculo de versão. Dashboard deduplica observações e separa formatos; recomendações são propostas humanas, não mudanças automáticas."
  },
  {
