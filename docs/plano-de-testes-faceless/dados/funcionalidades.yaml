    "cenarios_count": 8,
    "regras_count": 5,
    "resumo": "O roteador aplica guard de host/origem e autenticação Basic ou Bearer antes dos casos de uso. Não há sessão individual por canal. OAuth guarda tokens no cofre e devolve metadados; testes devem usar somente identidades e segredos sintéticos."
  },
  {
