<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Studio V4 — conceito</title><style>body{font:16px system-ui;background:#f7f6fa;color:#262238;margin:24px}main{max-width:1000px;margin:auto}button,select,textarea{font:inherit;padding:8px}button{cursor:pointer}section{background:white;border:1px solid #ddd;border-radius:12px;padding:18px;margin:12px 0}nav{display:flex;flex-wrap:wrap;gap:8px}label{display:block;margin:10px 0}textarea{width:95%}.track{background:#e8e0f7;padding:8px;margin:5px;border-radius:5px}</style><main><h1>Faceless Studio V4</h1><p>Protótipo conceitual local, sem backend ou render real.</p><nav id="tabs"></nav><section id="panel"></section></main><script>const tabs=['Storyboard','Áudio','Mídia','Timeline','Qualidade'];let scenes=['Hook','Contexto','Revelação'],idx=0,history=[],future=[];const panel=document.querySelector('#panel');function show(t){if(t==='Storyboard'){panel.innerHTML='<h2>Storyboard</h2><div id="scenes"></div><label>Narração<textarea id="script"></textarea></label><button id="add">Nova cena</button> <button id="undo">Desfazer</button> <button id="redo">Refazer</button><p>Voz · B-roll · Música · Efeitos · Legendas</p>';let s=document.querySelector('#scenes');scenes.forEach((x,i)=>{let b=document.createElement('button');b.textContent='Cena '+(i+1);b.onclick=()=>{idx=i;show(t)};s.append(b)});let a=document.querySelector('#script');a.value=scenes[idx];a.onchange=()=>{history.push([...scenes]);future=[];scenes[idx]=a.value};document.querySelector('#add').onclick=()=>{history.push([...scenes]);future=[];scenes.push('Nova cena');idx=scenes.length-1;show(t)};document.querySelector('#undo').onclick=()=>{if(history.length){future.push([...scenes]);scenes=history.pop();idx=Math.min(idx,scenes.length-1);show(t)}};document.querySelector('#redo').onclick=()=>{if(future.length){history.push([...scenes]);scenes=future.pop();show(t)}}}else if(t==='Áudio'){panel.innerHTML='<h2>Mixagem</h2>'+['Voz','Música','Ambiente','SFX'].map(x=>'<label>'+x+' <input type="range" min="0" max="100"></label>').join('')+'<label><input type="checkbox" checked>Ducking</label>'}else if(t==='Timeline'){panel.innerHTML='<h2>Timeline ilustrativa</h2>'+['Vídeo','Overlay','Motion','Legenda','Voz','Música','SFX'].map(x=>'<div class="track">'+x+' — segmentos</div>').join('')}else{panel.textContent=t==='Mídia'?'Biblioteca: imagens, vídeos, músicas e SFX.':'QA: relatório técnico, visual, áudio e editorial. Dados reais ainda não conectados.'}}tabs.forEach(t=>{let b=document.createElement('button');b.textContent=t;b.onclick=()=>show(t);document.querySelector('#tabs').append(b)});show(tabs[0])</script></html>
