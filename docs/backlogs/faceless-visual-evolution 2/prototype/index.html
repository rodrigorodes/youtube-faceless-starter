/* =========================================================================
   Tokens. Padrão do projeto (modern-web-guidance › dark-mode):
   color-scheme em :root + light-dark(); fallback por prefers-color-scheme
   para navegador que tem color-scheme mas não tem light-dark().
   ========================================================================= */
:root {
  color-scheme: light dark;

  /* pares crus: claro primeiro, escuro depois */
  --bg-l:#f7f7fa;        --bg-d:#0c0d10;
  --side-l:#ffffff;      --side-d:#111216;
  --panel-l:#ffffff;     --panel-d:#15171c;
  --panel2-l:#f2f1f7;    --panel2-d:#1c1e24;
  --line-l:#e3e0ea;      --line-d:#2c2e37;
  --txt-l:#1b1a21;       --txt-d:#f3f3f7;
  --muted-l:#5c5966;     --muted-d:#a3a6b4;   /* ≥4.5:1 sobre panel/bg */
  --sub-l:#6a6773;       --sub-d:#90939f;     /* ≥4.5:1 sobre panel/bg */
  --accent-l:#6a4bc4;    --accent-d:#b9a3ff;  /* texto de acento lavável */
  --accentfill-l:#6b4cd6; --accentfill-d:#8f6ef7;
  --onaccent-l:#ffffff;  --onaccent-d:#14101f;
  --good-l:#1d6b48;      --good-d:#7fd0a8;
  --warn-l:#7a5312;      --warn-d:#ecc27a;
  --soft-l:#ece7fb;      --soft-d:#221d33;
  --shadow-l:0 10px 30px rgba(24,16,44,.10);
  --shadow-d:0 20px 55px rgba(0,0,0,.35);
  --hero-l:linear-gradient(120deg,#ece7fb,#f8f7fb 70%);
  --hero-d:linear-gradient(120deg,#1e1b2d,#16161e 68%);

  /* fallback: default claro; escuro pela preferência do sistema */
  --bg:var(--bg-l); --side:var(--side-l); --panel:var(--panel-l); --panel2:var(--panel2-l);
  --line:var(--line-l); --txt:var(--txt-l); --muted:var(--muted-l); --sub:var(--sub-l);
  --accent:var(--accent-l); --accentfill:var(--accentfill-l); --onaccent:var(--onaccent-l);
  --good:var(--good-l); --warn:var(--warn-l); --soft:var(--soft-l); --shadow:var(--shadow-l);
  --hero:var(--hero-l);

  @media (prefers-color-scheme: dark) {
    --bg:var(--bg-d); --side:var(--side-d); --panel:var(--panel-d); --panel2:var(--panel2-d);
    --line:var(--line-d); --txt:var(--txt-d); --muted:var(--muted-d); --sub:var(--sub-d);
    --accent:var(--accent-d); --accentfill:var(--accentfill-d); --onaccent:var(--onaccent-d);
    --good:var(--good-d); --warn:var(--warn-d); --soft:var(--soft-d); --shadow:var(--shadow-d);
    --hero:var(--hero-d);
  }

  /* moderno: uma declaração por token, seguindo o color-scheme computado */
  @supports (color: light-dark(white, black)) {
    --bg:light-dark(var(--bg-l),var(--bg-d));
    --side:light-dark(var(--side-l),var(--side-d));
    --panel:light-dark(var(--panel-l),var(--panel-d));
    --panel2:light-dark(var(--panel2-l),var(--panel2-d));
    --line:light-dark(var(--line-l),var(--line-d));
    --txt:light-dark(var(--txt-l),var(--txt-d));
    --muted:light-dark(var(--muted-l),var(--muted-d));
    --sub:light-dark(var(--sub-l),var(--sub-d));
    --accent:light-dark(var(--accent-l),var(--accent-d));
    --accentfill:light-dark(var(--accentfill-l),var(--accentfill-d));
    --onaccent:light-dark(var(--onaccent-l),var(--onaccent-d));
    --good:light-dark(var(--good-l),var(--good-d));
    --warn:light-dark(var(--warn-l),var(--warn-d));
    --soft:light-dark(var(--soft-l),var(--soft-d));
    --shadow:light-dark(var(--shadow-l),var(--shadow-d));
    --hero:light-dark(var(--hero-l),var(--hero-d));
  }

  accent-color:var(--accentfill);            /* controles nativos acompanham o tema */
  scrollbar-color:var(--line) transparent;
}

* { box-sizing:border-box; }
/* hidden precisa vencer o display de qualquer classe (ex.: .btn usa inline-flex) */
[hidden] { display:none !important; }
/* Tipografia do protótipo V3: Inter (usada no mockup original) primeiro; se não
   estiver instalada, cai no MESMO fallback do original, para não mudar de fonte.
   Padrão Modern Web Guidance: font smoothing, text-rendering e text-wrap. */
body {
  margin:0; background:var(--bg); color:var(--txt);
  font:14px/1.5 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  font-feature-settings:"cv02","cv03","cv04","cv11";
}
button,input,select,textarea { font:inherit; color:inherit; }
a { color:var(--accent); }

/* Títulos, cabeçalhos, labels e textos em negrito e branco com alto contraste */
h1,h2,h3,h4,th,dt,.h1,.hero h1 {
  color:light-dark(#111116,#ffffff);
  letter-spacing:-.4px;
  text-wrap:balance;
}
strong,b {
  color:light-dark(#111116,#ffffff);
  font-weight:700;
}
label,.rotulo,.form-label {
  color:light-dark(#1c1b22,#ffffff);
  font-weight:650;
}
p,.lead,.dica,.hint,.muted,.fine,.micro {
  text-wrap:pretty;
}
code,kbd,samp {
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  font-size:.88em;
  padding:2px 6px;
  border-radius:5px;
  background:var(--panel2);
  border:1px solid var(--line);
  color:var(--accent);
}
:where(a,button,input,select,textarea,[tabindex]):focus-visible {
  outline:2px solid var(--accent); outline-offset:2px; border-radius:6px;
}
.sr-only {
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}
.skip { position:absolute; left:-9999px; top:0; background:var(--panel); color:var(--txt);
  padding:10px 14px; z-index:50; border:1px solid var(--line); }
.skip:focus { left:8px; top:8px; }

/* ---------- estrutura ---------- */
.app { display:flex; min-height:100vh; }
.side {
  position:sticky; top:0; width:240px; min-width:240px; height:100vh; background:var(--side);
  border-right:1px solid var(--line); padding:25px 16px; display:flex; flex-direction:column;
}
.brand { display:flex; align-items:center; gap:11px; padding:3px 10px 34px; font-weight:780;
  font-size:16px; letter-spacing:-.6px; }
.brand-logo { width:33px; height:33px; border-radius:11px; background:var(--accentfill);
  color:var(--onaccent); display:grid; place-items:center; font-size:18px; font-weight:900;
  box-shadow:0 5px 22px color-mix(in srgb, var(--accentfill) 25%, transparent); }
.brand small { display:block; color:var(--sub); font-weight:500; font-size:10px;
  letter-spacing:2px; margin-top:-2px; }
.side-caption { font-size:10px; text-transform:uppercase; letter-spacing:1.5px;
  color:var(--sub); font-weight:700; margin:8px 12px 10px; }   /* era 4.02:1 */
.nav-list { list-style:none; margin:0; padding:0; }
.nav-list a {
  display:flex; gap:13px; align-items:center; padding:12px 13px; border:1px solid transparent;
  border-left:3px solid transparent; border-radius:10px; color:var(--txt);
  text-decoration:none; font-weight:560; margin:2px 0;
}
/* ícones do protótipo: traço 1.8, 18×18, herdando a cor do item */
.nav-list svg { width:18px; height:18px; flex:0 0 18px; stroke-width:1.8; }
.nav-list a:hover { background:var(--panel2); color:var(--accent); }
/* Indicador de página ativa: forma (barra + peso), não só cor — sobrevive ao alto contraste */
.nav-list a[aria-current="page"] {
  background:var(--soft); color:var(--accent); border-color:var(--line);
  border-left-color:var(--accentfill); font-weight:750;
}
.side-bottom { margin-top:auto; border-top:1px solid var(--line); padding-top:12px; }
.side-note { display:flex; gap:10px; align-items:center; color:var(--muted); font-size:12px;
  padding:10px 11px; }
.avatar { width:30px; height:30px; border-radius:50%; background:var(--soft); color:var(--accent);
  display:grid; place-items:center; font-weight:800; }
.mock-flag { font-size:11px; color:var(--muted); padding:6px 10px; margin:0; }

.main { flex:1; min-width:0; display:flex; flex-direction:column; }
.top { min-height:78px; border-bottom:1px solid var(--line); display:flex; align-items:center;
  justify-content:space-between; gap:20px; padding:12px 52px; flex-wrap:wrap; }
.crumb { color:var(--muted); font-size:13px; }
.crumb b { color:var(--txt); font-weight:650; }
.tools { display:flex; align-items:center; gap:10px; }
.canal-select { border:1px solid var(--line); background:var(--panel); border-radius:11px;
  padding:9px 12px; font-size:12px; min-width:185px; }
.icon-btn { background:transparent; border:1px solid var(--line); border-radius:10px;
  width:36px; height:36px; display:grid; place-items:center; cursor:pointer; color:var(--muted);
  transition:background-color .15s ease, color .15s ease, border-color .15s ease, transform .15s ease; }
.icon-btn:hover { background:var(--panel2); color:var(--txt); transform:translateY(-1px); border-color:#595268; }
.content { padding:43px 52px 100px; max-width:1240px; width:100%; margin:0 auto;
  animation:show .22s cubic-bezier(.16,1,.3,1); }
@keyframes show {
  from { opacity:.45; transform:translateY(6px); }
  to { opacity:1; transform:none; }
}
.pagina[hidden] { display:none; }
.eyebrow { text-transform:uppercase; color:var(--accent); font-weight:750; letter-spacing:2px;
  font-size:10px; margin-bottom:12px; }
.h1 { font-size:35px; line-height:1.2; letter-spacing:-1.3px; font-weight:730; margin:0 0 10px; }
.lead { color:var(--muted); margin:0; }
.secao { margin-top:36px; }
.secao-cab { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:16px; }
.secao h2 { font-size:17px; margin:0; }
.muted { color:var(--muted); }
.micro { font-size:12px; color:var(--muted); }
.link-btn { background:none; border:0; color:var(--accent); font-weight:650; font-size:12px;
  padding:8px; cursor:pointer; text-decoration:underline; }

/* ---------- botões ---------- */
.btn { border:1px solid var(--line); background:var(--panel2); color:var(--txt); border-radius:10px;
  padding:11px 17px; font-weight:650; cursor:pointer; display:inline-flex; align-items:center;
  justify-content:center; gap:8px;
  transition:background-color .15s ease, border-color .15s ease, color .15s ease, transform .15s ease, box-shadow .15s ease, filter .15s ease; }
.btn:hover:not([disabled]) { background:var(--panel); transform:translateY(-1px); }
.btn:active:not([disabled]) { transform:translateY(0); }
.btn-primario { background:var(--accentfill); color:var(--onaccent); border-color:var(--accentfill);
  font-weight:700; box-shadow:0 4px 14px color-mix(in srgb, var(--accentfill) 32%, transparent); }
.btn-primario:hover:not([disabled]) { filter:brightness(1.08); box-shadow:0 6px 22px color-mix(in srgb, var(--accentfill) 48%, transparent); }
.btn[disabled] { opacity:.55; cursor:not-allowed; }

/* ---------- início ---------- */
.hero { padding:38px 42px 36px; background:var(--hero); border:1px solid var(--line);
  border-radius:19px; position:relative; overflow:hidden; }
.hero::after { content:'✦'; position:absolute; right:37px; top:-42px; font-size:200px;
  color:light-dark(rgba(107,76,214,.08),rgba(150,117,251,.055)); pointer-events:none; line-height:1; user-select:none; }
.hero h1 { font-size:32px; letter-spacing:-1.2px; line-height:1.2; margin:0 0 9px; }
.hero p { color:var(--muted); margin:0 0 20px; }
.campo-tema { display:flex; flex-direction:column; gap:7px; }
.campo-tema label { font-size:13px; font-weight:650; }
.campo-tema input { border:1px solid var(--line); background:var(--panel); border-radius:10px;
  padding:13px; width:100%; }
.hero-linha { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
.hero-linha .campo-tema { flex:1 1 320px; }
.formatos { border:0; padding:0; margin:16px 0 0; display:flex; gap:9px; flex-wrap:wrap; }
.formatos legend { font-size:12px; color:var(--muted); margin-bottom:6px; padding:0; }
.formato { display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line);
  background:var(--panel); border-radius:9px; padding:9px 12px; font-size:13px; cursor:pointer; }
.formato:has(input:checked) { border-color:var(--accentfill); background:var(--soft);
  color:var(--accent); font-weight:650; }
.formato input { accent-color:var(--accentfill); }

.grade { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:15px; }
.cartao-projeto { border:1px solid var(--line); background:var(--panel); border-radius:14px;
  overflow:hidden; transition:transform .18s cubic-bezier(.16,1,.3,1), border-color .18s ease, box-shadow .18s ease; }
.cartao-projeto:hover { transform:translateY(-2px); border-color:#595268; box-shadow:0 12px 32px rgba(0,0,0,.22); }
.cartao-projeto a { display:block; text-decoration:none; color:inherit; border-radius:14px; }
.miniatura { height:145px; display:flex; align-items:flex-end; padding:15px;
  background:radial-gradient(circle at 68% 34%,#47799c,transparent 29%),radial-gradient(circle at 35% 65%,#2e325e,transparent 45%),linear-gradient(135deg,#17192b,#080d1d);
  position:relative; overflow:hidden; }
.miniatura::before { content:''; position:absolute; inset:0;
  background:linear-gradient(0deg,rgba(4,5,12,.65),transparent 75%); pointer-events:none; }
.miniatura b { font-size:10px; letter-spacing:1.4px; text-transform:uppercase;
  color:#e5e5f5; font-weight:750; position:relative; z-index:1; }
.cartao-corpo { padding:15px; }
.cartao-corpo h3 { font-size:14px; margin:0 0 7px; color:light-dark(#111116,#ffffff); font-weight:650; }
.linha-meta { display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--muted); }
.situacao { display:inline-flex; align-items:center; gap:7px; font-weight:600; font-size:11px;
  color:var(--txt); }
.situacao i { width:8px; height:8px; border-radius:50%; background:var(--accentfill); }
.situacao.ok i { background:var(--good); }
.situacao.espera i { background:var(--warn); }
.situacao.parado i { background:var(--muted); }
.etapa-atual { font-size:12px; color:var(--muted); margin-top:8px; }

/* ---------- tendências (com evidência) ---------- */
.grade-tendencias { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
.cartao-tendencia { border:1px solid var(--line); background:var(--panel); border-radius:13px; padding:17px;
  transition:transform .18s cubic-bezier(.16,1,.3,1), border-color .18s ease, box-shadow .18s ease; }
.cartao-tendencia:hover { transform:translateY(-2px); border-color:#595268; box-shadow:0 12px 32px rgba(0,0,0,.22); }
.origem { display:inline-block; border:1px solid var(--line); background:var(--panel2);
  color:var(--accent); border-radius:5px; padding:4px 7px; font-size:10px; font-weight:700; }
.cartao-tendencia h3 { font-size:15px; margin:13px 0 10px; color:light-dark(#111116,#ffffff); font-weight:650; }
.evidencias { list-style:none; margin:0 0 12px; padding:0; font-size:12px; color:var(--muted); }
.evidencias li { padding:4px 0; border-bottom:1px solid var(--line); display:flex; gap:8px;
  justify-content:space-between; }
.evidencias li span:last-child { color:var(--txt); font-weight:600; text-align:right;
  overflow-wrap:anywhere; min-width:0; }   /* URL longa quebra em vez de estourar o cartão */
/* link com área de toque de 24px de altura (WCAG 2.5.8) sem deixar de quebrar a URL */
.evidencias a { display:inline-block; max-width:100%; padding:5px 0; overflow-wrap:anywhere; }
.pilha { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

/* ---------- pilares (filtro e gestão) — espelha a UX atual ---------- */
.barra-pilares { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 18px; }
.chip-filtro { border:1px solid var(--line); background:var(--panel); color:var(--txt);
  border-radius:30px; padding:8px 13px; font-size:12px; font-weight:600; cursor:pointer; }
.chip-filtro:hover { background:var(--panel2); }
/* pressionado: fundo + borda + PESO (não só cor) e aria-pressed para o leitor de tela */
.chip-filtro[aria-pressed="true"] { background:var(--soft); border-color:var(--accentfill);
  color:var(--accent); font-weight:750; }
.chip-filtro.novo { border-style:dashed; color:var(--accent); }
.chip-pilar { display:inline-block; border:1px solid var(--line); background:var(--panel2);
  color:var(--accent); border-radius:5px; padding:4px 7px; font-size:10px; font-weight:700; }

/* ---------- diálogo de pilares (nativo, sem role/aria-modal) ---------- */
dialog { border:1px solid var(--line); background:var(--panel); color:var(--txt);
  border-radius:16px; padding:0; width:min(620px, calc(100vw - 32px)); box-shadow:var(--shadow); }
dialog::backdrop { background:rgba(8,6,16,.6); overflow:hidden; overscroll-behavior:contain; }
dialog:modal { overscroll-behavior:contain; }
.dialogo-cab { display:flex; align-items:flex-start; justify-content:space-between; gap:14px;
  padding:22px 24px 0; }
.dialogo-cab h2 { font-size:18px; margin:0; letter-spacing:-.4px; }
.dialogo-corpo { padding:10px 24px 24px; max-height:min(72vh,640px); overflow:auto; }
.lista-pilares { list-style:none; margin:14px 0 22px; padding:0; }
.lista-pilares li { display:flex; gap:12px; align-items:flex-start; justify-content:space-between;
  padding:12px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.lista-pilares b { display:block; font-size:13px; }
.lista-pilares small { color:var(--muted); display:block; margin-top:3px; }
.acoes-linha { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.form-pilar { border-top:1px solid var(--line); padding-top:18px; }
.form-pilar h3 { font-size:14px; margin:0 0 4px; }
.form-pilar .acoes { justify-content:flex-end; }

/* ---------- novo vídeo ---------- */
.passos { list-style:none; display:flex; gap:10px; align-items:center; padding:0; margin:0 0 22px;
  font-size:12px; color:var(--muted); flex-wrap:wrap; }
.passos li { display:flex; align-items:center; gap:7px; }
.passos b { width:22px; height:22px; border:1px solid var(--line); border-radius:50%;
  display:grid; place-items:center; font-size:11px; }
.passos li[aria-current="step"] { color:var(--accent); font-weight:700; }
.passos li[aria-current="step"] b { background:var(--soft); border-color:var(--accentfill);
  border-width:2px; }
.passos li.feito { color:var(--good); }
.passos li.feito b { border-color:var(--good); }
.passos .risco { width:14px; height:1px; background:var(--line); }
.grade-criar { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:20px; align-items:start; }
.painel { border:1px solid var(--line); background:var(--panel); border-radius:14px; padding:25px; }
.painel h3 { font-size:16px; font-weight:690; letter-spacing:-.3px; margin:0 0 6px; }
.painel > p { color:var(--muted); margin:0 0 22px; font-size:12px; }
.campo { margin-bottom:20px; }
.campo > label, .campo > .rotulo { display:block; font-size:13px; font-weight:650; margin-bottom:8px; }
.campo input[type="text"], .campo input[type="url"], .campo input[type="search"],
.campo textarea, .campo select, select.campo {
  width:100%; border:1px solid var(--line); background:var(--panel2); border-radius:9px; padding:12px;
  color:light-dark(#111116,#ffffff);
  transition:border-color .15s ease, box-shadow .15s ease;
}
.campo input:focus, .campo textarea:focus, .campo select:focus, select.campo:focus {
  border-color:var(--accentfill) !important; outline:none;
  box-shadow:0 0 0 3px color-mix(in srgb, var(--accentfill) 22%, transparent);
}
.campo textarea { min-height:120px; resize:vertical; line-height:1.5; }
.dica { font-size:12px; color:var(--muted); margin:7px 0 0; }
.pills { border:0; padding:0; margin:0; display:flex; gap:8px; flex-wrap:wrap; }
.pills legend { font-size:13px; font-weight:650; margin-bottom:8px; padding:0; }
.pill { display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line);
  background:var(--panel2); border-radius:9px; padding:9px 12px; font-size:13px; cursor:pointer; }
.pill:has(input:checked) { border-color:var(--accentfill); background:var(--soft); color:var(--accent);
  font-weight:650; }
.tabela-kv { width:100%; font-size:13px; border-collapse:collapse; }
.tabela-kv th, .tabela-kv td { text-align:left; padding:11px 0; border-bottom:1px solid var(--line);
  font-weight:500; }
.tabela-kv th { color:var(--muted); font-weight:500; width:48%; }
.tabela-kv td { font-weight:650; text-align:right; }
.acoes { display:flex; gap:9px; align-items:center; justify-content:space-between; flex-wrap:wrap;
  margin-top:18px; }
.aviso { border:1px solid var(--line); border-left:3px solid var(--accentfill); background:var(--soft);
  border-radius:9px; padding:13px 15px; font-size:13px; }

/* ---------- filtros/busca ---------- */
.linha-busca { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; margin-bottom:18px; }
.linha-busca .campo { margin:0; flex:1 1 260px; }
.filtros { border:0; padding:0; margin:0; }
.filtros legend { font-size:13px; font-weight:650; margin-bottom:8px; padding:0; }
.vazio { padding:28px; text-align:center; color:var(--muted); border:1px dashed var(--line);
  border-radius:11px; }

/* ---------- desempenho ---------- */
.estatisticas { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:13px; }
.estat { border:1px solid var(--line); background:var(--panel); border-radius:12px; padding:18px;
  transition:transform .18s cubic-bezier(.16,1,.3,1), border-color .18s ease, box-shadow .18s ease; }
.estat:hover { transform:translateY(-2px); border-color:#595268; box-shadow:0 12px 32px rgba(0,0,0,.22); }
.estat span { color:var(--muted); font-size:12px; }
.estat strong { display:block; font-size:28px; letter-spacing:-1px; margin:10px 0 4px; color:light-dark(#111116,#ffffff); font-weight:750; }
.grafico { display:flex; align-items:flex-end; gap:10px; height:180px; padding:14px 4px 0;
  border-bottom:1px solid var(--line); }
.barra { flex:1; border-radius:4px 4px 0 0; background:linear-gradient(180deg,#9c7cff,#44366f); opacity:.88;
  transition:opacity .15s ease, filter .15s ease; }
.barra:hover { opacity:1; filter:brightness(1.15); }
.rotulos { display:flex; gap:10px; color:var(--muted); font-size:11px; padding:9px 4px; }
.rotulos span { flex:1; text-align:center; }
.selo { display:inline-block; border:1px solid var(--line); background:var(--panel2);
  color:var(--accent); border-radius:6px; padding:3px 8px; font-size:11px; font-weight:700; }

/* ---------- configurações (rotas, não abas) ---------- */
.grade-config { display:grid; grid-template-columns:210px minmax(0,1fr); gap:20px; align-items:start; }
.menu-config { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; }
.menu-config a { display:block; padding:11px 12px; border:1px solid transparent;
  border-left:3px solid transparent; border-radius:9px; color:var(--txt); text-decoration:none;
  font-weight:600; font-size:13px; }
.menu-config a:hover { background:var(--panel2); }
.menu-config a[aria-current="page"] { background:var(--soft); color:var(--accent);
  border-color:var(--line); border-left-color:var(--accentfill); font-weight:750; }
.item-config { display:flex; justify-content:space-between; gap:14px; align-items:center;
  padding:16px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.item-config:last-child { border-bottom:0; }
.item-config b { display:block; font-size:13px; color:light-dark(#111116,#ffffff); }
.item-config small { color:var(--muted); }
.galeria { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:11px; }
.cartao-estilo { border:1px solid var(--line); background:var(--panel2); border-radius:11px;
  overflow:hidden; text-align:left; padding:0 0 11px; cursor:pointer;
  transition:transform .18s cubic-bezier(.16,1,.3,1), border-color .18s ease, box-shadow .18s ease; }
.cartao-estilo:hover { transform:translateY(-2px); border-color:#595268; box-shadow:0 12px 32px rgba(0,0,0,.22); }
.cartao-estilo:has(input:checked) { border-color:var(--accentfill); border-width:2px; }
.cartao-estilo .amostra { height:82px; display:grid; place-items:center; font-weight:800;
  letter-spacing:-.6px; color:#f4f2fb; background:linear-gradient(135deg,#4a3b78,#1a1a2b); }
/* o rádio fica junto do nome, onde pertence — não solto sobre a amostra */
.cartao-rodape { display:flex; align-items:center; gap:8px; margin:10px 11px 0;
  font-size:13px; font-weight:700; color:light-dark(#111116,#ffffff); }
.cartao-estilo:has(input:checked) .cartao-rodape { color:var(--accent); }

/* ---------- workspace do vídeo ---------- */
.cab-video { display:flex; justify-content:space-between; gap:16px; align-items:flex-start;
  flex-wrap:wrap; margin-bottom:22px; }
.grade-video { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(280px,.85fr); gap:20px;
  align-items:start; }
.player { aspect-ratio:16/9; border:1px solid var(--line); border-radius:12px;
  background:radial-gradient(circle at 55% 40%,#4b5177,transparent 30%),linear-gradient(135deg,#1e2034,#0b0c15);
  display:grid; place-items:center; gap:10px; color:#e8e6f2; padding:18px; text-align:center; }
.cenas { list-style:none; margin:0; padding:0; }
.cenas li { display:flex; gap:12px; align-items:flex-start; padding:12px 0;
  border-bottom:1px solid var(--line); }
.cenas li:last-child { border-bottom:0; }
.cena-n { width:28px; height:28px; flex:0 0 28px; border-radius:8px; background:var(--soft);
  color:var(--accent); display:grid; place-items:center; font-size:11px; font-weight:700; }
.cenas small { display:block; color:var(--muted); }
.checklist { list-style:none; margin:0; padding:0; }
.checklist li { display:flex; gap:11px; align-items:center; padding:13px 0;
  border-bottom:1px solid var(--line); }
.checklist li:last-child { border-bottom:0; }
.checklist b { width:20px; height:20px; flex:0 0 20px; border-radius:50%; border:1px solid var(--line);
  display:grid; place-items:center; font-size:11px; }
.checklist li[data-estado="concluido"] { color:var(--txt); }
.checklist li[data-estado="concluido"] b { background:var(--good); border-color:var(--good);
  color:var(--bg); }
.checklist li[data-estado="atual"] { font-weight:700; }
.checklist li[data-estado="atual"] b { border-color:var(--accentfill); border-width:2px; }
.checklist li[data-estado="falhou"] { font-weight:700; }
.checklist li[data-estado="falhou"] b { background:var(--warn); border-color:var(--warn); color:var(--bg); }
/* gate humano: não é falha, mas é você quem destrava */
.checklist li[data-estado="aguardando"] { font-weight:700; }
.checklist li[data-estado="aguardando"] b { background:var(--warn); border-color:var(--warn); color:var(--bg); }
.checklist .estado { margin-left:auto; font-size:11px; color:var(--muted); font-weight:600; }
/* erro: escondido por padrão; o script revela junto com aria-invalid, para o estado
   visual e o programático nunca discordarem (e nada ser lido antes da interação) */
.campo-erro { display:none; font-size:12px; color:var(--warn); font-weight:600; margin-top:6px; }
.campo-erro.visivel { display:block; }
.campo [aria-invalid="true"] { border-color:var(--warn); }

/* ---------- aviso (região viva, existe desde o carregamento) ---------- */
.aviso-toast { position:fixed; right:22px; bottom:22px; max-width:380px; z-index:40;
  background:var(--panel); border:1px solid var(--accentfill); border-left-width:4px;
  border-radius:11px; padding:13px 16px; box-shadow:var(--shadow); display:none; }
.aviso-toast.visivel { display:block; }

/* ---------- responsivo: uma árvore de navegação, sem gaveta ---------- */
@media (max-width:1080px) {
  .content { padding:35px 28px 80px; }
  .top { padding:12px 28px; }
  .grade, .estatisticas { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .grade-criar, .grade-video, .grade-config { grid-template-columns:1fr; }
}
@media (max-width:820px) {
  .app { flex-direction:column; }
  .side { position:static; width:auto; min-width:0; height:auto; border-right:0;
    border-bottom:1px solid var(--line); padding:14px; }
  .brand { padding-bottom:12px; }
  .nav-list { flex-direction:row; overflow-x:auto; gap:4px; }
  .nav-list a { white-space:nowrap; border-left-width:1px; border-bottom:3px solid transparent; }
  .nav-list a[aria-current="page"] { border-left-color:var(--line); border-bottom-color:var(--accentfill); }
  .side-bottom { margin-top:12px; }
  .content { padding:28px 18px 65px; }
  .top { padding:10px 18px; }
  .grade, .grade-tendencias, .estatisticas, .galeria { grid-template-columns:1fr; }
}

/* ---------- sem animação quando o sistema pede ---------- */
@media (prefers-reduced-motion: reduce) {
  * { transition:none !important; animation:none !important; }
}

/* ---------- alto contraste: forma e cores de sistema ---------- */
@media (forced-colors: active) {
  .nav-list a[aria-current="page"],
  .menu-config a[aria-current="page"] {
    border-left-color:Highlight; background:Canvas; color:Highlight; forced-color-adjust:none;
  }
  .situacao i, .passos b, .checklist b, .cena-n { border-color:CanvasText; forced-color-adjust:none; }
  .hero, .miniatura, .player, .cartao-estilo .amostra {
    background:Canvas !important; border-color:CanvasText;
  }
  .barra { background:Highlight; forced-color-adjust:none; }
  .btn, .btn-primario { border-color:ButtonText; }
  .chip-filtro[aria-pressed="true"] { border-color:Highlight; color:Highlight; forced-color-adjust:none; }
}

/* Integração com a casca V3 aprovada */

accent);vertical-align:middle}.feature-preview{background:linear-gradient(145deg,#2c2541,#191724);border:1px solid #655275;border-radius:13px;padding:28px;text-align:center;min-height:160px;display:grid;place-content:center}.feature-preview strong{font-size:26px}.chapter{padding:12px 0;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1.5px}.pillrow{display:flex;gap:7px;flex-wrap:wrap}.choice{padding:18px;text-align:left;flex:1;min-width:140px}.choice.active{border-color:var(--accent);background:var(--soft)}.choice strong{display:block;margin-bottom:6px}.rail{height:24px;background:var(--panel2);border-radius:5px;position:relative;overflow:hidden}.rail span{position:absolute;top:3px;bottom:3px;background:#8665cd;border-radius:3px}.trackline{display:grid;grid-template-columns:100px 1fr;gap:12px;align-items:center;margin:12px 0;font-size:12px}.stageitem{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:14px 0;gap:12px}.stageitem .num{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:50%;background:var(--soft);color:var(--accent);margin-right:10px}.metricgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.metricbox strong{font-size:27px;display:block;margin-top:12px}.bars{display:flex;height:150px;align-items:flex-end;gap:12px}.bars span{flex:1;background:#9270df;border-radius:6px 6px 0 0}.sample{font-size:11px;color:var(--muted)}.form-error{color:#ffb8c4}.matrix{width:100%;border-collapse:collapse;font-size:13px}.matrix th,.matrix td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}.tablewrap{overflow:auto}.benefits{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:24px 0}.benefits div{border-left:2px solid var(--line);padding-left:14px}.editor .preview{background:radial-gradient(ellipse at bottom,#665047,#151523 70%)}.scene-list{max-height:660px;overflow:auto}.note{background:var(--soft);color:var(--txt);border:1px solid var(--line)}.fake-wave{display:flex;gap:3px;align-items:center;height:65px;padding:10px 0}.fake-wave span{width:5px;background:#b296e9;border-radius:3px}.demofooter{font-size:11px;color:var(--muted);margin-top:20px}dialog{background:var(--panel);color:var(--txt)}.settings-search{margin-bottom:20px}.subheading{display:flex;justify-content:space-between;align-items:start;gap:16px;margin-bottom:20px}.compact-note{font-size:12px;color:var(--muted);padding-top:10px}.chipval{display:inline-block;background:var(--soft);border-radius:6px;padding:3px 7px;font-size:12px}.thumb{background:linear-gradient(145deg,#58456c,#241c35)}
@media(max-width:1100px){.editor{grid-template-columns:170px minmax(0,1fr)}.prop{grid-column:1/-1}.metricgrid{grid-template-columns:repeat(2,1fr)}}

<div class="layout">
<aside class="sidebar"><div class="brand">◈ Faceless<span>Studio</span></div><nav aria-label="Menu principal" id="globalnav"></nav><footer><p class="small muted">PROJETO · REVISÃO 3</p><p class="small">Fluxo completo.<br>Controles quando você precisar.</p><button class="ghost small" data-action="reset">Reiniciar demo</button></footer></aside>
<div><header class="topbar"><div class="row"><label for="channelSelect" class="sr">Canal ativo</label><select id="channelSelect"></select><span class="tag">Conta pessoal</span></div><span class="account small muted">Rodrigo · proprietário · demo</span></header><div class="demo">Protótipo navegável · alterações locais e dados de exemplo · geração e publicação simuladas</div><main id="app"></main></div>
</div><div id="message" role="status" aria-live="polite"></div><dialog id="modal" aria-labelledby="modalTitle"></dialog>
<script>
'use strict';
const KEY='faceless-completo-v3-demo';
const initial=()=>({channels:[{id:'history',name:'Histórias em 5 minutos',language:'pt-BR',voice:'Voz documental',style:'Documentário',quality:'Equilibrado'},{id:'space',name:'Além do planeta',language:'pt-BR',voice:'Voz curiosa',style:'Cinematográfico',quality:'Econômico'}],videos:[seedVideo('rome','history','Por que Roma caiu?','review'),seedVideo('mars','space','Como seria viver em Marte?','failed')],channel:'history',route:'home',tab:'content',videoId:null,sceneId:null,filter:'all'});
function seedVideo(id,ch,title,state){return {id,channel:ch,title,format:'short',target:60,reviewScript:true,identity:ch==='history'?{voice:'Voz documental',style:'Documentário',quality:'Equilibrado'}:{voice:'Voz curiosa',style:'Cinematográfico',quality:'Econômico'},revision:1,renderRevision:state==='review'?1:null,approvedRevision:null,state,published:null,scenes:[{id:id+'-1',title:'Abertura',text:ch==='history'?'Roma não caiu em um único dia. Sua transformação levou séculos.':'Como seria acordar em um planeta onde o céu tem outra cor?',media:'Banco de mídia',stale:state!=='review'},{id:id+'-2',title:'Desenvolvimento',text:ch==='history'?'Mudanças políticas, conflitos e pressões econômicas enfraqueceram o império.':'Marte nos desafia a pensar em abrigo, água e novas formas de viver.',media:'Imagem com IA',stale:state!=='review'},{id:id+'-3',title:'Encerramento',text:ch==='history'?'Entender esse processo ajuda a olhar para a história com mais contexto.':'Explorar esse mundo começa com boas perguntas aqui na Terra.',media:'Meus arquivos',stale:state!=='review'}],history:[]}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))||initial()}catch{S=initial()}let noticeTimer;let persistOk=true;
const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const channel=()=>S.channels.find(c=>c.id===S.channel);const video=()=>S.videos.find(v=>v.id===S.videoId);const scene=()=>video()?.scenes.find(s=>s.id===S.sceneId)||video()?.scenes[0];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));persistOk=true}catch{persistOk=false}return persistOk}
function toast(t){$('message').textContent=t;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('message').textContent='',5500)}
function btn(label,action,cls='',data=''){return `<button class="${cls}" data-action="${action}" ${data}>${label}</button>`}
function tag(t,cls=''){return `<span class="tag ${cls}">${esc(t)}</span>`}
function status(v){if(v.published)return v.published.revision===v.revision?'Publicado · simulado':'Publicado · alterações locais';return ({draft:'Rascunho',review:'Pronto para revisão',failed:'Falha simulada',dirty:'Alterações pendentes',approved:'Aprovado · simulado',waiting:'Revisar roteiro'})[v.state]||v.state}
function navigate(route){S.route=route;save();render()}
function openVideo(id){const v=S.videos.find(x=>x.id===id);S.videoId=id;S.channel=v.channel;S.sceneId=v.scenes[0]?.id;S.tab='content';S.route='video';save();render()}
function snapshot(v){return JSON.parse(JSON.stringify({revision:v.revision,title:v.title,scenes:v.scenes,identity:v.identity}))}
function edit(v,fn,reason){v.history.unshift({...snapshot(v),reason});v.history=v.history.slice(0,15);fn();v.revision++;v.approvedRevision=null;v.state='dirty';save()}
function render(){
 $('globalnav').innerHTML=[['home','⌂ Início'],['channels','▦ Canais'],['library','▧ Biblioteca'],['settings','⚙ Configurações']].map(([id,t])=>`<button data-action="nav" data-route="${id}" ${S.route===id?'aria-current="page"':''}>${t}</button>`).join('');
 $('channelSelect').innerHTML=S.channels.map(c=>`<option value="${c.id}" ${S.channel===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
 const views={home,channels,channel:channelPage,new:newVideo,video:workspace,library,settings};$('app').innerHTML=(views[S.route]||home)();
}
function heading(eye,title,sub,action=''){return `<div class="heading"><div><p class="eyebrow">${eye}</p><h1>${esc(title)}</h1><p class="muted">${sub}</p></div>${action}</div>`}
function videoCard(v){return `<article class="card video-card"><div class="thumb ${v.channel==='space'?'space':''}"><small>Arte ilustrativa</small><b>${v.format==='short'?'9:16':'16:9'}</b></div><p class="small muted">${esc(S.channels.find(c=>c.id===v.channel).name)}</p><h3>${esc(v.title)}</h3><p>${tag(status(v),v.state==='failed'?'warn':'')}</p><div class="foot"><span class="small muted">Revisão ${v.revision}</span>${btn(v.state==='failed'?'Resolver falha':'Continuar','open','primary',`data-id="${v.id}"`)}</div></article>`}
function home(){const pending=S.videos.filter(v=>!v.published).length;return heading('Seu espaço de criação','Vamos criar o próximo vídeo?','Continue de onde parou ou comece com uma ideia.',btn('＋ Novo vídeo','new','primary'))+`<div class="stats"><div><strong>${S.channels.length}</strong><span>Canais</span></div><div><strong>${S.videos.length}</strong><span>Vídeos</span></div><div><strong>${pending}</strong><span>Não publicados</span></div></div><h2>Continue criando</h2><div class="grid">${S.videos.map(videoCard).join('')}</div>`}
function channels(){return heading('Seus canais','Uma identidade para cada história','Voz, estilo e preferências configurados uma vez.',btn('＋ Criar canal','addChannel','primary'))+`<div class="grid">${S.channels.map(c=>`<article class="card"><p class="eyebrow">${c.id==='history'?'HISTÓRIA':'CRIADOR'}</p><h2>${esc(c.name)}</h2><p class="muted">${S.videos.filter(v=>v.channel===c.id).length} vídeos · ${esc(c.language)}</p><p>${tag(c.style)} ${tag(c.quality)}</p>${btn('Abrir canal','channel','primary',`data-id="${c.id}"`)}</article>`).join('')}</div>`}
function channelTabs(tab){return `<div class="tabs" aria-label="Áreas do canal">${[['videos','Vídeos'],['ideas','Ideias'],['identity','Identidade'],['connection','Configurações']].map(([id,t])=>`<button data-action="channelTab" data-tab="${id}" ${tab===id?'aria-current="page"':''}>${t}</button>`).join('')}</div>`}
function channelPage(){const c=channel(),tab=S.channelTab||'videos';let body='';
 if(tab==='videos'){const vs=S.videos.filter(v=>v.channel===c.id).filter(v=>S.filter==='all'||(S.filter==='published'?!!v.published:S.filter==='attention'?v.state==='failed'||v.state==='review':!v.published));body=`<div class="chips">${[['all','Todos'],['working','Em criação'],['attention','Precisam de você'],['published','Publicados']].map(([id,t])=>btn(t,'filter',S.filter===id?'active':'',`data-filter="${id}"`)).join('')}</div><div class="grid">${vs.length?vs.map(videoCard).join(''):'<div class="card empty wide">Nenhum vídeo neste filtro. Crie seu próximo vídeo.</div>'}</div>`}
 if(tab==='ideas')body=`<div class="card"><h2>Uma ideia pode virar vídeo</h2><p class="muted">Ideia de demonstração: “Uma descoberta que mudou nossa história”.</p>${btn('Usar ideia','idea','primary')}<p class="small muted" style="margin-top:14px">Pesquisa e tendências não estão conectadas nesta demo.</p></div>`;
 if(tab==='identity')body=`<div class="two"><form id="identityForm" class="card"><h2>Padrões deste canal</h2><label for="cname">Nome</label><input id="cname" value="${esc(c.name)}" required><label for="cvoice">Voz</label><select id="cvoice">${options(['Voz documental','Voz curiosa','Voz serena'],c.voice)}</select><label for="cstyle">Estilo</label><select id="cstyle">${options(['Documentário','Cinematográfico','Minimalista'],c.style)}</select><label for="cquality">Qualidade e custo</label><select id="cquality">${options(['Econômico','Equilibrado','Maior qualidade'],c.quality)}</select><div style="margin-top:18px"><button class="primary" type="submit">Salvar identidade</button></div></form><div class="note">Esses padrões valem para novos vídeos. Vídeos existentes mantêm sua configuração. Dentro de um vídeo você pode adotar os novos padrões explicitamente.</div></div>`;
 if(tab==='connection')body=`<div class="card"><h2>Destino de publicação</h2><p>Canal editorial: <strong>${esc(c.name)}</strong></p><p>${tag('YouTube não conectado','warn')}</p><p class="muted">Você pode criar e editar antes de conectar. No produto, publicar exige uma autorização válida para o canal de destino.</p><div class="note">OAuth e permissões não são implementados neste protótipo. Nenhum botão solicita credenciais.</div></div>`;
 return heading('Canal',c.name,'Seu conteúdo, sua identidade.',btn('＋ Novo vídeo','new','primary'))+channelTabs(tab)+body;
}
function options(a,current){return a.map(x=>`<option ${x===current?'selected':''}>${esc(x)}</option>`).join('')}
function newVideo(){const c=channel();return heading('Novo vídeo','Qual história você quer contar?',`Canal: ${esc(c.name)}`)+`<div class="two"><form id="newForm" class="card"><label for="topic">Tema ou título</label><input id="topic" required minlength="3" placeholder="Ex.: Por que as cidades surgiram?" value="${esc(S.idea||'')}"><label for="script">Já tem um roteiro? Cole aqui (opcional)</label><textarea id="script" placeholder="Seu texto será preservado no rascunho."></textarea><div class="fieldrow"><div><label for="format">Formato</label><select id="format"><option value="short">Short · vertical</option><option value="long">Vídeo longo · horizontal</option></select></div><div><label for="duration">Duração aproximada (segundos)</label><input id="duration" type="number" min="10" max="36000" value="60" required></div></div><label class="check"><input id="reviewScript" type="checkbox" checked> Revisar roteiro antes de gerar as cenas</label><p class="small muted">Duração é uma meta; áudio real define a duração medida.</p><button type="submit" class="primary">Criar rascunho</button></form><div class="stack"><div class="card"><p class="eyebrow">Herdado do canal</p><h2>${esc(c.style)}</h2><p>${esc(c.voice)} · ${esc(c.language)}</p>${tag(c.quality)}<hr class="divider"><p class="muted small">Você pode alterar esses padrões somente neste vídeo após criar o rascunho.</p></div><div class="note">Criar e salvar não inicia geração paga. No produto, gerar exige estimativa, limite autorizado e providers disponíveis.</div></div></div>`}
function workspace(){const v=video();if(!v)return home();return `<div class="crumb">${btn('← Vídeos do canal','backChannel','ghost small')} &nbsp; ${esc(channel().name)} / ${esc(v.title)}</div>`+heading('Workspace do vídeo',v.title,`Revisão ${v.revision} · ${esc(status(v))}`,btn('Histórico','history'))+`<div class="tabs" aria-label="Áreas do vídeo">${[['content','Conteúdo'],['edit','Edição'],['publish','Publicação']].map(([id,t])=>`<button data-action="tab" data-tab="${id}" ${S.tab===id?'aria-current="page"':''}>${t}</button>`).join('')}</div>`+(v.state==='failed'?`<div class="note" style="margin-bottom:20px">Falha simulada na geração de mídia. O rascunho está preservado. ${btn('Simular retomada','retry','primary')}</div>`:'')+(S.tab==='content'?content(v):S.tab==='edit'?editor(v):publication(v));}
function content(v){return `<div class="two"><form id="contentForm" class="card"><h2>Conteúdo do vídeo</h2><label for="vtitle">Título de trabalho</label><input id="vtitle" value="${esc(v.title)}" required minlength="3"><label for="fullscript">Roteiro · cada bloco abaixo corresponde a uma cena</label><textarea id="fullscript" rows="10">${esc(v.scenes.map(s=>s.text).join('\n\n'))}</textarea><p class="small muted">Na demo, mantenha o número de blocos para preservar as cenas. Adicione e remova cenas em Edição.</p><p class="error" id="contentError"></p><button type="submit">Salvar conteúdo</button> ${btn('Editar cenas','toEdit','primary')}<p class="statusline" id="saveStatus">${persistOk?'Salvo neste navegador':'Dados em memória; armazenamento indisponível'}</p></form><div class="stack"><div class="card"><p class="eyebrow">Identidade deste vídeo</p><h2>${esc(v.identity.style)}</h2><p>${esc(v.identity.voice)}</p>${tag(v.identity.quality)}<p class="small muted" style="margin-top:12px">Snapshot do canal · mudanças no canal não alteram este vídeo.</p><details><summary>Ajustar somente este vídeo</summary><label for="vvoice">Voz</label><select id="vvoice">${options(['Voz documental','Voz curiosa','Voz serena'],v.identity.voice)}</select><label for="vstyle">Estilo</label><select id="vstyle">${options(['Documentário','Cinematográfico','Minimalista'],v.identity.style)}</select><label for="vquality">Qualidade e custo</label><select id="vquality">${options(['Econômico','Equilibrado','Maior qualidade'],v.identity.quality)}</select><div style="margin-top:14px">${btn('Aplicar ao vídeo','videoIdentity')}</div></details>${btn('Adotar padrões atuais do canal','adopt','ghost small')}</div><div class="card"><h3>Produção</h3><p class="small muted">${v.reviewScript?'Revisão do roteiro antes das cenas ativada.':'Geração direta até a revisão final.'}</p>${btn(v.reviewScript?'Revisar roteiro e simular geração':'Simular geração','generate','primary long')}<p class="small muted" style="margin-top:12px">Demonstração sem custo e sem render real.</p></div></div></div>`}
function editor(v){const sc=scene();if(!sc)return `<div class="card">Nenhuma cena. ${btn('Adicionar cena','addScene')}</div>`;return `<div class="editor"><section class="card" style="padding:12px"><div class="between"><h3>Cenas</h3><span class="small muted">${v.scenes.length}</span></div><div class="scene-list">${v.scenes.map((s,i)=>`<button class="scene ${s.id===sc.id?'active':''}" data-action="selectScene" data-id="${s.id}" aria-pressed="${s.id===sc.id}"><strong>${String(i+1).padStart(2,'0')} · ${esc(s.title)}</strong><span class="small muted">${esc(s.media)}</span>${tag(s.stale?'Pendente':'Pronta · demo',s.stale?'warn':'ok')}</button>`).join('')}</div><div style="margin-top:12px">${btn('＋ Cena','addScene','long')}</div></section><section class="stack"><div class="card"><div class="between"><h3>Prévia da cena</h3>${tag(v.renderRevision===v.revision?'Storyboard atualizado':'Prévia desatualizada',v.renderRevision===v.revision?'':'warn')}</div><div class="preview"><span class="badge">STORYBOARD ILUSTRATIVO · NÃO É MP4</span><div><div class="play">▷</div><strong>${esc(sc.title)}</strong><p style="margin-top:16px">${esc(sc.text)}</p><span class="small muted">${esc(sc.media)} · ${esc(v.identity.style)}</span></div></div><p class="statusline">Áudio e duração medida indisponíveis. Meta do vídeo: ${v.target}s. Render simulado: ${v.renderRevision?'v'+v.renderRevision:'nenhum'}.</p><div class="sequence">${v.scenes.map((s,i)=>btn(`Cena ${i+1}`,'selectScene','',`data-id="${s.id}"`)).join('')}</div></div><div class="card"><div class="between"><div><h3>Atualize só o necessário</h3><p class="small muted">${v.scenes.filter(s=>s.stale).length} cenas pendentes. A montagem final também será atualizada.</p></div>${btn('Simular atualização','generate','primary')}</div><details><summary>Detalhes de execução</summary><p class="small muted">No produto: revisão, job, cache e custos reais. Nesta demo as transições são instantâneas e locais.</p>${btn('Simular falha','fail','small')}</details></div></section><form id="sceneForm" class="card prop"><p class="eyebrow">Cena selecionada</p><h2>${esc(sc.title)}</h2><label for="sceneText">Texto da narração</label><textarea id="sceneText" required>${esc(sc.text)}</textarea><p class="small muted">Voz: ${esc(v.identity.voice)}. A pré-escuta exige áudio real.</p><button type="submit" class="primary">Salvar texto</button><p class="statusline" id="sceneSave">Salvamento não gera áudio.</p><hr class="divider"><h3>Mídia da cena</h3><p>${tag(sc.media)}</p>${btn('Trocar mídia','media','long')}<p class="small muted" style="margin-top:10px">Alternativas fictícias. Licença/proveniência reais são obrigatórias no produto.</p><hr class="divider"><div class="row">${btn('↑ Subir','up','small')}${btn('↓ Descer','down','small')}${btn('Excluir','remove','danger small')}</div></form></div>`}
function publication(v){const ready=v.renderRevision===v.revision,approved=v.approvedRevision===v.revision;return `<div class="two"><div class="stack"><div class="card"><h2>Revisão final</h2><div class="preview"><span class="badge">STORYBOARD · SEM VÍDEO REAL</span><div><strong>${esc(v.title)}</strong><p style="margin-top:16px">${v.scenes.length} cenas · ${esc(v.identity.style)}</p></div></div><div class="listrow"><span>Artefato da revisão ${v.revision}</span>${tag(ready?'Disponível · simulado':'Atualização pendente',ready?'ok':'warn')}</div><div class="listrow"><span>QA técnico</span>${tag(ready?'Aprovado · simulado':'Não executado',ready?'ok':'warn')}</div><div class="listrow"><span>Correspondência semântica</span>${tag('Não verificada','warn')}</div><div class="listrow"><span>Aprovação humana</span>${tag(approved?'Aprovada · simulada':'Pendente',approved?'ok':'warn')}</div><p class="small muted" style="margin-top:14px">Nenhuma verificação real ocorreu. O checklist só demonstra os gates de UX.</p>${btn('Aprovar esta versão · demo','approve','primary',ready?'':'disabled')}</div>${v.published?`<div class="note">Publicação simulada preservada: revisão ${v.published.revision}, título “${esc(v.published.title)}”, destino ${esc(v.published.channel)}. ${v.published.revision!==v.revision?'Há alterações locais que não mudam a publicação histórica.':''}</div>`:''}</div><div class="card"><h2>Preparar publicação</h2><label for="pubTitle">Título público</label><input id="pubTitle" value="${esc(v.title)}"><label for="description">Descrição</label><textarea id="description" placeholder="Descreva seu vídeo"></textarea><label for="privacy">Privacidade</label><select id="privacy"><option>Privado</option><option>Não listado</option><option>Público</option></select><hr class="divider"><p class="small muted">Destino editorial</p><h3>${esc(channel().name)}</h3><p>${tag('OAuth não conectado','warn')}</p><p class="small muted">A simulação abaixo não exige conexão porque não envia nada. No produto, OAuth válido é obrigatório.</p>${btn(v.published?'Publicação demo já registrada':'Confirmar publicação · demo','publish','primary long',approved&&!v.published?'':'disabled')}<p class="small muted" style="margin-top:12px">Aprovação e publicação são ações distintas. Edição local não substitui vídeo já publicado.</p></div></div>`}
function library(){return heading('Reutilize com contexto','Biblioteca','Mídias e estilos acessíveis à sua conta.')+`<div class="grid"><div class="card"><h2>Estilos</h2><p>Documentário, Cinematográfico e Minimalista.</p><p class="muted">Aplique padrões pela identidade do canal.</p>${btn('Abrir identidade do canal','identity')}</div><div class="card"><h2>Meus arquivos</h2><p class="muted">Biblioteca de assets privados proposta. Upload não implementado na demo.</p>${tag('Sem arquivos reais')}</div><div class="card"><h2>Bancos e IA</h2><p class="muted">A busca aparece ao trocar mídia de uma cena, mantendo o contexto do vídeo.</p>${tag('Providers não conectados')}</div></div>`}
function settings(){return heading('Sua conta','Configurações','Conexões e limites ficam fora do caminho diário de criação.')+`<div class="grid"><div class="card"><h2>Equipe e permissões</h2><p>Rodrigo · proprietário · demonstração.</p><p class="muted">Owner, Editor, Reviewer e Viewer são papéis propostos. Não há autenticação real.</p></div><div class="card"><h2>Providers</h2><p class="muted">N implementações por capacidade: roteiro, voz, mídia e avaliação.</p><div class="listrow"><span>Voz e mídia</span>${tag('Não conectados','warn')}</div><p class="small muted" style="margin-top:12px">Segredos ficam no backend. Nenhuma chave é coletada nesta demo.</p></div><div class="card"><h2>Orçamento</h2><p class="muted">Limites da conta, do canal e por geração. Salvar nunca inicia cobrança.</p>${tag('Custo real indisponível')}</div></div>`}
function modal(title,body,onConfirm,label='Confirmar'){const el=$('modal');el.innerHTML=`<h2 id="modalTitle">${title}</h2>${body}<div class="row"><button data-action="closeModal">Cancelar</button><button class="primary" id="confirmModal">${label}</button></div>`;el.showModal();$('confirmModal').onclick=()=>{if(onConfirm()!==false)el.close()};}
function generate(){const v=video();modal(v.reviewScript&&v.state==='draft'?'Revisar roteiro e gerar · demo':'Atualizar vídeo · demo',`<p>Revisão ${v.revision} · ${v.scenes.filter(s=>s.stale).length} cenas pendentes.</p><p class="muted">No produto, esta etapa mostra custo estimado, limite e providers escolhidos. Aqui não existe chamada externa.</p><label class="check"><input type="checkbox" id="genConsent"> ${v.reviewScript?'Revisei o roteiro e quero simular a geração.':'Quero simular a geração desta revisão.'}</label><p class="error" id="genError"></p>`,()=>{if(!$('genConsent').checked){$('genError').textContent='Marque a confirmação para continuar.';return false}v.scenes.forEach(s=>s.stale=false);v.renderRevision=v.revision;v.state='review';v.approvedRevision=null;S.tab='edit';save();render();toast('Atualização simulada. Nenhum áudio, imagem ou MP4 foi gerado.')},'Simular geração');}
function handle(a,el){const v=video();switch(a){
 case 'nav':navigate(el.dataset.route);break;
 case 'new':S.idea='';navigate('new');break;
 case 'open':openVideo(el.dataset.id);break;
 case 'channel':S.channel=el.dataset.id;S.channelTab='videos';S.filter='all';navigate('channel');break;
 case 'channelTab':S.channelTab=el.dataset.tab;navigate('channel');break;
 case 'filter':S.filter=el.dataset.filter;save();render();break;
 case 'backChannel':S.channelTab='videos';navigate('channel');break;
 case 'identity':S.channelTab='identity';navigate('channel');break;
 case 'idea':S.idea='Uma descoberta que mudou nossa história';navigate('new');break;
 case 'tab':S.tab=el.dataset.tab;save();render();break;
 case 'toEdit':S.tab='edit';save();render();break;
 case 'selectScene':S.sceneId=el.dataset.id;save();render();break;
 case 'closeModal':$('modal').close();break;
 case 'generate':generate();break;
 case 'retry':generate();break;
 case 'fail':v.state='failed';save();render();toast('Falha simulada; rascunho preservado.');break;
 case 'approve':if(v.renderRevision!==v.revision)return toast('Atualize o vídeo primeiro.');v.approvedRevision=v.revision;v.state='approved';save();render();toast('Aprovação simulada para esta revisão.');break;

 case 'up':case 'down':{const i=v.scenes.findIndex(s=>s.id===scene().id),j=i+(a==='up'?-1:1);if(j<0||j>=v.scenes.length)return toast('A cena já está no limite da sequência.');edit(v,()=>{[v.scenes[i],v.scenes[j]]=[v.scenes[j],v.scenes[i]]},'Reordenar cenas');render();break}

 case 'videoIdentity':{const next={voice:$('vvoice').value,style:$('vstyle').value,quality:$('vquality').value};edit(v,()=>{v.identity=next;v.scenes.forEach(s=>s.stale=true)},'Identidade do vídeo');render();toast('Alteração aplicada somente ao vídeo.');break}

function enrich(v){const c=S.channels.find(c=>c.id===v.channel)||channel();v.config??={...DEFAULTS,...c.settings};v.sources??=[{id:'source-'+v.id,title:'Notas de pesquisa · exemplo',text:'Material de demonstração para mostrar o fluxo de fontes. Não constitui evidência factual verificada.',type:'Texto',status:'Exemplo'}];v.qaVersion??=null;v.voiceVersion??=null;v.publicMeta??={title:v.title,description:'',privacy:'Privado',date:'',thumbnail:'Título curto + imagem principal'};v.localStatus??='idle';return v}
function setting(scope,key){if(scope==='channel')return channel().settings[key];if(scope==='video')return video().config[key];return S.account[key]}
function formField(label,key,scope='channel',optionsList=null,type='text',hint=''){
 const val=setting(scope,key);const id='field-'+scope+'-'+key;let input;
 if(type==='checkbox')return `<label class="check" for="${id}"><input id="${id}" type="checkbox" data-bind="${key}" data-scope="${scope}" ${val?'checked':''}>${label}</label>${hint?`<p class="sample">${hint}</p>`:''}`;
 if(optionsList)input=`<select id="${id}" data-bind="${key}" data-scope="${scope}">${options(optionsList,val)}</select>`;
 else if(type==='textarea')input=`<textarea id="${id}" data-bind="${key}" data-scope="${scope}" rows="3">${esc(val)}</textarea>`;
 else input=`<input id="${id}" type="${type}" ${type==='number'?'min="0" step="any"':''} data-bind="${key}" data-scope="${scope}" value="${esc(val)}">`;
 return `<div><label for="${id}">${label}</label>${input}${hint?`<p class="sample">${hint}</p>`:''}</div>`;
}

iv><div class="listrow"><span>Legendas / música</span><b>${c.settings.captions?'Sim':'Não'} / ${c.settings.music?'Sim':'Não'}</b></div><div class="listrow"><span>Qualidade</span><b>${esc(c.quality)}</b></div></div><div class="card"><h3>Seu caminho até publicar</h3><p>1. Adicione fontes e revise o roteiro.<br>2. Gere narração e monte as cenas.<br>3. Ajuste composição e confira a qualidade.<br>4. Aprove a versão e prepare a publicação.</p><p class="sample">Etapas reunidas dentro do vídeo. Você pode voltar para ajustar qualquer parte.</p></div></div></div>`};
