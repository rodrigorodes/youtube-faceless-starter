function voicePanel(v){return `<div class="two"><div class="stack"><div class="card"><div class="subheading"><div><h2>Narração do vídeo</h2><p class="muted">Escolha a voz, ajuste o ritmo e revise cada trecho.</p></div>${btn('Gerar narração · demo','voiceGenerate','primary')}</div><div class="formgrid"><div><label for="voiceName">Voz do narrador</label><select id="voiceName" data-voice>${options(['Voz documental','Voz curiosa','Voz serena'],v.identity.voice)}</select></div>${formField('Provider de voz','voiceProvider','video',['Piper local','Provider de voz externo'])}${formField('Velocidade','voiceSpeed','video',null,'number','1 = ritmo normal; suporte real depende do provider.')}</div><div class="fake-wave" aria-hidden="true">${Array.from({length:42},(_,i)=>`<span style="height:${8+(i*17)%43}px"></span>`).join('')}</div><p class="sample">Forma de onda ilustrativa. Áudio real não está disponível no protótipo.</p>${btn('Pré-escuta: ver roteiro','voiceSample','ghost')}<p class="sample" style="margin-top:12px">Alinhamento por palavra: indisponível sem provider/alinhador compatível.</p></div><div class="card"><h3>Trechos por cena</h3>${v.scenes.map((s,i)=>`<div class="listrow"><div><strong>${i+1}. ${esc(s.title)}</strong><p class="small muted">${esc(s.text)}</p></div>${btn('Ajustar trecho','voiceScene','small',`data-id="${s.id}"`)}</div>`).join('')}</div></div><div class="card"><h3>Identidade de voz</h3><p>${esc(v.identity.voice)}</p><p class="muted">Essa escolha vale para este vídeo. Mudar aqui não altera os outros vídeos do canal.</p><hr class="divider"><h3>Estado da narração</h3><p>${v.voiceVersion===v.revision?'Gerada na simulação para a revisão atual.':'Pendente ou desatualizada.'}</p><p class="sample">Duração-alvo: ${v.target}s<br>Duração medida: não disponível</p>${btn('Próximo: cenas e mídias','videoTab','primary long','data-tab="edit"')}</div></div>`}
function mediaPanel(v){return `<div class="heading"><div><h2>Storyboard, cenas e mídias</h2><p class="muted">Texto, voz e visual da mesma cena, no mesmo lugar.</p></div>${btn('Ver composição','videoTab','','data-tab="composition"')}</div>`+baseEditor(v)+`<div class="card" style="margin-top:20px"><h3>Estratégia de mídia deste vídeo</h3><div class="formgrid">${formField('Origem preferida','mediaPolicy','video',['Banco de mídia primeiro','IA primeiro','Somente meus arquivos'])}${formField('B-roll e imagens complementares','broll','video',null,'checkbox')}</div><p class="sample">A troca real deve apresentar candidatos, licença, custo e proveniência. Nesta demo, a seleção é local.</p></div>`}
function compositionPanel(v){return `<div class="two"><div class="stack"><div class="card"><h2>Composição do vídeo</h2>${videoPreview(v)}<p class="sample" style="margin-top:12px">Timeline ilustrativa de uma cena · posição proporcional, sem tempo real medido.</p>${[['Imagem base',0,100],['B-roll',35,40],['Título',8,28],['Legendas',0,100],['Narração',0,100],['Música',0,100]].filter(([n])=>n!=='B-roll'||v.config.broll).filter(([n])=>n!=='Legendas'||v.config.captions).filter(([n])=>n!=='Música'||v.config.music).map(([n,l,w])=>`<div class="trackline"><span>${n}</span><div class="rail"><span style="left:${l}%;width:${w}%"></span></div></div>`).join('')}</div><div class="card"><h3>Montagem</h3><p class="muted">A prévia final combina cenas, narração, trilha, textos e legendas.</p><div class="row">${btn('Montar vídeo · demo','generate','primary')}${btn('Ver qualidade','videoTab','','data-tab="quality"')}</div></div></div><div class="card"><h2>Aparência e saída</h2>${formField('Legendas','captions','video',null,'checkbox')}${formField('Música','music','video',null,'checkbox')}${formField('B-roll','broll','video',null,'checkbox')}${formField('Resolução','resolution','video',['720p','1080p'])}${formField('Quadros por segundo','fps','video',['24','25','30','60'])}${formField('Transição','transition','video',['Fade','Corte'])}${formField('Movimento','motion','video',['Suave','Estático'])}<details><summary>Avançado: tipografia e áudio</summary>${formField('Fonte','font','video',['Inter','Roboto','Serif'])}${formField('Tamanho da legenda','captionSize','video',null,'number')}${formField('Volume da música (%)','musicVolume','video',null,'number')}<p class="sample">Salvar configurações invalida o artefato atual, sem iniciar render. Capacidades reais devem restringir opções no aplicativo.</p></details>${savedbar('vídeo')}</div></div>`}
function qualityPanel(v){const rendered=v.renderRevision===v.revision,checked=v.qaVersion===v.revision;return `<div class="two"><div class="card"><div class="subheading"><div><h2>Qualidade e revisão</h2><p class="muted">Veja o que precisa de ajuste antes de aprovar.</p></div>${btn('Verificar · demo','qaCheck','primary')}</div>${['Duração, resolução e FPS','Presença de narração','Cobertura das cenas','Legendas e área segura','Composição e camadas'].map(t=>`<div class="listrow"><span>${t}</span>${tag(checked?'Passou · simulado':rendered?'Pendente':'Render desatualizado',checked?'ok':'warn')}</div>`).join('')}<div class="listrow"><span>Correspondência entre roteiro e imagem</span>${tag('Não verificada','warn')}</div><p class="sample" style="margin-top:16px">Avaliação semântica depende de provider real. A demo não executa FFprobe, FFmpeg ou visão computacional.</p></div><div class="stack"><div class="card"><h3>Correção direcionada</h3><p class="muted">Se uma imagem não combina com a fala, selecione a cena e troque a mídia.</p>${btn('Revisar cenas','videoTab','','data-tab="edit"')}</div><div class="card"><h3>Aprovação desta versão</h3><p>Versão atual: v${v.revision}<br>${v.approvedRevision===v.revision?'Aprovada · simulação':'Aguardando aprovação'}</p>${btn('Aprovar esta versão · demo','approve','primary long',checked?'':'disabled')}<p class="sample" style="margin-top:12px">Alterações no vídeo exigem nova revisão e aprovação.</p>${btn('Preparar publicação →','videoTab','ghost','data-tab="publish"')}</div></div></div>`}
function publishPanel(v){let body=basePublication(v);body=body.replace('Aprovado · simulado',v.qaVersion===v.revision?'Aprovado · simulado':'Não verificado');return body+`<div class="card" style="margin-top:20px"><h2>Thumbnail e agendamento</h2><div class="formgrid"><div><label for="thumbBrief">Direção da thumbnail</label><input id="thumbBrief" data-meta="thumbnail" value="${esc(v.publicMeta.thumbnail)}"><p class="sample">Briefing persistido; imagem final não é gerada na demo.</p></div><div><label for="schedule">Data e hora desejadas</label><input id="schedule" type="datetime-local" data-meta="date" value="${esc(v.publicMeta.date)}"><p class="sample">Horário local do dispositivo. Apenas rascunho; não agenda no YouTube.</p></div></div>${btn('Salvar metadados de publicação','savePublication','primary')}<p class="sample" style="margin-top:12px">No produto, alterações de destino, metadados ou agendamento invalidam a intenção de envio anterior.</p></div>`}
function productionPanel(v){const complete=v.renderRevision===v.revision;const stages=[['content','Fontes e roteiro',v.sources.length?'Fontes adicionadas':'Aguardando fontes'],['voice','Narração',v.voiceVersion===v.revision?'Pronta · simulação':'Pendente'],['edit','Storyboard e mídia',v.scenes.filter(s=>s.stale).length?'Cenas pendentes':'Prontas · simulação'],['composition','Composição',complete?'Pronta · simulação':'Pendente'],['quality','Qualidade',v.qaVersion===v.revision?'Verificada · simulação':'Pendente'],['publish','Aprovação e publicação',status(v)]];return `<div class="two"><div class="card"><h2>Etapas da produção</h2><p class="muted">Cada etapa leva à funcionalidade correspondente deste vídeo.</p>${stages.map(([tab,label,state],i)=>`<div class="stageitem"><div><span class="num">${i+1}</span><strong>${label}</strong><p class="sample" style="margin:5px 0 0 38px">${esc(state)}</p></div>${btn('Abrir','videoTab','small',`data-tab="${tab}"`)}</div>`).join('')}<div class="row" style="margin-top:20px">${btn('Iniciar / atualizar · demo','generate','primary')}${btn('Pausar','pause')}${btn('Retomar','resume')}${btn('Tentar novamente','retry')}${btn('Cancelar','cancel','danger')}</div><p class="sample" style="margin-top:14px">Estado local: ${esc(v.localStatus)} · controles simulados, sem worker em execução.</p></div><div class="stack"><div class="card"><h3>Custo e limites</h3><div class="listrow"><span>Limite por vídeo</span><b>US$ ${v.config.videoHard}</b></div><div class="listrow"><span>Estimativa real</span><b>Não calculada</b></div><div class="listrow"><span>Consumo real</span><b>Não disponível</b></div>${btn('Providers e opções deste vídeo','videoAdvanced')}</div><div class="card"><h3>Diagnóstico da execução</h3><p class="sample">Vídeo: ${esc(v.id)}<br>Revisão: ${v.revision}<br>Render simulado: ${v.renderRevision||'nenhum'}</p>${btn('Simular falha recuperável','fail','small')}${btn('Configuração efetiva','effective','ghost small')}</div></div></div>`}
settings=function(){const tab=S.settingsTab;const panel={channels:settingsChannels,strategy:settingsStrategy,brand:settingsBrand,production:settingsProduction,connections:settingsConnections,team:settingsTeam,advanced:settingsAdvanced};return heading('CONFIGURAÇÕES','Seu estúdio, do seu jeito','Identidade do canal, produção, integrações e controles avançados.')+`<div class="cfg"><nav class="cfgmenu" aria-label="Áreas de configuração">${CFG.map(([id,t])=>btn(t,'setting',tab===id?'active':'',`data-tab="${id}" ${tab===id?'aria-current="page"':''}`)).join('')}</nav><div>${(panel[tab]||settingsChannels)()}</div></div>`};
function settingsChannels(){return `<div class="card"><div class="subheading"><div><h2>Canais do estúdio</h2><p class="muted">Cada canal mantém seus vídeos, identidade e destino.</p></div>${btn('＋ Novo canal','addChannel','primary')}</div>${S.channels.map(c=>`<div class="listrow"><div><strong>${esc(c.name)}</strong><p class="sample">${S.videos.filter(v=>v.channel===c.id).length} vídeos · ${esc(c.language)} · ${esc(c.style)}</p></div>${btn(c.id===S.channel?'Canal ativo':'Selecionar','selectConfigChannel',c.id===S.channel?'primary small':'small',`data-id="${c.id}"`)}</div>`).join('')}<hr class="divider"><h3>Destino YouTube do canal ativo</h3><p>${esc(channel().name)}</p>${tag(channel().demoConnected?'Vínculo fictício configurado':'Sem conexão real','warn')}<p class="sample" style="margin-top:10px">Conta Google, canal editorial e autorização YouTube são identidades distintas.</p>${btn('Gerenciar conexão','setting','','data-tab="connections"')}</div>`}
function settingsStrategy(){return `<div class="card"><h2>Estratégia editorial</h2>${channelTop()}<div class="formgrid">${formField('Estratégia do canal','strategy','channel',null,'textarea')}${formField('Público-alvo','audience','channel',null,'textarea')}${formField('Pilares de conteúdo (separados por vírgula)','pillars')}${formField('Estilo narrativo','narrative')}${formField('Duração padrão (segundos)','duration','channel',null,'number')}${formField('Chamada para ação','cta')}</div><div class="fieldrow"><div><label for="channelLanguage">Idioma</label><select id="channelLanguage" data-channel-prop="language">${options(['pt-BR','en-US','es-ES'],channel().language)}</select></div><div><label for="channelName">Nome do canal</label><input id="channelName" data-channel-prop="name" value="${esc(channel().name)}"></div></div>${savedbar()}</div>`}
function settingsBrand(){const c=channel();return `<div class="stack"><div class="card"><div class="subheading"><div><h2>Marca e estilo</h2>${channelTop()}</div>${btn('Biblioteca de estilos','nav','','data-route="library"')}</div><div class="formgrid"><div><label for="channelStyle">Estilo visual</label><select id="channelStyle" data-channel-prop="style">${options(['Documentário','Cinematográfico','Minimalista'],c.style)}</select></div><div><label for="channelVoice">Voz padrão</label><select id="channelVoice" data-channel-prop="voice">${options(['Voz documental','Voz curiosa','Voz serena'],c.voice)}</select></div>${formField('Cor da marca','brandColor','channel',null,'color')}${formField('Direção da thumbnail','thumbnail')}</div><div class="feature-preview" style="margin-top:20px"><strong>${esc(c.style)}</strong><span>${esc(c.voice)} · prévia ilustrativa</span></div></div><div class="card"><h3>Legendas e tipografia</h3><div class="formgrid">${formField('Exibir legendas','captions','channel',null,'checkbox')}${formField('Fonte','font','channel',['Inter','Roboto','Serif'])}${formField('Estilo das legendas','captionPreset','channel',['Caixa discreta','Contorno','Destaque por cue'])}${formField('Tamanho','captionSize','channel',null,'number')}${formField('Posição','captionPosition','channel',['Inferior','Centro'])}</div><hr class="divider"><h3>Música, voz e movimento</h3><div class="formgrid">${formField('Música de fundo','music','channel',null,'checkbox')}${formField('Volume da música (%)','musicVolume','channel',null,'number')}${formField('Clima musical','musicMood','channel',['Documental','Suspense','Leve'])}${formField('Velocidade da voz','voiceSpeed','channel',null,'number')}${formField('Movimento','motion','channel',['Suave','Estático'])}${formField('Transição','transition','channel',['Fade','Corte'])}</div>${savedbar()}</div></div>`}
function providersFor(cap){return ['Automático',...S.account.providers.filter(p=>p.capability.includes(cap)).map(p=>p.name)]}
function settingsProduction(){return `<div class="card"><h2>Produção e orçamento</h2>${channelTop()}<div class="pillrow">${['Econômico','Equilibrado','Maior qualidade'].map(p=>`<button class="choice ${channel().quality===p?'active':''}" data-action="profile" data-profile="${p}"><strong>${p}</strong><span class="sample">${p==='Econômico'?'Priorizar custo conhecido':p==='Equilibrado'?'Equilibrar custo e qualidade':'Priorizar qualidade elegível'}</span></button>`).join('')}</div><hr class="divider"><h3>Limites em US$</h3><div class="formgrid">${formField('Alerta mensal (soft)','monthlySoft','channel',null,'number')}${formField('Teto mensal (hard)','monthlyHard','channel',null,'number')}${formField('Alerta por vídeo (soft)','videoSoft','channel',null,'number')}${formField('Teto por vídeo (hard)','videoHard','channel',null,'number')}</div><hr class="divider"><h3>Preferências de produção</h3><div class="formgrid">${formField('Resolução','resolution','channel',['720p','1080p'])}${formField('FPS','fps','channel',['24','25','30','60'])}${formField('Preferência de mídia','mediaPolicy','channel',['Banco de mídia primeiro','IA primeiro','Somente meus arquivos'])}${formField('Revisar roteiro antes de gerar cenas','reviewScript','channel',null,'checkbox')}</div><details open><summary>Avançado: providers por tarefa e fallback</summary><div class="formgrid">${formField('Roteiro','textProvider','channel',providersFor('Roteiro'))}${formField('Imagens','imageProvider','channel',providersFor('Imagem'))}${formField('Vídeo / B-roll','videoProvider','channel',providersFor('vídeo'))}${formField('Narração','voiceProvider','channel',['Piper local',...S.account.providers.filter(p=>p.capability==='Voz'&&p.name!=='Piper local').map(p=>p.name)])}${formField('Avaliação semântica','qualityProvider','channel',['Não configurado',...S.account.providers.filter(p=>p.capability==='Avaliação visual').map(p=>p.name)])}${formField('Se o provider falhar','fallback','channel',['Pedir confirmação','Usar alternativa dentro dos limites'])}${formField('Máximo de tentativas','maxRetries','channel',null,'number')}</div><p class="sample">Nunca trocar voz de identidade ou exceder limite silenciosamente. O catálogo real vem do registry, não desta lista de demonstração.</p></details>${savedbar()}</div>`}
function settingsConnections(){return `<div class="stack"><div class="card"><h2>Contas e canais do YouTube</h2><p class="muted">Associe o canal editorial a uma autorização específica.</p><div class="listrow"><div><strong>${esc(channel().name)}</strong><p class="sample">${channel().demoConnected?'Conta de exemplo → canal de exemplo · sem token':'Nenhum OAuth real neste protótipo'}</p></div>${btn('Configurar vínculo · demo','connectYoutube')}</div></div><div class="card"><div class="subheading"><div><h2>Providers por capacidade</h2><p class="muted">Disponibilidade, credencial e seleção são informações distintas.</p></div>${btn('＋ Adicionar provider','addProvider','primary')}</div>${S.account.providers.map((p,i)=>`<div class="listrow"><div><strong>${esc(p.name)}</strong><p class="sample">${esc(p.capability)} · ${esc(p.model)} · ${esc(p.state)}</p></div><div class="row">${btn('Configurar','editProvider','small',`data-index="${i}"`)}${btn('Testar · demo','testProvider','ghost small',`data-index="${i}"`)}</div></div>`).join('')}<p class="sample" style="margin-top:12px">Adicionar aqui demonstra registro de conexão; não instala adapters no core. Nenhum teste de rede é executado.</p></div><div class="card"><h2>Credenciais BYOK</h2><p class="muted">Referências e estado da chave. Não cole segredos neste protótipo.</p>${S.account.keys.map((k,i)=>`<div class="listrow"><div><strong>${esc(k.alias)}</strong><p class="sample">${esc(k.provider)} · ${esc(k.state)}</p></div>${btn('Revogar referência','revokeKey','small',`data-index="${i}"`)}</div>`).join('')||'<p class="sample">Nenhuma referência cadastrada.</p>'}${btn('Cadastrar referência fictícia','addKey')}</div></div>`}
function settingsTeam(){return `<div class="stack"><div class="card"><h2>Conta e preferências</h2><div class="formgrid">${formField('Nome do estúdio','name','account')}${formField('Aparência','theme','account',['Escuro','Claro'])}</div>${savedbar('conta / usuário')}</div><div class="card"><div class="subheading"><div><h2>Equipe e permissões</h2><p class="muted">Papéis de exemplo. Nenhum convite é enviado.</p></div>${btn('＋ Adicionar membro · demo','addMember','primary')}</div>${S.account.members.map((m,i)=>`<div class="listrow"><div><strong>${esc(m.name)}</strong><p class="sample">${esc(m.email)}</p></div><select aria-label="Papel de ${esc(m.name)}" data-member="${i}" style="max-width:155px" ${i===0?'disabled':''}>${options(['Owner','Editor','Reviewer','Viewer'],m.role)}</select></div>`).join('')}<div class="tablewrap" style="margin-top:20px"><table class="matrix"><tr><th>Papel</th><th>Editar / gerar</th><th>Aprovar</th><th>Publicar</th></tr><tr><td>Owner</td><td>Sim</td><td>Sim</td><td>Sim</td></tr><tr><td>Editor</td><td>Sim</td><td>Não</td><td>Não</td></tr><tr><td>Reviewer</td><td>Não</td><td>Sim</td><td>Não</td></tr><tr><td>Viewer</td><td>Não</td><td>Não</td><td>Não</td></tr></table></div><p class="sample">Matriz proposta. Isolamento e permissões reais exigem backend; esta demo não implementa autenticação.</p></div></div>`}
function settingsAdvanced(){return `<div class="stack"><div class="card"><h2>Avançado e diagnóstico</h2><p class="muted">Render, configuração efetiva, saúde de providers e automação.</p><div class="grid"><div><h3>Render engine</h3><p class="sample">FFmpeg · adapter existente<br>Multilayer: evolução VE-01/02<br>Estado real: não consultado</p></div><div><h3>Qualidade</h3><p class="sample">QA técnico obrigatório<br>Semântico opcional<br>Ausente = não verificado</p></div><div><h3>Automação</h3><p class="sample">n8n → casos de uso existentes<br>Sem segundo pipeline<br>Sem conexão ativa na demo</p></div></div></div><div class="card"><h3>Configuração efetiva do canal</h3><p class="sample">Valores locais do protótipo. Não é resposta da API real.</p><details><summary>Inspecionar configuração sanitizada</summary><pre style="white-space:pre-wrap;word-break:break-word;font-size:12px">${esc(JSON.stringify({channel:channel().id,profile:channel().quality,settings:channel().settings},null,2))}</pre></details><hr class="divider"><h3>Saúde dos providers</h3>${S.account.providers.map(p=>`<div class="listrow"><span>${esc(p.name)}</span><span class="sample">${esc(p.state)}</span></div>`).join('')}<hr class="divider"><h3>API e logs</h3><p class="sample">O inventário do projeto deve mapear endpoints reais. Não há logs do servidor ou documentação de API conectada à demo.</p>${btn('Ver contrato de operação','apiInfo')}${btn('Reiniciar dados da demonstração','reset','ghost small')}</div></div>`}
function ideaCards(){return [{id:'i1',title:'Uma descoberta que mudou nossa história',pillar:channel().settings.pillars.split(',')[0].trim()||'Geral',type:'Ideia editorial'},{id:'i2',title:'O que quase ninguém sabe sobre este lugar',pillar:'Curiosidades',type:'Tendência de exemplo'},{id:'i3',title:'Três perguntas para entender o futuro',pillar:'Tecnologia',type:'Ideia editorial'}]}
function ideaCard(i){return `<article class="card"><p class="eyebrow">${esc(i.pillar)}</p><h3>${esc(i.title)}</h3><p class="sample">${i.type} · dados fictícios, sem busca de tendências.</p>${btn('Criar vídeo com esta ideia','useIdea','primary',`data-title="${esc(i.title)}"`)}</article>`}
function ideasPage(){return heading('TENDÊNCIAS E IDEIAS','Encontre sua próxima história','Ideias organizadas por pilares do canal.',btn('Gerenciar pilares','setting','','data-tab="strategy"'))+`<div class="chips">${['Todas',...new Set(ideaCards().map(i=>i.pillar))].map(p=>btn(p,'ideaFilter',p===S.ideaFilter?'active':'',`data-filter="${esc(p)}"`)).join('')}</div><div class="grid">${ideaCards().filter(i=>S.ideaFilter==='Todas'||i.pillar===S.ideaFilter).map(ideaCard).join('')}</div>`}
function analyticsPage(){return heading('DESEMPENHO','Como seu canal está evoluindo','Visão demonstrativa: métricas reais não estão conectadas.')+`<div class="chips">${['7','28','90'].map(p=>btn(p+' dias','period',p===S.analyticsPeriod?'active':'',`data-period="${p}"`)).join('')}</div><div class="metricgrid">${[['Visualizações','12,4 mil'],['Tempo assistido','416 h'],['Inscritos','+128'],['Vídeos publicados','8']].map(([l,v])=>`<div class="card metricbox"><span class="muted">${l}</span><strong>${v}</strong><span class="sample">Exemplo fixo · não medido</span></div>`).join('')}</div><div class="card" style="margin-top:20px"><h2>Visualizações no período</h2><p class="sample">Ilustração fixa para ${S.analyticsPeriod} dias. Alterar período não consulta dados.</p><div class="bars" aria-label="Gráfico ilustrativo sem dados reais">${[20,35,28,45,40,58,48,70,62,85,75,100].map(h=>`<span style="height:${h}%"></span>`).join('')}</div></div>`}
library=function(){return heading('BIBLIOTECA','Estilos e mídias reutilizáveis','Os estilos são reutilizados; personalizações do canal permanecem independentes.')+`<div class="tabs">${[['styles','Estilos visuais'],['media','Mídias'],['voices','Vozes']].map(([id,t])=>btn(t,'libraryTab',S.libraryTab===id?'primary':'',`data-tab="${id}"`)).join('')}</div>`+(S.libraryTab==='styles'?`<div class="grid">${['Documentário','Cinematográfico','Minimalista'].map(st=>`<div class="card"><div class="feature-preview"><strong>${st}</strong><span>Prévia ilustrativa</span></div><h3 style="margin-top:18px">${st}</h3><p class="sample">Aplicar ao canal cria preferência para novos vídeos.</p>${btn('Usar neste canal','applyStyle','primary',`data-style="${st}"`)}</div>`).join('')}</div>`:S.libraryTab==='voices'?`<div class="grid">${['Voz documental','Voz curiosa','Voz serena'].map(st=>`<div class="card"><h2>${st}</h2><p class="sample">Perfil demonstrativo; áudio não disponível.</p>${btn('Usar no canal','applyVoice','primary',`data-voice="${st}"`)}</div>`).join('')}</div>`:`<div class="card"><h2>Mídias dos vídeos</h2>${S.videos.filter(v=>v.channel===S.channel).flatMap(v=>v.scenes.map((s,i)=>`<div class="listrow"><div><strong>${esc(v.title)} · cena ${i+1}</strong><p class="sample">${esc(s.media)} · referência ilustrativa, sem arquivo real</p></div>${btn('Abrir cena','libraryScene','small',`data-video="${v.id}" data-scene="${s.id}"`)}</div>`)).join('')||'<p>Nenhuma mídia neste canal.</p>'}</div>`)};
function providerDialog(index){const p=index===undefined?{name:'',capability:'Roteiro',model:''}:S.account.providers[index];modal(index===undefined?'Adicionar provider · demonstração':'Configurar provider',`<label for="providerName">Nome</label><input id="providerName" value="${esc(p.name)}"><label for="providerCapability">Capacidade</label><select id="providerCapability">${options(['Roteiro','Voz','Imagem e vídeo','Avaliação visual','Render'],p.capability)}</select><label for="providerModel">Modelo ou configuração</label><input id="providerModel" value="${esc(p.model)}"><p class="sample" style="margin-top:12px">Catálogo local. Nenhum adapter ou credencial real é criado.</p><p id="providerError" class="error"></p>`,()=>{const name=$('providerName').value.trim();if(!name){$('providerError').textContent='Informe um nome.';return false}const next={id:p.id||'provider-'+Date.now(),name,capability:$('providerCapability').value,model:$('providerModel').value||'A configurar',state:'Configurado localmente · não testado'};if(index===undefined)S.account.providers.push(next);else S.account.providers[index]=next;save();render()},'Salvar provider');}
handle=function(a,el){const v=video();switch(a){
case 'nav':if(el.dataset.route==='new')S.idea='';return navigate(el.dataset.route);
case 'quickCreate':S.idea=$('quickIdea').value.trim();return navigate('new');
case 'open':S.videoTab='overview';return baseHandle(a,el);
case 'channel':S.channel=el.dataset.id;S.filter='all';return navigate('videos');
case 'backChannel':return navigate('videos');
case 'videoTab':S.videoTab=el.dataset.tab;save();return render();
case 'setting':S.settingsTab=el.dataset.tab;return navigate('settings');
case 'selectConfigChannel':S.channel=el.dataset.id;save();return render();
case 'identity':S.settingsTab='brand';return navigate('settings');
case 'channelTab':S.settingsTab=el.dataset.tab==='identity'?'brand':'channels';return navigate('settings');
case 'profile':channel().quality=el.dataset.profile;save();render();return toast('Perfil salvo para novos vídeos.');
case 'addProvider':return providerDialog();
case 'editProvider':return providerDialog(Number(el.dataset.index));
case 'testProvider':S.account.providers[Number(el.dataset.index)].state='Teste simulado · sem rede';save();render();return toast('Nenhuma conexão real foi testada.');
case 'connectYoutube':return modal('Vínculo de canal · demonstração',`<p>Canal editorial: <strong>${esc(channel().name)}</strong></p><p>Conta e canal YouTube fictícios serão associados apenas nesta demo.</p>`,()=>{channel().demoConnected=true;save();render()},'Simular vínculo');
case 'addKey':return modal('Referência BYOK fictícia',`<label for="keyAlias">Apelido da referência (não é a chave)</label><input id="keyAlias" placeholder="ex.: texto-producao"><label for="keyProvider">Provider</label><select id="keyProvider">${S.account.providers.map(p=>`<option>${esc(p.name)}</option>`).join('')}</select><p class="sample" style="margin-top:12px">Não informe API keys, tokens ou senhas.</p>`,()=>{if(!$('keyAlias').value.trim())return false;S.account.keys.push({alias:$('keyAlias').value.trim(),provider:$('keyProvider').value,state:'Referência fictícia ativa'});save();render()},'Salvar referência');
case 'revokeKey':S.account.keys[Number(el.dataset.index)].state='Revogada localmente';save();return render();
case 'addMember':return modal('Adicionar membro · demonstração',`<label for="memberName">Nome</label><input id="memberName"><label for="memberEmail">E-mail fictício</label><input id="memberEmail" type="email" placeholder="pessoa@exemplo.test"><label for="memberRole">Papel</label><select id="memberRole">${options(['Editor','Reviewer','Viewer'],'Editor')}</select>`,()=>{if(!$('memberName').value.trim()||!$('memberEmail').value.includes('@'))return false;S.account.members.push({name:$('memberName').value,email:$('memberEmail').value,role:$('memberRole').value});save();render()},'Adicionar localmente');
case 'addSource':return modal('Adicionar fonte ao vídeo',`<label for="sourceTitle">Título da fonte</label><input id="sourceTitle"><label for="sourceType">Tipo</label><select id="sourceType"><option>Texto</option><option>URL</option></select><label for="sourceText">Texto ou URL</label><textarea id="sourceText"></textarea><p class="sample">Uma URL registrada não significa fonte extraída ou verificada.</p><p id="sourceError" class="error"></p>`,()=>{const text=$('sourceText').value.trim();if(!text){$('sourceError').textContent='Informe o conteúdo ou endereço.';return false}v.sources.push({id:'src-'+Date.now(),title:$('sourceTitle').value.trim()||'Nova fonte',text,type:$('sourceType').value,status:'Registrada · não verificada'});save();render()},'Adicionar fonte');
case 'removeSource':v.sources.splice(Number(el.dataset.index),1);save();return render();
case 'voiceSample':return modal('Pré-escuta de narração',`<p>${esc(v.scenes[0].text)}</p><p class="sample">No produto, este trecho terá áudio real do provider selecionado. O protótipo não sintetiza voz.</p>`,()=>{},'Fechar');
case 'voiceScene':S.sceneId=el.dataset.id;S.videoTab='edit';save();return render();
case 'voiceGenerate':return modal('Gerar narração · simulação',`<p>${esc(v.identity.voice)} · ${esc(v.config.voiceProvider)} · velocidade ${v.config.voiceSpeed}.</p><p class="sample">No produto: custo estimado e limite antes da chamada. Nenhum áudio é gerado aqui.</p>`,()=>{v.voiceVersion=v.revision;save();render()},'Simular narração');
case 'qaCheck':if(v.renderRevision!==v.revision)return toast('Monte a revisão atual antes de verificar.');v.qaVersion=v.revision;save();return render();
case 'approve':if(v.qaVersion!==v.revision)return toast('Verifique a qualidade da revisão atual antes de aprovar.');return baseHandle(a,el);
case 'generate':case 'retry':if(!v.sources.length)return toast('Adicione fontes antes de iniciar a produção.');return baseHandle(a,el);
case 'pause':v.localStatus='Pausado · simulação';save();return render();
case 'resume':v.localStatus='Retomado · simulação';save();return render();
case 'cancel':return modal('Cancelar produção · simulação',`<p>O rascunho será preservado. No produto, custos já incorridos não são desfeitos.</p>`,()=>{v.localStatus='Cancelado · simulação';save();render()},'Cancelar produção');
case 'videoAdvanced':return modal('Opções avançadas deste vídeo',`<p class="sample">Overrides locais; não alteram o canal. Salvos ao mudar cada campo.</p><div class="formgrid">${formField('Roteiro','textProvider','video',providersFor('Roteiro'))}${formField('Imagem','imageProvider','video',providersFor('Imagem'))}${formField('Limite por vídeo (US$)','videoHard','video',null,'number')}${formField('Fallback','fallback','video',['Pedir confirmação','Usar alternativa dentro dos limites'])}${formField('Resolução','resolution','video',['720p','1080p'])}${formField('Revisar roteiro','reviewScript','video',null,'checkbox')}</div>`,()=>{render()},'Concluir');
case 'effective':return modal('Configuração efetiva · demonstração',`<pre style="white-space:pre-wrap;word-break:break-word;font-size:12px">${esc(JSON.stringify({revision:v.revision,identity:v.identity,config:v.config},null,2))}</pre>`,()=>{},'Fechar');
case 'apiInfo':return modal('Fronteiras de operação',`<p>UI → API autenticada → casos de uso → domínio/portas → adapters.</p><p class="sample">Operações: editar cena com revisão, planejar/confirmar geração, aprovar render e confirmar publicação. Reusar endpoints reais após inventário; não criar segunda fonte de verdade.</p>`,()=>{},'Fechar');
case 'savePublication':v.publicMeta={...v.publicMeta,title:$('pubTitle').value,description:$('description').value,privacy:$('privacy').value};save();return toast('Metadados salvos localmente. Nenhum envio agendado.');
case 'useIdea':S.idea=el.dataset.title;return navigate('new');
case 'ideaFilter':S.ideaFilter=el.dataset.filter;save();return render();
case 'period':S.analyticsPeriod=el.dataset.period;save();return render();
case 'libraryTab':S.libraryTab=el.dataset.tab;save();return render();
case 'applyStyle':channel().style=el.dataset.style;save();return toast('Estilo aplicado ao canal. Vídeos existentes preservados.');
case 'applyVoice':channel().voice=el.dataset.voice;save();return toast('Voz aplicada ao canal. Vídeos existentes preservados.');
case 'libraryScene':S.videoTab='edit';openVideo(el.dataset.video);S.sceneId=el.dataset.scene;return render();
case 'reset':return modal('Reiniciar protótipo?',`<p>Somente dados locais de demonstração serão apagados.</p>`,()=>{localStorage.removeItem(KEY);location.reload()},'Reiniciar');
default:return baseHandle(a,el);
}};
// Form controls keep their scope. Input updates become visible without triggering paid effects.
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.dataset.bind){const key=el.dataset.bind,scope=el.dataset.scope;let value=el.type==='checkbox'?el.checked:el.type==='number'?Number(el.value):el.value;if(el.type==='number'&&(!Number.isFinite(value)||value<0)){toast('Informe um valor válido maior ou igual a zero.');return}if(['musicVolume'].includes(key)&&value>100){toast('Use um volume entre 0 e 100.');el.value=setting(scope,key);return}
  if(scope==='video'){const v=video();edit(v,()=>{v.config[key]=value;v.scenes.forEach(s=>s.stale=true)},'Configuração do vídeo');v.qaVersion=null;if(key==='reviewScript')v.reviewScript=value;}else if(scope==='channel')channel().settings[key]=value;else S.account[key]=value;save();if($('settingsSaved'))$('settingsSaved').textContent='Salvo localmente · '+new Date().toLocaleTimeString('pt-BR');if(key==='theme')render();toast('Configuração salva. Nenhuma geração iniciada.');
 }
 if(el.dataset.channelProp){channel()[el.dataset.channelProp]=el.value;save();render();toast('Canal atualizado; vídeos existentes preservados.');}
 if(el.hasAttribute('data-voice')){edit(video(),()=>{video().identity.voice=el.value;video().scenes.forEach(s=>s.stale=true)},'Trocar voz');save();render();}
 if(el.dataset.meta){video().publicMeta[el.dataset.meta]=el.value;save();}
 if(el.dataset.member){S.account.members[Number(el.dataset.member)].role=el.value;save();toast('Papel alterado apenas na demo.');}
});
// New videos inherit full configuration after the original creation handler.
document.addEventListener('submit',e=>{if(e.target.id==='newForm'){const v=video();v.config={...channel().settings};v.sources=[];enrich(v);S.videoTab='content';save();render()}});
const v3Render=render;
render=function(){S.channels.forEach(c=>c.settings??={...DEFAULTS});v3Render();if(S.route==='video'&&S.videoTab==='publish'&&video()){
 const m=video().publicMeta;if($('pubTitle'))$('pubTitle').value=m.title;if($('description'))$('description').value=m.description;if($('privacy'))$('privacy').value=m.privacy;
}};
save();render();

</script>
</body></html>
