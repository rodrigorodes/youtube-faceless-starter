<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faceless Studio — Production Workspace · Protótipo VE-07</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#e9e9f5;background:#0b0c15;--panel:#151625;--muted:#999bb4;--line:#2a2c42;--accent:#a78bfa;--ok:#4adea0;--warn:#fbbf77}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}.side{background:#10111e;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:18px;font-weight:800;padding:8px 12px 20px}.brand span{color:var(--accent)}.nav{display:grid;gap:5px}.nav button{text-align:left;border:0;background:transparent;color:#aeb0c6;border-radius:10px;padding:12px;font-size:13px}.nav button.active{background:#2a2247;color:#e9dcff;font-weight:700}.small{font-size:12px;color:var(--muted)}.sidefoot{margin-top:30px;padding:12px;border:1px solid var(--line);border-radius:10px}.main{padding:25px clamp(16px,3vw,44px);max-width:1600px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:700;text-transform:uppercase}.top h1{font-size:clamp(23px,3vw,34px);margin:5px 0}.pill{font-size:11px;border:1px solid #4b426d;color:#c9b7ff;padding:6px 10px;border-radius:99px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.two{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr);gap:16px}.stack{display:grid;gap:14px}.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}h2{font-size:19px;margin:0 0 12px}h3{font-size:15px;margin:0 0 10px}p{color:#b9bbcd;line-height:1.6;font-size:13px}.btn{border:1px solid #51486d;background:#29223e;color:#e9ddff;padding:10px 14px;border-radius:9px;font-size:13px;font-weight:650}.btn.primary{background:#805be4;border-color:#805be4;color:white}.btn.ghost{background:transparent;color:#c4c5d7;border-color:var(--line)}.btn.danger{background:#40222c;border-color:#653440;color:#ffb9c2}label{font-size:12px;color:#c6c7d7;display:block;margin:0 0 7px}input[type=text],input[type=number],select,textarea{width:100%;border:1px solid #41435b;background:#0f101d;color:#f0edff;border-radius:9px;padding:11px;outline-color:#9b83eb}textarea{resize:vertical;min-height:95px}.field{margin-bottom:13px}.tag{font-size:11px;border:1px solid #45465f;border-radius:99px;padding:5px 8px;color:#c5c7dd}.tag.ok{color:#91efc4;border-color:#275b47}.tag.warn{color:#f7d3a4;border-color:#705331}.steps{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}.steps button{background:#191a2c;border:1px solid var(--line);color:#b9bad0;border-radius:8px;padding:9px 10px;font-size:12px}.steps button.active{background:#382b5c;color:#e5d6ff;border-color:#7d62be}.thumb{height:115px;border-radius:9px;position:relative;overflow:hidden;background:linear-gradient(135deg,#372a40,#795447 55%,#28253d);display:flex;align-items:center;justify-content:center;text-align:center;font-size:39px}.thumb.map{background:linear-gradient(135deg,#5b4b2e,#a18650,#283b3d)}.thumb.battle{background:linear-gradient(135deg,#2e3546,#8b5949,#252f39)}.thumb.ruins{background:linear-gradient(135deg,#242f43,#976a4d,#2d2539)}.thumb span{filter:drop-shadow(0 3px 10px #0008)}.scene{border:1px solid var(--line);border-radius:12px;padding:10px;background:#191a2a;cursor:pointer;text-align:left;color:inherit}.scene.selected{outline:2px solid var(--accent)}.scene .thumb{margin-bottom:10px}.scene strong{font-size:13px}.scene small{display:block;color:var(--muted);margin-top:4px}.scenes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.video{aspect-ratio:16/9;position:relative;display:grid;place-items:center;overflow:hidden;border-radius:13px;background:radial-gradient(circle at 55% 35%,#ba8863,#433447 52%,#121a29);border:1px solid #595063}.video .monument{font-size:clamp(65px,12vw,165px);opacity:.9;filter:drop-shadow(0 20px 20px #0006)}.video .vtitle{position:absolute;top:12%;font-weight:900;font-size:clamp(15px,2.6vw,36px);text-shadow:0 3px 10px #000;letter-spacing:1px}.video .caption{position:absolute;bottom:12%;left:5%;right:5%;font-size:clamp(12px,1.8vw,23px);font-weight:800;text-align:center;text-shadow:0 3px 10px #000;background:#10101c9c;padding:8px;border-radius:6px}.track{display:grid;grid-template-columns:95px 1fr;gap:10px;align-items:center;margin:9px 0;font-size:12px;color:#b8b9d0}.track .rail{background:#292a3e;height:21px;border-radius:5px;overflow:hidden;position:relative}.track .bar{position:absolute;top:2px;bottom:2px;border-radius:4px;background:#8065cb}.track:nth-child(2) .bar{background:#3d9eaa}.track:nth-child(3) .bar{background:#ce9b57}.track:nth-child(4) .bar{background:#7b95d9}.track:nth-child(5) .bar{background:#4b9c77}.callout{background:#201d32;border-left:3px solid #a78bfa;padding:13px;border-radius:5px;font-size:12px;line-height:1.6;color:#cfc7e5}.notice{background:#2a241d;border-left:3px solid #fbbf77;padding:12px;border-radius:5px;color:#f2d5aa;font-size:12px}.progress{height:8px;background:#292a3e;border-radius:10px;overflow:hidden}.progress div{height:100%;background:#9b83eb}.status{font-size:12px;color:var(--muted)}.splitlist{display:grid;gap:8px}.listrow{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:10px 0;font-size:13px}.hide{display:none!important}.check{display:flex;align-items:center;gap:8px;font-size:13px;color:#d0d1e1;margin:10px 0}.check input{accent-color:#a78bfa}.footer{margin-top:20px;display:flex;justify-content:space-between;gap:10px}.modalwrap{position:fixed;inset:0;background:#080911bd;display:grid;place-items:center;padding:20px;z-index:5}.modal{background:#1b1c2d;border:1px solid #59516c;border-radius:15px;max-width:520px;width:100%;padding:24px}.toast{position:fixed;right:20px;bottom:20px;background:#28233c;border:1px solid #8b74c8;padding:14px;border-radius:10px;z-index:10;font-size:13px;max-width:380px}.micro{font-size:11px;color:#999bb4}.metric{font-size:26px;font-weight:800;margin:8px 0}.separator{height:1px;background:var(--line);margin:16px 0}.kicker{color:#d0bfff;font-size:12px}.togglebar{display:flex;gap:8px}.togglebar button{flex:1}.togglebar button.chosen{background:#5e4599;color:white}.selectable{cursor:pointer}button:focus-visible,.scene:focus-visible{outline:2px solid #d4c1ff;outline-offset:2px}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.scenes{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}@media(max-width:720px){.app{grid-template-columns:1fr}.side{height:auto;position:static;padding:12px}.brand{padding:4px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.sidefoot{display:none}.main{padding:15px}.grid{grid-template-columns:1fr}.scenes{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><div class="app"><aside class="side"><div class="brand">◈ Faceless <span>Studio</span></div><div class="eyebrow" style="padding:8px 12px">Workspace · VE-07</div><nav class="nav" id="nav"></nav><div class="sidefoot"><strong style="font-size:13px">Protótipo navegável</strong><p>Dados fictícios e ações simuladas. Nenhum vídeo, API, cobrança ou publicação real.</p><span class="pill">HTML offline</span></div></aside><main class="main"><div class="top"><div><div class="eyebrow" id="eyebrow">Visão geral</div><h1 id="title">Estúdio de produção</h1></div><div class="flex"><span class="pill" id="modeLabel">Modo assistido</span><span class="pill">Demo · sem backend</span></div></div><div id="content"></div></main></div><div id="overlay"></div><div id="toast"></div><script>
const stages=['Dashboard','Criar vídeo','Roteiro','Narração','Storyboard','Mídias e cenas','Composição','Qualidade','Aprovação','Publicação'];
const S={screen:0,mode:'assistido',topic:'Por que o Império Romano caiu?',channel:'História em Minutos',format:'9:16',style:'Documentário',duration:60,voice:'Piper local',speed:1,script:[{name:'O poder de Roma',text:'Roma dominou territórios imensos durante séculos. Mas como um império tão poderoso começou a ruir?',duration:12,media:'Banco de mídia',icon:'🏛️',theme:'rome'},{name:'A expansão',text:'Manter territórios tão grandes exigia recursos, soldados e administração constante.',duration:13,media:'Banco de mídia',icon:'🗺️',theme:'map'},{name:'As pressões',text:'Conflitos internos e pressões externas enfraqueceram as fronteiras do Império Romano do Ocidente.',duration:18,media:'IA',icon:'⚔️',theme:'battle'},{name:'O fim de uma era',text:'Em 476, a deposição de Rômulo Augústulo tornou-se um marco simbólico do fim do império no Ocidente.',duration:17,media:'Banco de mídia',icon:'🏺',theme:'ruins'}],selected:0,captions:true,music:true,motion:true,broll:true,sec:2,quality:'1080p',renderState:'não iniciado',qa:'não executado',approved:false,published:false,revision:1,dirty:false,voiceReady:false,mediaReady:false,estimatedCost:'Não calculado'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const el=id=>document.getElementById(id);function toast(s){el('toast').innerHTML=`<div class="toast" role="status">${esc(s)}</div>`;setTimeout(()=>{el('toast').innerHTML=''},3200)}function invalidate(reason){S.dirty=true;S.approved=false;S.published=false;S.qa='não executado';S.renderState='desatualizado';toast(reason+' · aprovação anterior invalidada')};function nav(n){S.screen=n;render();window.scrollTo({top:0,behavior:'smooth'})};function btn(label,action,cls=''){return `<button class="btn ${cls}" onclick="${action}">${label}</button>`};function header(t,sub){return `<div class="between" style="margin-bottom:16px"><div><h2>${t}</h2><p>${sub}</p></div></div>`};function field(label,html){return `<div class="field"><label>${label}</label>${html}</div>`};function sceneCards(){return `<div class="scenes">${S.script.map((s,i)=>`<button class="scene ${S.selected===i?'selected':''}" onclick="S.selected=${i};render()" aria-pressed="${S.selected===i}"><div class="thumb ${s.theme}"><span>${s.icon}</span></div><strong>${String(i+1).padStart(2,'0')} · ${esc(s.name)}</strong><small>${s.duration}s · ${esc(s.media)}</small></button>`).join('')}</div>`};function summary(){return `<div class="card"><h3>Resumo da produção</h3><div class="listrow"><span>Tema</span><strong>${esc(S.topic)}</strong></div><div class="listrow"><span>Canal</span><strong>${esc(S.channel)}</strong></div><div class="listrow"><span>Formato</span><strong>${S.format}</strong></div><div class="listrow"><span>Estilo</span><strong>${esc(S.style)}</strong></div><div class="listrow"><span>Cenas</span><strong>${S.script.length}</strong></div><div class="listrow"><span>Duração estimada</span><strong>${S.script.reduce((n,s)=>n+s.duration,0)}s</strong></div><div class="listrow"><span>Versão</span><strong>v${S.revision}</strong></div></div>`};function stageButtons(){return `<div class="steps">${stages.slice(1).map((s,i)=>`<button class="${S.screen===i+1?'active':''}" onclick="nav(${i+1})">${i+1}. ${s}</button>`).join('')}</div>`};function video(){let s=S.script[S.selected];return `<div class="video"><div class="monument">${s.icon}</div>${S.sec<4?`<div class="vtitle">${esc(s.name.toUpperCase())}</div>`:''}${S.captions?`<div class="caption">${esc(s.text.slice(0,90))}</div>`:''}</div>`};function dashboard(){return `${header('Produções em andamento','Continue de onde parou ou inicie um novo vídeo.') }<div class="grid"><div class="card"><div class="small">Produções</div><div class="metric">01</div><span class="tag">Demonstração</span></div><div class="card"><div class="small">Cenas no projeto</div><div class="metric">${S.script.length}</div><span class="tag">Editáveis</span></div><div class="card"><div class="small">Publicações reais</div><div class="metric">0</div><span class="tag">Nenhuma API conectada</span></div></div><div class="separator"></div><div class="two"><div class="card"><div class="between"><h2>Seu vídeo</h2><span class="tag warn">${esc(S.renderState)}</span></div><div class="thumb" style="height:220px"><span>🏛️</span></div><h3 style="margin-top:14px">${esc(S.topic)}</h3><p>${S.script.length} cenas · ${esc(S.style)} · versão ${S.revision}</p>${btn('Continuar produção','nav(1)','primary')}</div>${summary()}</div>`};function create(){return `${header('Criar novo vídeo','Configure o objetivo e escolha quanto controle deseja ter sobre o processo.') }<div class="two"><div class="card">${field('Assunto do vídeo',`<textarea id="topic">${esc(S.topic)}</textarea>`)}${field('Canal',`<input id="channel" type="text" value="${esc(S.channel)}">`)}<div class="grid" style="grid-template-columns:1fr 1fr">${field('Formato',`<select id="format"><option ${S.format==='9:16'?'selected':''}>9:16</option><option ${S.format==='16:9'?'selected':''}>16:9</option></select>`)}${field('Estilo',`<select id="style">${['Documentário','Notícias','Curiosidades'].map(x=>`<option ${S.style===x?'selected':''}>${x}</option>`).join('')}</select>`)}</div>${field('Modo de produção',`<div class="togglebar">${btn('⚡ Automático',"setMode('automatico')",S.mode==='automatico'?'chosen':'ghost')}${btn('✎ Assistido',"setMode('assistido')",S.mode==='assistido'?'chosen':'ghost')}</div>`)}<p>${S.mode==='automatico'?'O sistema prepara o conteúdo e apresenta o resultado para revisão; nenhuma publicação é automática.':'Você poderá revisar texto, voz, cenas e mídia antes de aprovar o render.'}</p>${btn('Salvar configurações e avançar',"saveCreate()",'primary')}</div><div class="stack">${summary()}<div class="callout">As escolhas aqui alimentam o pipeline existente. VE-07 deve orquestrar as edições por contratos, sem criar outro motor de render ou duplicar o coordenador.</div></div></div>`};function saveCreate(){const t=el('topic').value.trim();if(!t){toast('Informe um tema');return}S.topic=t;S.channel=el('channel').value.trim()||'Canal sem nome';S.format=el('format').value;S.style=el('style').value;invalidate('Configurações alteradas');nav(2)}function setMode(m){S.mode=m;render()};function script(){return `${header('Roteiro por cena','Edite o texto e a ordem das cenas; alterações de narração exigem novo áudio.') }<div class="two"><div class="stack"><div class="card">${sceneCards()}</div><div class="card"><div class="between"><h3>Cena ${S.selected+1} · ${esc(S.script[S.selected].name)}</h3><span class="tag">${S.script[S.selected].duration}s estimados</span></div>${field('Título interno da cena',`<input id="sceneName" type="text" value="${esc(S.script[S.selected].name)}">`)}${field('Texto narrado',`<textarea id="sceneText" rows="6">${esc(S.script[S.selected].text)}</textarea>`)}<div class="flex">${btn('Salvar cena','saveScript()','primary')}${btn('↑ Mover','moveScene(-1)','ghost')}${btn('↓ Mover','moveScene(1)','ghost')}${btn('Excluir cena','removeScene()','danger')}</div></div></div><div class="stack"><div class="card"><h3>Estrutura do roteiro</h3><div class="splitlist">${S.script.map((s,i)=>`<div class="listrow"><span>${i+1}. ${esc(s.name)}</span><span>${s.duration}s</span></div>`).join('')}</div><div class="separator"></div>${btn('+ Adicionar cena','addScene()','ghost')}</div><div class="notice">VE-07: adicionar, excluir, reordenar e editar roteiro são propostas novas. Precisam de contratos e integração reais; não estão implementadas no motor VE-01–06.</div></div></div>`};function saveScript(){let s=S.script[S.selected],t=el('sceneText').value.trim();if(!t){toast('A cena não pode ter texto vazio');return}s.text=t;s.name=el('sceneName').value.trim()||'Cena sem título';S.voiceReady=false;invalidate('Roteiro salvo');render()};function addScene(){S.script.push({name:'Nova cena',text:'Escreva aqui a narração desta cena.',duration:10,media:'Pendente',icon:'🎬',theme:'rome'});S.selected=S.script.length-1;S.voiceReady=false;invalidate('Cena adicionada');render()};function removeScene(){if(S.script.length===1){toast('Mantenha pelo menos uma cena');return}confirmAction('Excluir cena?','A cena será removida do roteiro. Esta ação é apenas local no protótipo.',()=>{S.script.splice(S.selected,1);S.selected=Math.min(S.selected,S.script.length-1);invalidate('Cena excluída');render()})};function moveScene(d){let i=S.selected,j=i+d;if(j<0||j>=S.script.length)return;[S.script[i],S.script[j]]=[S.script[j],S.script[i]];S.selected=j;invalidate('Ordem das cenas alterada');render()};function audio(){return `${header('Narração e sincronização','O áudio define o ritmo. Após gerar a voz, ajuste o texto ou a cena quando necessário.') }<div class="two"><div class="stack"><div class="card">${field('Provider de voz',`<select id="voice" onchange="S.voice=this.value;S.voiceReady=false;invalidate('Voz alterada')"><option ${S.voice==='Piper local'?'selected':''}>Piper local</option><option ${S.voice!=='Piper local'?'selected':''}>Provider externo configurado</option></select>`)}${field('Velocidade de narração (simulação)',`<input type="range" min="0.8" max="1.2" step="0.05" value="${S.speed}" oninput="S.speed=Number(this.value);el('speedValue').textContent=this.value+'×'"> <span id="speedValue" class="small">${S.speed}×</span>`)}<div class="callout">O Piper fornece duração por cena; sincronização exata por palavra exige alinhamento adicional. Nenhuma voz é sintetizada neste HTML.</div><div class="separator"></div>${btn('Simular geração de narração','generateVoice()','primary')}</div><div class="card"><h3>Faixas de narração</h3>${S.script.map((s,i)=>`<div class="track"><span>Cena ${i+1}</span><div class="rail"><div class="bar" style="width:${Math.min(100,s.duration/20*100)}%"></div></div></div>`).join('')}<p>${S.voiceReady?'Narração simulada pronta; duração estimada por cena.':'Áudio pendente de geração.'}</p></div></div><div class="stack">${summary()}<div class="notice">Pré-escuta real, waveform e escolha de voz precisam de endpoints e arquivos de áudio. O protótipo mostra estados, não toca áudio.</div></div></div>`};function generateVoice(){S.voiceReady=true;invalidate('Nova narração solicitada');toast('Áudio marcado como gerado apenas na demonstração');render()};function storyboard(){return `${header('Storyboard','Revise a intenção visual, o texto e a duração de cada cena.') }<div class="card">${sceneCards()}</div><div class="separator"></div><div class="two"><div class="card">${video()}<div class="separator"></div><h3>${esc(S.script[S.selected].name)}</h3><p>${esc(S.script[S.selected].text)}</p></div><div class="card">${field('Duração estimada (segundos)',`<input type="number" min="2" max="180" id="dur" value="${S.script[S.selected].duration}">`)}<p>Alterar a duração poderá exigir nova narração e recompilação da timeline.</p>${btn('Atualizar duração','saveDuration()','primary')}<div class="separator"></div><div class="callout">O storyboard conecta narração, cenas e assets. VE-07 deverá editar a intenção narrativa, sem duplicar os contratos Shot/Scene/Timeline.</div></div></div>`};function saveDuration(){let v=Number(el('dur').value);if(!Number.isFinite(v)||v<2||v>180){toast('Use duração entre 2 e 180 segundos');return}S.script[S.selected].duration=v;invalidate('Duração alterada');render()};function media(){return `${header('Mídias e organizador de cenas','Escolha a fonte e substitua apenas o asset da cena que precisa melhorar.') }<div class="card">${sceneCards()}</div><div class="separator"></div><div class="two"><div class="card">${video()}<div class="separator"></div><h3>Cena ${S.selected+1} · ${esc(S.script[S.selected].name)}</h3><p>${esc(S.script[S.selected].text)}</p><span class="tag">Origem: ${esc(S.script[S.selected].media)}</span></div><div class="card"><h3>Escolher mídia</h3>${field('Fonte de mídia',`<select id="mediaSource">${['Banco de mídia','IA','Biblioteca local'].map(v=>`<option ${S.script[S.selected].media===v?'selected':''}>${v}</option>`).join('')}</select>`)}${field('Observação para busca',`<input type="text" placeholder="Ex.: soldados romanos, sem armadura medieval">`)}<div class="notice">Candidatos reais dependem de provider, disponibilidade e licença. O protótipo não consulta Pexels nem gera imagens.</div><div class="separator"></div>${btn('Substituir mídia desta cena','replaceMedia()','primary')}<div class="separator"></div><h3>O que será regenerado?</h3><p>Segmento visual da cena alterada + composição final. Segmentos não afetados poderão ser reutilizados pelo cache.</p></div></div>`};function replaceMedia(){S.script[S.selected].media=el('mediaSource').value;S.script[S.selected].icon=S.script[S.selected].media==='IA'?'✨':S.script[S.selected].media==='Biblioteca local'?'🖼️':'🎞️';invalidate('Mídia da cena substituída');S.revision++;render()};function composition(){return `${header('Composição e renderização','Veja como texto, narração, B-roll, legendas e efeitos se combinam.') }<div class="two"><div class="stack"><div class="card">${video()}<div class="flex" style="margin-top:14px"><span class="small">Tempo da cena</span><input type="range" min="0" max="12" value="${S.sec}" oninput="S.sec=Number(this.value);el('secLabel').textContent=this.value+'s'" style="flex:1"><span id="secLabel" class="small">${S.sec}s</span></div></div><div class="card"><h3>Timeline ilustrativa (não editável por arrastar)</h3>${[['Imagem base','0%','100%'],...(S.broll?[['B-roll','40%','35%']]:[]),['Título','8%','25%'],...(S.captions?[['Legendas','0%','100%']]:[]),...(S.music?[['Música','0%','100%']]:[]),['Narração','0%','100%']].map(([n,l,w])=>`<div class="track"><span>${n}</span><div class="rail"><div class="bar" style="left:${l};width:${w}"></div></div></div>`).join('')}</div></div><div class="card"><h3>Configurações do render</h3><label class="check"><input type="checkbox" ${S.captions?'checked':''} onchange="toggle('captions',this.checked)"> Legendas</label><label class="check"><input type="checkbox" ${S.broll?'checked':''} onchange="toggle('broll',this.checked)"> B-roll</label><label class="check"><input type="checkbox" ${S.motion?'checked':''} onchange="toggle('motion',this.checked)"> Movimento e transições</label><label class="check"><input type="checkbox" ${S.music?'checked':''} onchange="toggle('music',this.checked)"> Música</label>${field('Resolução',`<select onchange="S.quality=this.value;invalidate('Resolução alterada')"><option ${S.quality==='1080p'?'selected':''}>1080p</option><option ${S.quality==='720p'?'selected':''}>720p</option></select>`)}<div class="separator"></div><p>Versão: v${S.revision} · Status: ${esc(S.renderState)}</p>${btn('Simular renderização','simulateRender()','primary')}<div class="separator"></div><div class="callout">O FFmpeg real compõe camadas no segmento base da cena. O preview acima é ilustrativo, não um MP4 gerado.</div></div></div>`};function toggle(k,v){S[k]=v;invalidate('Configuração visual alterada');render()};function simulateRender(){S.renderState='concluído (simulado)';S.dirty=false;S.qa='não executado';S.approved=false;S.revision++;toast('Render simulado: nenhum arquivo MP4 foi gerado');render()};function qa(){return `${header('Qualidade e revisão','Verifique a qualidade técnica e diferencie avaliações comprovadas das não verificadas.') }<div class="two"><div class="card"><h3>Checklist do vídeo</h3>${[['Duração e FPS','Técnico'],['Áudio e presença de narração','Técnico'],['Legendas e disclosure','Técnico'],['Cobertura da base visual','Técnico'],['Correspondência entre roteiro e imagem','Semântico / provider opcional']].map(([n,k])=>`<div class="listrow"><span>${n}</span><span class="tag ${S.qa==='executado (simulado)'&&k==='Técnico'?'ok':'warn'}">${S.qa==='executado (simulado)'&&k==='Técnico'?'Simulado':'Não verificado'}</span></div>`).join('')}<div class="separator"></div>${btn('Simular verificação técnica','simulateQA()','primary')}</div><div class="stack"><div class="notice">Nenhuma verificação real foi executada. Mesmo após simular o QA, não há evidência técnica nem semântica de um vídeo real.</div><div class="card"><h3>Próximas ações</h3><p>Se houver erro, selecione a cena, troque a mídia ou ajuste o roteiro. A nova revisão invalida a aprovação anterior.</p>${btn('Revisar cenas','nav(5)','ghost')}</div></div></div>`};function simulateQA(){S.qa='executado (simulado)';toast('Checklist de demonstração atualizado; sem verificação real');render()};function approval(){return `${header('Aprovação humana','A publicação exige aprovação vinculada à versão e ao checksum reais do render.') }<div class="two"><div class="stack"><div class="card">${video()}<div class="separator"></div><div class="between"><strong>Versão v${S.revision}</strong><span class="tag ${S.approved?'ok':'warn'}">${S.approved?'Aprovação simulada':'Não aprovado'}</span></div><p>Render: ${esc(S.renderState)} · QA: ${esc(S.qa)}</p><div class="notice">Neste protótipo, a aprovação é apenas demonstrativa. No produto real, o servidor deve validar render_id, checksum, QA e permissões.</div><div class="separator"></div>${btn('Simular aprovação','simulateApproval()','primary')}</div></div>${summary()}</div>`};function simulateApproval(){if(!S.renderState.startsWith('concluído')){toast('Faça a simulação de render antes de aprovar');return}if(S.qa!=='executado (simulado)'){toast('Faça a simulação de QA antes de aprovar');return}S.approved=true;toast('Aprovação local simulada; nenhuma autorização real emitida');render()};function publish(){return `${header('Publicação no YouTube','Última etapa: título, descrição, privacidade e autorização de publicação.') }<div class="two"><div class="card">${field('Título público',`<input type="text" id="ytTitle" value="${esc(S.topic)}">`)}${field('Descrição',`<textarea id="ytDescription">Neste vídeo exploramos a história do Império Romano. Conteúdo narrativo ilustrativo.</textarea>`)}${field('Privacidade',`<select id="privacy"><option>Privado</option><option>Não listado</option><option>Público</option></select>`)}<div class="notice">Não existe conexão com o YouTube neste protótipo. O botão abaixo não publica.</div><div class="separator"></div>${btn('Visualizar envio (simulação)','publishPreview()','primary')}</div><div class="stack">${summary()}<div class="card"><h3>Condições para publicar</h3><div class="listrow"><span>Render disponível</span><span>${S.renderState.startsWith('concluído')?'Simulado':'Pendente'}</span></div><div class="listrow"><span>QA técnico</span><span>${S.qa==='executado (simulado)'?'Simulado':'Pendente'}</span></div><div class="listrow"><span>Aprovação humana</span><span>${S.approved?'Simulada':'Pendente'}</span></div></div></div></div>`};function publishPreview(){if(!S.approved){toast('Aprovação simulada obrigatória antes de continuar');return}const title=el('ytTitle').value.trim();if(!title){toast('Informe um título');return}confirmAction('Simulação de publicação',`Título: ${title}. Nenhuma API será chamada e nenhum vídeo será enviado.`,()=>toast('Prévia de envio concluída. Nenhuma publicação ocorreu.'))};function confirmAction(title,body,action){el('overlay').innerHTML=`<div class="modalwrap" role="dialog" aria-modal="true"><div class="modal"><h2>${esc(title)}</h2><p>${esc(body)}</p><div class="flex">${btn('Cancelar','closeModal()','ghost')}<button class="btn primary" id="modalConfirm">Confirmar</button></div></div></div>`;el('modalConfirm').onclick=()=>{closeModal();action()}}function closeModal(){el('overlay').innerHTML=''}function render(){el('nav').innerHTML=stages.map((s,i)=>`<button class="${S.screen===i?'active':''}" onclick="nav(${i})">${['▦','✦','☷','♫','▤','▧','▥','✓','◎','▶'][i]} &nbsp; ${s}</button>`).join('');el('title').textContent=stages[S.screen];el('eyebrow').textContent=S.screen===0?'Painel de produção':`Etapa ${S.screen} de 9 · experiência proposta`;el('modeLabel').textContent=S.mode==='assistido'?'Modo assistido':'Modo automático';const views=[dashboard,create,script,audio,storyboard,media,composition,qa,approval,publish];el('content').innerHTML=(S.screen?stageButtons():'')+views[S.screen]()+ (S.screen>0?`<div class="footer">${btn('← Etapa anterior',`nav(${Math.max(0,S.screen-1)})`,'ghost')}${S.screen<9?btn('Próxima etapa →',`nav(${S.screen+1})`,'primary'):btn('Voltar ao dashboard','nav(0)','ghost')}</div>`:'')}
render();
</script></body></html>
