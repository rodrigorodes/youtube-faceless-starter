<style>

.step{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.step:last-child{border:0}

.ic.fail{background:#6b1d1d;border-color:#6b1d1d;color:#fff}

.vtable{width:100%;border-collapse:collapse}

.tog{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.tog input{position:absolute;opacity:0}

.chart div span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
.guide{position:fixed;left:12px;bottom:112px;width:208px;z-index:50}
.guide .gbtn{width:100%;background:var(--accent);color:#14101f;border:0;border-radius:24px;padding:9px 12px;font-weight:760;cursor:pointer;box-shadow:0 8px 26px rgba(143,110,247,.4)}
.guide .gbox{position:absolute;left:0;bottom:48px;width:330px;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:14px;box-shadow:0 16px 40px rgba(0,0,0,.55)}
.guide ol{margin:6px 0 12px;padding-left:20px;color:var(--muted);font-size:12.5px}
.guide li{margin-bottom:3px}.guide li button{all:unset;cursor:pointer;color:var(--accent2)}.guide li button:hover{text-decoration:underline}
details.diag{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
details.diag summary{cursor:pointer;font-weight:650;color:var(--muted)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted)}
.sample{font-size:11.5px;color:var(--muted)}
.hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.sr{position:absolute;left:-9999px}
@media(max-width:1000px){.top{flex-wrap:wrap}.top .l,.top .r{flex-wrap:wrap}#chstyle{display:none}.guide{left:auto;right:12px;bottom:12px;width:auto}.guide .gbox{left:auto;right:0}.dock{bottom:64px}.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.side nav{flex-direction:row;flex-wrap:wrap}.side .budget,.side .sp{display:none}.scene,.two,.grid2,.grid3,.grid4{grid-template-columns:1fr}.dock{left:12px;right:12px}.content{padding:18px 14px 150px}.top{padding:12px 14px}}
</style>
</head>

const vdur=v=>v.scenes.reduce((a,s)=>a+secs(s.text),0);
const fmtT=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const STATE={draft:['Rascunho (Diretor)','accent'],generating:['Gerando…','accent'],review:['Aguardando aprovação','warn'],approved:['Aprovado','ok'],published:['Publicado','ok'],failed:['Falhou na produção','bad']};

const estCost=v=>{const base=v.scenes.length*0.07+0.05;return Math.round(base*100)/100};
function gates(v){
 const g=[];
 const noMedia=v.scenes.filter(s=>!s.media).map((s,i)=>s.title);
 g.push({n:'Mídia em todas as cenas',st:noMedia.length?'block':'ok',d:noMedia.length?`Faltam imagens/vídeos em: ${noMedia.join(', ')}.`:`${v.scenes.length} de ${v.scenes.length} cenas com mídia.`});
 const bad=v.scenes.filter(s=>s.audio!=='ok').map(s=>s.title);
 g.push({n:'Narração presente e atualizada',st:bad.length?'block':'ok',d:bad.length?`Áudio ausente ou desatualizado em: ${bad.join(', ')}.`:'Todos os trechos têm áudio alinhado ao texto.'});
 const d=vdur(v),lo=v.target*0.7,hi=v.target*1.3;
 g.push({n:'Duração próxima da meta',st:(d<lo||d>hi)?'warn':'ok',d:`Estimada ${fmtT(d)} · meta ${fmtT(v.target)} (estimativa por contagem de palavras; duração real só é medida após renderizar).`});
 g.push({n:'Legendas na área segura',st:(v.format==='short'&&v.comp.subSize>56)?'warn':'ok',d:v.format==='short'&&v.comp.subSize>56?'Legenda grande pode ser coberta pela interface do Shorts.':'Posição e tamanho respeitam a área segura.'});
 g.push({n:'Fontes registradas',st:v.sources.length?'ok':'warn',d:v.sources.length?`${v.sources.length} fonte(s) registrada(s). Registrar não significa verificar.`:'Nenhuma fonte registrada. O vídeo pode ser aprovado, mas sem rastreabilidade.'});
 const e=estCost(v),cap=ch().capVideo;
 g.push({n:'Dentro do orçamento do vídeo',st:e>cap?'warn':'ok',d:`Estimativa ${usd(e)} · teto ${usd(cap)}.`});
 return g;
}
const blockers=v=>gates(v).filter(x=>x.st==='block');

/* ---------- Workspace ---------- */
function pgVideo(){
 const v=vid();if(!v)return pgVideos();
 const gen=v.state==='generating';
 const bl=blockers(v).length;
 const tabs=TABS.map(([id,t])=>`<button class="tab" data-a="tab" data-v="${id}" ${S.tab===id?'aria-current="page"':''}>${t}${id==='qualidade'&&v.state==='review'&&!v.dirty?'<span class="dot" title="Aguardando você"></span>':''}${id==='producao'&&v.state==='failed'?'<span class="dot" style="background:var(--bad)"></span>':''}</button>`).join('');
 const panels={cenas:tabScenes,composicao:tabComp,qualidade:tabQA,publicacao:tabPub,fontes:tabSources,producao:tabProd};
 return `<p class="sub" style="margin-bottom:8px">${b('← Vídeos','go','ghost small','data-to="#/videos"')} &nbsp; ${esc(ch().name)} / ${esc(v.title)}</p>
 <div class="head"><div><p class="eyebrow">${v.mode==='piloto'?'⚡ Criado no piloto automático':'🎬 Modo Diretor'} · v${v.rev}</p><h1>${esc(v.title)}</h1><div class="row" style="margin-top:6px">${statePill(v)}<span class="pill">${v.format==='short'?'Short 9:16':'Vídeo 16:9'}</span><span class="pill">🎙 ${esc(voice(v.voice).name)}</span><span class="pill">🎨 ${esc(sty(v.style).name)}</span></div></div>
  <div class="row">${v.mode==='piloto'&&v.state!=='draft'?b('Editar no Modo Diretor','tab','small','data-v="cenas"'):''}${b('Histórico de versões','history','small')}</div></div>
 <nav class="tabs" aria-label="Áreas do vídeo">${tabs}</nav>
 ${gen?progressCard(v):''}
 ${(panels[S.tab]||tabScenes)(v)}${gen?'':dock(v,bl)}`;
}
function progressCard(v){
 const done=v.steps.filter(s=>s.s==='ok').length;
 return `<div class="card" style="border-color:var(--accent);margin-bottom:18px"><div class="between"><div><h3>⚡ Piloto automático trabalhando</h3><p class="sub">Roteiro → voz → mídia → composição → qualidade. Ao terminar, abre na aprovação.</p></div><span class="pill accent">${done}/${v.steps.length} etapas</span></div><div class="prog" style="height:8px;margin-top:12px"><b style="width:${Math.round(done/v.steps.length*100)}%;transition:width .5s"></b></div>
 <div class="row" style="margin-top:8px">${v.steps.map(s=>`<span class="pill ${s.s==='ok'?'ok':s.s==='run'?'accent':s.s==='fail'?'bad':''}">${s.s==='ok'?'✓':s.s==='run'?'…':s.s==='fail'?'✕':'○'} ${esc(s.n)}</span>`).join('')}</div></div>`;
}
function dock(v,bl){
 if(S.tab==='publicacao'||S.tab==='fontes'||S.tab==='producao'||S.tab==='qualidade')return '';
 if(v.state==='published')return `<div class="dock"><span class="sub">Publicado ${esc(v.pub.at)} · <a href="#" data-a="noop">${esc(v.pub.url)}</a></span>${b('Editar e gerar nova versão','tab','small','data-v="cenas"')}</div>`;
 const missing=v.scenes.filter(s=>!s.media||s.audio!=='ok').length;
 const needs=v.dirty||v.state==='draft';
 return `<div class="dock"><div class="row"><b>${v.scenes.length} cenas</b><span class="sub">~${fmtT(vdur(v))} · estimativa ${usd(estCost(v))}</span>${needs&&missing?`<span class="pill warn">${missing} cena(s) sem mídia ou áudio atual</span>`:''}${v.dirty&&v.state!=='draft'?'<span class="pill warn">Edições ainda não renderizadas</span>':''}</div>
 <div class="row">${needs?b(v.state==='draft'?'🎬 Gerar o que falta e renderizar':`Renderizar v${v.rev+1}`,'render','primary'):b('Ir para aprovação →','tab','ok','data-v="qualidade"')}</div></div>`;
}

/* --- Cenas & Storyboard --- */
function tabScenes(v){
 return `<div class="between" style="margin-bottom:16px"><div><h2>Storyboard integrado</h2><p class="sub">Texto, mídia, B-roll e narração de cada cena na mesma bancada. Edite sem trocar de tela.</p></div>

 <div class="stack">${v.scenes.map((s,i)=>sceneCard(v,s,i)).join('')}</div>
 ${v.scenes.length===0?'<div class="card"><p class="sub">Sem cenas. Adicione a primeira cena.</p></div>':''}`;
}
function sceneCard(v,s,i){
 const play=S.playing===s.id;
 const aud={ok:['ok','✓ Áudio atual'],stale:['warn','Áudio desatualizado'],none:['bad','Sem áudio ainda']}[s.audio];
 return `<div class="scene" data-sid="${s.id}">
 <div>${thumb(s,v,230,132)}
  <div class="row" style="margin-top:8px"><button class="btn small" style="flex:1" data-a="media" data-sid="${s.id}">${s.media?'Trocar mídia':'Escolher mídia'}</button><button class="btn small ${s.broll?'':'ghost'}" style="${s.broll?'border-color:var(--accent);color:var(--accent2)':''}" aria-pressed="${s.broll}" data-a="broll" data-sid="${s.id}">${s.broll?'B-roll ativo':'+ B-roll'}</button></div>
  ${s.broll?`<input type="text" class="sample" style="margin-top:6px;font-size:12px" aria-label="Descrição do B-roll" data-a="brollnote" data-sid="${s.id}" value="${esc(s.brollNote)}" placeholder="O que mostrar no B-roll?">`:''}</div>
 <div><div class="between" style="margin-bottom:6px"><span class="num">CENA ${i+1} · ${esc(s.title.toUpperCase())}</span><span class="sample" data-count="${s.id}">${words(s.text)} palavras · ~${secs(s.text)}s</span></div>
  <label class="sr" for="tx-${s.id}">Texto da cena ${i+1}</label><textarea id="tx-${s.id}" rows="4" data-a="text" data-sid="${s.id}">${esc(s.text)}</textarea>
  <div class="field" style="margin:8px 0 0"><label for="pr-${s.id}">Prompt da imagem</label><input type="text" id="pr-${s.id}" data-a="prompt" data-sid="${s.id}" value="${esc(s.prompt)}"></div></div>
 <div class="player"><div class="between"><span class="lbl">NARRAÇÃO</span><span class="pill ${aud[0]}" data-audpill="${s.id}">${aud[1]}</span></div>
  <p class="sample">${esc(voice(v.voice).name)}</p>
  <div class="prog ${play?'run':''}" style="--d:${secs(s.text)}s"><b></b></div>
  <div class="row"><button class="btn small primary" style="flex:1" data-a="play" data-sid="${s.id}" ${s.audio==='none'?'disabled':''}>${play?'■ Parar':'▶ Ouvir trecho'}</button></div>
  <button class="btn small ghost long" style="margin-top:6px" data-a="regen" data-sid="${s.id}">${s.audio==='none'?'Gerar áudio da cena':'Regenerar áudio da cena'}</button>
  <p class="sample" style="margin-top:6px">Simulação visual, sem áudio real.</p>
  <div class="row" style="margin-top:8px;justify-content:space-between"><span><button class="btn ghost small" aria-label="Mover cena para cima" data-a="mv" data-d="-1" data-sid="${s.id}" ${i===0?'disabled':''}>↑</button><button class="btn ghost small" aria-label="Mover cena para baixo" data-a="mv" data-d="1" data-sid="${s.id}" ${i===v.scenes.length-1?'disabled':''}>↓</button></span><button class="btn ghost small" style="color:var(--bad)" data-a="delscene" data-sid="${s.id}">Excluir</button></div>
 </div></div>`;
}

  <div class="track"><span>Narração</span><div style="color:var(--ok)">Narração contínua · ${esc(voice(v.voice).name)} · ~${fmtT(vdur(v))}</div></div>
  <div class="track"><span>Música</span><div>${esc(mu.name)} · ${c.musicVol}%${c.ducking?' · reduz sob a voz':''}</div></div>

 <aside class="card" style="position:sticky;top:80px"><h3 style="margin-bottom:6px">Parâmetros</h3><p class="sample" style="margin-bottom:14px">Herdados do estilo e do canal. Mudar aqui vale só para este vídeo.</p>
  <div class="field"><label for="cf1">Fonte da legenda</label><select id="cf1" data-a="comp" data-k="subFont">${['Inter','Roboto','Georgia'].map(o=>`<option ${c.subFont===o?'selected':''}>${o}</option>`).join('')}</select></div>

  <div class="field"><label for="cf3">Tamanho da legenda: <b id="cf3v">${c.subSize}</b></label><input type="range" id="cf3" min="24" max="72" value="${c.subSize}" data-a="comp" data-k="subSize" data-num="1"></div>
  <div class="field"><label for="cf4">Música de fundo</label><select id="cf4" data-a="comp" data-k="musicId">${MUSIC.map(m=>`<option value="${m.id}" ${c.musicId===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div>

  <div class="grid2"><div class="field"><label for="cf7">Resolução</label><select id="cf7" data-a="comp" data-k="res">${['1080p','720p'].map(o=>`<option ${c.res===o?'selected':''}>${o}</option>`).join('')}</select></div><div class="field"><label for="cf8">Quadros/s</label><select id="cf8" data-a="comp" data-k="fps" data-num="1">${[24,30,60].map(o=>`<option ${c.fps===o?'selected':''}>${o}</option>`).join('')}</select></div></div>

  <div class="field"><label for="cf11">Estilo visual do vídeo</label><select id="cf11" data-a="vstyle">${STYLES.map(s=>`<option value="${s.id}" ${v.style===s.id?'selected':''}>${esc(s.name)}${s.id===ch().style?' (canal)':''}</option>`).join('')}</select></div>

}

 const dirty=v.dirty;
 const canApprove=!bl&&!dirty&&v.state==='review';

 return `<div class="two"><div class="stack"><div class="card"><h3>Verificações de qualidade</h3><p class="sub" style="margin:2px 0 14px">Checagens determinísticas sobre o que está nas cenas e na composição.</p><div class="stack" style="gap:8px">${g.map(x=>`<div class="gate"><div><b style="font-size:13px">${esc(x.n)}</b><small>${esc(x.d)}</small></div><span class="pill ${icon[x.st][0]}">${icon[x.st][1]}</span></div>`).join('')}</div></div>
 <div class="card"><h3 style="margin-bottom:10px">Prévia da versão v${v.rev||'—'}</h3>${v.rev===0?'<p class="sub">Ainda não há versão renderizada. Renderize no storyboard.</p>':`<div class="frame ${v.format==='short'?'r916':'r169'}" style="max-width:${v.format==='short'?'230px':'560px'}"><div class="bg" style="background:${sty(v.style).grad}"></div><span style="font-size:60px;position:relative">${v.scenes[0]&&v.scenes[0].media?v.scenes[0].media.emoji:'🎞️'}</span><div class="cap" style="bottom:12%;font-size:14px">${esc(v.scenes[0]?v.scenes[0].text.split(' ').slice(0,6).join(' '):'')}</div></div><p class="sample" style="text-align:center;margin-top:8px">Prévia ilustrativa · duração real não medida neste mockup</p>`}</div></div>
 <aside class="card" style="position:sticky;top:80px"><h3>Aprovação da v${v.rev}</h3>
  <p class="sub" style="margin:4px 0 12px">Aprovar marca esta versão como a oficial. Publicar é um passo separado.</p>
  <div class="note ${bl?'':'okn'}" style="margin-bottom:14px"><b>${bl} bloqueio(s) · ${wr} aviso(s)</b><br>${bl?'Resolva os bloqueios no storyboard antes de aprovar.':dirty?'Há edições não renderizadas.':'Elegível para aprovação.'}</div>
  ${v.state==='approved'?'<div class="note okn" style="margin-bottom:12px">✓ Versão aprovada.</div>':''}
  ${v.state==='published'?'<div class="note okn">✓ Publicado.</div>':`<div class="stack" style="gap:8px">${v.state==='approved'?b('Ir para publicação →','tab','primary long','data-v="publicacao"'):b('✓ Aprovar esta versão','approve','ok long',canApprove?'':'disabled')}${v.state==='approved'?b('Desfazer aprovação','unapprove','ghost long small'):b('Pedir ajustes (volta ao storyboard)','tab','ghost long small','data-v="cenas"')}</div>`}
  ${dirty&&v.state!=='draft'?`<div style="margin-top:10px">${b('Renderizar nova versão','render','long small')}</div>`:''}
 </aside></div>`;
}

/* ---------- Tendências ---------- */

/* ============ ações de domínio ============ */
const dirty=(v)=>{v.dirty=true;if(v.state==='approved'||v.state==='review'||v.state==='published'){if(v.state!=='published')v.state='review'}};
function buildScenes(topic,beats,style){return beats.map((b2,i)=>mkScene(b2,(SCRIPT_PARTS[b2]||'Conteúdo da cena sobre {t}.').replace(/\{t\}/g,topic||'o tema'),`${b2.toLowerCase()} · ${topic||'tema'} · ${sty(style).prompt}`,null,'none'))}
function createVideo(mode,topic,over){
 const d=S.newDraft||newDefaults();const c=ch();
 const t=(topic||d.topic||'').trim()||'Novo vídeo sem título';
 let scenes;
 const tp=TEMPLATES.find(x=>x.id===d.template)||TEMPLATES[0];
 if(d.script&&d.scriptText&&d.scriptText.trim()){scenes=d.scriptText.split(/\n\s*\n|\n/).filter(x=>x.trim()).map((p,i)=>mkScene('Cena '+(i+1),p.trim(),`${t} · ${sty(d.style).prompt}`,null,'none'))}
 else scenes=buildScenes(t,tp.beats,d.style);
 const v={id:uid('v'),ch:c.id,title:t.charAt(0).toUpperCase()+t.slice(1),mode,state:'draft',format:d.format,style:d.style,voice:d.voice,rev:0,dirty:true,target:Number(d.dur)||45,comp:defComp(c),scenes,sources:d.script&&d.scriptText?[{id:uid('f'),kind:'texto',label:'Roteiro colado',url:'',chars:d.scriptText.length,hash:'a1b2…c3'}]:[],meta:{title:'',desc:'',tags:'',vis:'privado',schedule:''},cost:null,pub:null,steps:blankSteps()};
 S.videos.unshift(v);S.newDraft=null;return v;
}
const STEP_MS=900;
function runPipeline(v,from){
 v.state='generating';v.steps.forEach((s,i)=>{if(i>=from)s.s='wait'});
 let i=from;
 const tick=()=>{
  if(v.state!=='generating')return;
  if(i>0&&v.steps[i-1].s==='run')v.steps[i-1].s='ok';
  if(i>=v.steps.length){finishPipeline(v);return}
  const st=v.steps[i];st.s='run';
  if(st.k==='voz')v.scenes.forEach(s=>s.audio='ok');
  if(st.k==='midia')v.scenes.forEach((s,k)=>{if(!s.media)s.media=med(k%3===1?'stock':'ia',EMOJIS[(k*3+v.scenes.length)%EMOJIS.length])});
  st.c=({roteiro:0.02,voz:0.03*v.scenes.length,midia:0.05*v.scenes.length,composicao:0.04,qa:0})[st.k];
  refreshIf(v);i++;setTimeout(()=>{if(v.state==='generating'){st.s='ok';refreshIf(v);tick()}},STEP_MS);
 };
 tick();
}
function finishPipeline(v){
 v.steps.forEach(s=>s.s='ok');v.rev=v.rev+1;v.dirty=false;v.state='review';v.cost=Math.round(v.steps.reduce((a,s)=>a+(s.c||0),0)*100)/100;
 S.spent[v.ch]=Math.round((S.spent[v.ch]+v.cost)*100)/100;
 if(S.route==='video'&&S.vid===v.id){S.tab='qualidade';history.replaceState(null,'','#/video/'+v.id+'/qualidade')}
 toast('Vídeo pronto! Revise e aprove.');refreshIf(v,true);
}
function refreshIf(v){if(S.route==='video'&&S.vid===v.id)render()}

 switch(a){
  case 'noop':e.preventDefault();toast('Link ilustrativo no mockup.');break;
  case 'go':if(el.dataset.set)S.setTab=el.dataset.set;S.guide=false;go(el.dataset.to);break;
  case 'guide':S.guide=!S.guide;renderGuide();break;
  case 'quick':{const t=($('#homeTopic')||{}).value||'';S.newDraft=Object.assign(newDefaults(),{topic:t.length<120?t:'',script:t.length>=120,scriptText:t.length>=120?t:''});go('#/new');break}
  case 'idea':{const t=TRENDS.find(x=>x.id===el.dataset.id);S.newDraft=Object.assign(newDefaults(),{topic:t.title});if(el.dataset.mode)S.newDraft.mode=el.dataset.mode;go('#/new');break}
  case 'nmode':S.newDraft.mode=el.dataset.v;render();break;
  case 'nformat':S.newDraft.format=el.dataset.v;S.newDraft.dur=el.dataset.v==='short'?'45':'180';render();break;
  case 'nvoice':S.newDraft.voice=el.dataset.v;render();break;
  case 'nstyle':S.newDraft.style=el.dataset.v;render();break;
  case 'create':{
   const d=S.newDraft;d.topic=($('#ntopic')||{}).value||d.topic;if(d.script&&$('#nscript'))d.scriptText=$('#nscript').value;
   if(!d.topic.trim()&&!(d.script&&d.scriptText)){toast('Digite um tema ou cole um roteiro.');($('#ntopic')||{focus(){}}).focus();break}
   const mode=d.mode,nv=createVideo(mode,d.topic);S.vid=nv.id;
   if(mode==='piloto'){S.route='video';S.tab='cenas';history.replaceState(null,'','#/video/'+nv.id+'/cenas');runPipeline(nv,1);render()}
   else{go('#/video/'+nv.id+'/cenas');toast('Storyboard criado. Edite as cenas à vontade.')}
   break}
  case 'chmode':c.mode=el.dataset.v;render();toast('Modo padrão do canal salvo.');break;
  case 'chformat':c.format=el.dataset.v;render();toast('Formato padrão do canal salvo.');break;
  case 'vfilter':S.vidFilter=el.dataset.v;render();break;
  case 'open':go('#/video/'+el.dataset.id+'/'+(el.dataset.tab||'cenas'));break;
  case 'tab':S.guide=false;go('#/video/'+S.vid+'/'+el.dataset.v);break;
  case 'history':S.modal={t:'history'};render();break;
  case 'closemodal':S.modal=null;render();break;
  case 'addscene':v.scenes.push(mkScene('Nova cena','Escreva aqui o texto da narração desta cena.','descreva a imagem desejada',null,'none'));dirty(v);render();toast('Cena adicionada.');break;
  case 'delscene':if(v.scenes.length<=1){toast('O vídeo precisa de ao menos uma cena.');break}v.scenes=v.scenes.filter(s=>s!==scene);dirty(v);render();toast('Cena excluída.');break;
  case 'mv':{const i=v.scenes.indexOf(scene),j=i+Number(el.dataset.d);if(j>=0&&j<v.scenes.length){[v.scenes[i],v.scenes[j]]=[v.scenes[j],v.scenes[i]];dirty(v);render()}break}
  case 'broll':scene.broll=!scene.broll;dirty(v);render();break;
  case 'media':S.modal={t:'media',sid:scene.id};render();break;
  case 'pickmedia':{const vv=vid(),s=vv.scenes.find(x=>x.id===S.modal.sid);s.media=med(el.dataset.k,el.dataset.e);S.modal=null;dirty(vv);render();toast('Mídia da cena atualizada.');break}
  case 'regen':scene.audio='ok';S.playing=null;dirty(v);render();toast('Áudio da cena gerado (simulado).');break;
  case 'play':if(S.playing===scene.id){S.playing=null;render()}else{S.playing=scene.id;render();clearTimeout(S._pt);S._pt=setTimeout(()=>{if(S.playing===scene.id){S.playing=null;render()}},secs(scene.text)*1000)}break;
  case 'genmissing':{let n=0;v.scenes.forEach((s,k)=>{if(!s.media){s.media=med(k%2?'stock':'ia',EMOJIS[(k*5+2)%EMOJIS.length]);n++}if(s.audio!=='ok'){s.audio='ok';n++}});dirty(v);render();toast(n?'Itens faltantes gerados (simulado).':'Nada faltando.');break}
  case 'render':{
   if(v.scenes.some(s=>!s.media||s.audio!=='ok')){v.scenes.forEach((s,k)=>{if(!s.media)s.media=med(k%2?'stock':'ia',EMOJIS[(k*7+1)%EMOJIS.length]);s.audio='ok'})}
   v.state='generating';v.steps=blankSteps();v.steps[0].s='ok';S.tab='cenas';runPipeline(v,1);render();break}
  case 'approve':v.state='approved';render();toast('Versão aprovada. Falta publicar.');break;
  case 'unapprove':v.state='review';render();break;
  case 'publish':v.state='published';v.pub={url:'https://youtube.com/shorts/'+uid('mk'),at:'agora'};render();toast('Publicado (simulado). Nada foi enviado de verdade.');break;
  case 'addsrc':S.modal={t:'src'};render();break;
  case 'savesrc':{const k=$('#mf1').value,l=$('#mf2').value.trim(),x=$('#mf3').value.trim();if(!x){toast('Informe a URL ou o texto.');break}v.sources.push({id:uid('f'),kind:k,label:l||(k==='url'?'Referência':'Texto de apoio'),url:k==='url'?x:'',chars:x.length,hash:Math.random().toString(16).slice(2,6)+'…'+Math.random().toString(16).slice(2,4)});S.modal=null;render();toast('Fonte registrada.');break}
  case 'delsrc':v.sources=v.sources.filter(s=>s.id!==el.dataset.id);render();break;
  case 'retry':{const i=v.steps.findIndex(s=>s.s==='fail');v.steps[i].err=null;S.tab='producao';runPipeline(v,i);render();break}
  case 'niche':S.trendNiche=el.dataset.v;render();break;
  case 'libtab':S.libTab=el.dataset.v;render();break;
  case 'settab':S.setTab=el.dataset.v;render();break;
  case 'linkstyle':c.style=el.dataset.v;render();toast('Estilo vinculado ao canal. Novos vídeos vão herdá-lo.');break;
  case 'linkvoice':c.voice=el.dataset.v;render();toast('Voz padrão do canal atualizada.');break;
  case 'sample':{const k='v-'+el.dataset.v;if(S.playing===k)S.playing=null;else{S.playing=k;clearTimeout(S._pt);S._pt=setTimeout(()=>{if(S.playing===k){S.playing=null;render()}},voice(el.dataset.v).dur*1000)}render();break}
  case 'newstyle':S.modal={t:'style'};render();break;
  case 'savestyle':{const n=$('#mf1').value.trim();if(!n){toast('Dê um nome ao estilo.');break}STYLES.push({id:uid('st'),name:n,desc:$('#mf2').value.trim()||'Estilo personalizado.',emoji:'🖌️',grad:'linear-gradient(135deg,#2b2f55,#3a1f45)',prompt:$('#mf3').value});S.modal=null;render();toast('Estilo criado na biblioteca.');break}
  case 'usetemplate':S.newDraft=Object.assign(newDefaults(),{template:el.dataset.v});go('#/new');break;
  case 'profile':c.profile=el.dataset.v;render();toast('Perfil de produção salvo.');break;
  case 'yt':S.ytConnected=!S.ytConnected;render();toast(S.ytConnected?'YouTube conectado (simulado).':'YouTube desconectado.');break;
  case 'invite':S.modal={t:'invite'};render();break;
  case 'saveinvite':{const e2=$('#mf1').value.trim();if(!e2){toast('Informe o e-mail.');break}S.team.push({n:e2,r:$('#mf2').value});S.modal=null;render();toast('Convite registrado (simulado).');break}
  case 'toast':toast(el.dataset.m);break;
 }
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&S.modal){S.modal=null;render()}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-a],tr[data-a]')){e.preventDefault();e.target.click()}
});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.id==='ntopic'&&S.newDraft){S.newDraft.topic=el.value;return}
 if(el.id==='nscript'&&S.newDraft){S.newDraft.scriptText=el.value;return}
 const a=el.dataset&&el.dataset.a;if(!a)return;const v=vid();
 if(a==='text'){const s=v.scenes.find(x=>x.id===el.dataset.sid);s.text=el.value;if(s.audio==='ok')s.audio='stale';dirty(v);
  const cnt=document.querySelector(`[data-count="${s.id}"]`);if(cnt)cnt.textContent=`${words(s.text)} palavras · ~${secs(s.text)}s`;
  const p=document.querySelector(`[data-audpill="${s.id}"]`);if(p){p.className='pill '+(s.audio==='stale'?'warn':s.audio==='ok'?'ok':'bad');p.textContent=s.audio==='stale'?'Áudio desatualizado':s.audio==='ok'?'✓ Áudio atual':'Sem áudio ainda'}
  updDock(v)}
 else if(a==='prompt'){const s=v.scenes.find(x=>x.id===el.dataset.sid);s.prompt=el.value;dirty(v);updDock(v)}
 else if(a==='brollnote'){const s=v.scenes.find(x=>x.id===el.dataset.sid);s.brollNote=el.value;dirty(v)}
 else if(a==='comp'&&el.type==='range'){v.comp[el.dataset.k]=Number(el.value);dirty(v);const o=$('#'+el.id+'v');if(o)o.textContent=el.value+(el.dataset.k==='musicVol'?'%':'');liveCap(v)}
 else if(a==='meta'){v.meta[el.dataset.k]=el.value;if(el.dataset.k==='title'){const c2=$('#pm1c');if(c2)c2.textContent=el.value.length+'/100'}}
 else if(a==='chf'&&el.type==='range'){const k=el.dataset.k;ch()[k]=Number(el.value);const o=$('#'+el.dataset.out);if(o)o.textContent=el.dataset.pre+(k==='capVideo'?Number(el.value).toFixed(2).replace('.',','):el.value);renderNav()}
 else if(a==='chf'&&el.type==='text'){ch()[el.dataset.k]=el.value;renderNav()}
});
function liveCap(v){const cap=$('#cap');if(!cap)return;const c=v.comp;cap.style.fontSize=Math.round(c.subSize*(v.format==='short'?0.5:0.42))+'px'}
function updDock(v){/* o dock só muda o resumo; re-render parcial barato */const d=document.querySelector('.dock');if(!d)return;const tmp=document.createElement('div');tmp.innerHTML=dock(v,0);if(tmp.firstElementChild)d.replaceWith(tmp.firstElementChild)}
document.addEventListener('change',e=>{
 const el=e.target,a=el.dataset&&el.dataset.a;if(!a)return;const v=vid();
 if(a==='comp'){v.comp[el.dataset.k]=el.dataset.num?Number(el.value):el.value;dirty(v);render()}
 else if(a==='compchk'){v.comp.ducking=el.checked;dirty(v);render()}
 else if(a==='vstyle'){v.style=el.value;dirty(v);render();toast('Estilo deste vídeo alterado (o padrão do canal não mudou).')}
 else if(a==='meta'){v.meta[el.dataset.k]=el.value}
 else if(a==='chf'){ch()[el.dataset.k]=el.dataset.num?Number(el.value):el.value;render();toast('Configuração salva.')}
 else if(a==='nscript'){S.newDraft.script=el.checked;S.newDraft.topic=($('#ntopic')||{}).value||S.newDraft.topic;render()}
 else if(a==='ntemplate'){S.newDraft.template=el.value}
 else if(a==='ndur'){S.newDraft.dur=el.value;render()}
});
$('#chsel').addEventListener('change',e=>{S.ch=e.target.value;S.newDraft=null;if(S.route==='video')go('#/videos');else render()});

route();
</script>
</body>
</html>
