services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 15
  n8n:
    image: docker.n8n.io/n8nio/n8n:1.123.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      GENERIC_TIMEZONE: ${TZ:-America/Sao_Paulo}
      TZ: ${TZ:-America/Sao_Paulo}
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_DIAGNOSTICS_ENABLED: 'false'
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
  renderer:
    build: ./renderer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OUTPUT_DIR: /data/output
      JOB_DIR: /data/jobs
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      VERTEX_PROJECT: ${VERTEX_PROJECT:-}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-global}
      VERTEX_MODEL: ${VERTEX_MODEL:-gemini-2.5-flash}
      OPENCODE_BRIDGE_URL: ${OPENCODE_BRIDGE_URL:-http://host.docker.internal:8787}
      OPENCODE_BRIDGE_TOKEN: ${OPENCODE_BRIDGE_TOKEN:-}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-opencode}
      STUDIO_DATABASE_URL: postgresql://${POSTGRES_USER:-n8n}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-n8n}
      STUDIO_STORAGE_ROOT: /data
      STUDIO_TEXT: ${STUDIO_TEXT:-}
      STUDIO_IMAGE: ${STUDIO_IMAGE:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      STUDIO_PAID_IMAGE_USD: ${STUDIO_PAID_IMAGE_USD:-}
      STUDIO_VEO_USD_PER_SECOND: ${STUDIO_VEO_USD_PER_SECOND:-}
      STUDIO_SOURCE_ALLOWLIST: ${STUDIO_SOURCE_ALLOWLIST:-}
      STUDIO_ALLOW_NAMES: ${STUDIO_ALLOW_NAMES:-}
      MAX_COST_USD_PER_VIDEO: ${MAX_COST_USD_PER_VIDEO:-}
      MAX_COST_USD_PER_MONTH: ${MAX_COST_USD_PER_MONTH:-}
      MAX_DURATION_SECONDS: '60'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./storage:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  pg_data:
  n8n_data:
