services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 15
  n8n:
    image: docker.n8n.io/n8nio/n8n:1.123.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      GENERIC_TIMEZONE: ${TZ:-America/Sao_Paulo}
      TZ: ${TZ:-America/Sao_Paulo}
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_DIAGNOSTICS_ENABLED: 'false'
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
  renderer:
    build: ./renderer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OUTPUT_DIR: /data/output
      JOB_DIR: /data/jobs
      OPENCODE_BRIDGE_URL: ${OPENCODE_BRIDGE_URL:-http://host.docker.internal:8787}
      OPENCODE_BRIDGE_TOKEN: ${OPENCODE_BRIDGE_TOKEN:-}
      STUDIO_DATABASE_URL: postgresql://${POSTGRES_USER:-n8n}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-n8n}
      STUDIO_ALLOWED_HOSTS: ${STUDIO_ALLOWED_HOSTS:-localhost,127.0.0.1,renderer}
      STUDIO_BROWSER_USER: ${STUDIO_BROWSER_USER:-}
      STUDIO_BROWSER_PASSWORD: ${STUDIO_BROWSER_PASSWORD:-}
      STUDIO_WORKER_TOKEN: ${STUDIO_WORKER_TOKEN:-}
      STUDIO_STORAGE_ROOT: /data
      STUDIO_TEXT: ${STUDIO_TEXT:-}
      STUDIO_IMAGE: ${STUDIO_IMAGE:-}
      STUDIO_VOICE: ${STUDIO_VOICE:-}
      STUDIO_RENDERER: ${STUDIO_RENDERER:-}
      PIPER_VOICE: ${PIPER_VOICE:-}
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      STUDIO_PAID_IMAGE_USD: ${STUDIO_PAID_IMAGE_USD:-}
      STUDIO_VEO_USD_PER_SECOND: ${STUDIO_VEO_USD_PER_SECOND:-}
      STUDIO_SOURCE_ALLOWLIST: ${STUDIO_SOURCE_ALLOWLIST:-}
      STUDIO_ALLOW_NAMES: ${STUDIO_ALLOW_NAMES:-}
      MAX_COST_USD_PER_VIDEO: ${MAX_COST_USD_PER_VIDEO:-}
      MAX_COST_USD_PER_MONTH: ${MAX_COST_USD_PER_MONTH:-}
      # R1/P-07 (W0B.1): estas duas variáveis eram lidas pelo código mas NÃO chegavam ao container —
      # sem isso o guard de orçamento nunca ligava e os limites por canal não protegiam nada.
      # Default LIGADO (a prova por teste, inclusive sob concorrência, está em
      # tests/test_budget_guard_wiring.py). PRÉ-REQUISITO: teto definido, em MAX_COST_USD_PER_VIDEO/
      # MAX_COST_USD_PER_MONTH do .env ou em `channel_budgets` do canal — com teto 0 nenhuma chamada
      # paga é executada (403). Desligar: STUDIO_BUDGET_GUARD=0 no .env privado.
      STUDIO_BUDGET_GUARD: ${STUDIO_BUDGET_GUARD:-1}
      STUDIO_PRODUCTION_MODE: ${STUDIO_PRODUCTION_MODE:-BUDGET_GUARDED}
      # R01: contingência de publicação. 1 = ligada (default seguro, igual ao código); 0 desliga o
      # executor de upload (BLOCKED antes de claim/token/upload). NUNCA usar default vazio: vazio = desligado.
      STUDIO_PUBLICATION_ENABLED: ${STUDIO_PUBLICATION_ENABLED:-1}
      # Achado 4 (W0B.1 deixou de fora): estas duas são lidas por `Settings.from_env` e NÃO
      # chegavam ao container. `STUDIO_PROVIDER_PRODUCTION` liga o roteamento de provider em modo
      # produção (exclui demo/placeholder); vazio = desligado (padrão seguro do código).
      # `STUDIO_SECRETS_ROOT` aponta o cofre de segredos (F10-07); vazio = <storage_root>/secrets.
      STUDIO_PROVIDER_PRODUCTION: ${STUDIO_PROVIDER_PRODUCTION:-}
      STUDIO_SECRETS_ROOT: ${STUDIO_SECRETS_ROOT:-}
      MAX_DURATION_SECONDS: '60'
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      # OAuth do Google (F8-05): o client secret é um arquivo montado em /app/credentials (read-only).
      # Estas duas variáveis eram documentadas mas NÃO eram encaminhadas ao container — sem isso,
      # `Settings.google_client_secret_file` fica None e o painel diz "OAuth não configurado".
      STUDIO_GOOGLE_CLIENT_SECRET_FILE: ${STUDIO_GOOGLE_CLIENT_SECRET_FILE:-}
      STUDIO_GOOGLE_OAUTH_REDIRECT_URI: ${STUDIO_GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8000/studio/oauth/callback}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./storage:/data
      - ./credentials:/app/credentials:ro
      # Voz alternativa do Piper: monte o .onnx + .onnx.json em /opt/voices e aponte
      # PIPER_VOICE (ou use STUDIO_VOICE=piper:<nome> para uma voz já em /opt/voices).
      # Veja docs/04-variaveis-de-ambiente.md.
      # - ./voices:/opt/voices:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  pg_data:
  n8n_data:
