name: Secret hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==8.3.5 pydantic==2.11.4
      - run: scripts/check-secrets.sh
      - run: python -m pytest tests/test_secrets_hygiene.py -q
      - run: scripts/package-starter.sh "${RUNNER_TEMP}/starter.zip"
